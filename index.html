fire-resistant synthetic materials.","b":"are dual certified as work uniforms and structural fire fighting clothing.","c":"should not be worn with other types of PPE.","d":"provide a layer of protection against direct flame contact."},"answer":"D"},{"num":819,"text":"Piercing nozzles and cellar nozzles are types of","options":{"a":"broken stream nozzles.","b":"solid stream nozzles.","c":"fog nozzles.","d":"smooth bore nozzles."},"answer":"A"},{"num":820,"text":"The energy released in fire is proportional to the","options":{"a":"amount of fuel available to burn","b":"vapor density in the air","c":"amount of oxygen available","d":"heat release rate of the materials"},"answer":"C"},{"num":821,"text":"The ceilings in corridors designated as exit or egress pathways will have","options":{"a":"a lower fire-resistance rating than the walls in that corridor.","b":"no fire-resistance rating available.","c":"the same fire-resistance rating as the walls in that corridor.","d":"a higher fire-resistance rating than the walls in that corridor."},"answer":"C"},{"num":822,"text":"The first step of the Planning “P” is to:","options":{"a":"develop the Incident Action Plan (IAP).","b":"evaluate and revise the previous plan.","c":"understand the situation.","d":"establish incident objectives and strategies."},"answer":"C"},{"num":823,"text":"The movement of gases during a fire occurs because gases move","options":{"a":"from areas of higher pressure to areas of lower pressure","b":"to the center of the structure","c":"to low-lying areas of high pressure","d":"from areas of lower pressure to areas of higher pressure"},"answer":"A"},{"num":824,"text":"Single ladders are commonly used to","options":{"a":"anchor the bed section of an extension ladder.","b":"access windows on a two-story building.","c":"access attics or crawl spaces in a structure.","d":"lie flat on a roof so firefighters can stand on them."},"answer":"B"},{"num":825,"text":"Why is determining fire cause important?","options":{"a":"Identify monitoring areas","b":"Provide training opportunities","c":"Prevent similar fires in the future","d":"Prosecute offenders"},"answer":"C"},{"num":826,"text":"Which foam proportioning method uses water stream pressure to induct concentrate?","options":{"a":"Premixing","b":"Eduction","c":"Ejection","d":"Injection"},"answer":"B"},{"num":827,"text":"Assigning emergency tasks to personnel or groups based on their skills is an example of:","options":{"a":"division of labor.","b":"organizational flexibility.","c":"unity of command.","d":"scalar structure."},"answer":"A"},{"num":828,"text":"In thermal layering, the hottest gases typically form the","options":{"a":"highest layer","b":"neutral layer","c":"middle layer","d":"lowest layer"},"answer":"A"},{"num":829,"text":"What is one concern associated with a green roof under fire conditions","options":{"a":"The void air space created by the roof layers can conceal a fire in the attic","b":"An increased load accelerating structural failure","c":"The roof panels retain a significant amount of electricity","d":"HVAC units hidden from view add to the collapse potential"},"answer":"B"},{"num":830,"text":"When using dry powder extinguishing agents on Class D fires, remember that:","options":{"a":"the agents may also be used on Class A, B, or C fires.","b":"all agents will need to be applied with either a shovel or a scoop.","c":"water will need to be immediately applied onto any discharged powder.","d":"no single extinguishing agent will control or extinguish fires in all combustible metals."},"answer":"D"},{"num":831,"text":"Which statement is true of the burning characteristics of ground cover fuels?","options":{"a":"Higher moisture fuels ignite more easily","b":"Small or light fuels burn faster than heavier ones","c":"Patchy fuels spread faster than continuous fuels","d":"Compact fuels burn faster"},"answer":"B"},{"num":832,"text":"A firefighter that is NOT qualified or certified to investigate possible evidence must","options":{"a":"recognize what is admissible in court.","b":"wait until fire investigators arrive on scene before securing the scene.","c":"decontaminate the evidence with water while remaining at a safe distance.","d":"know how to preserve evidence until it can be investigated."},"answer":"D"},{"num":833,"text":"An advantage of foam nozzles over fog nozzles is:","options":{"a":"greater reach","b":"lower-expansion foam","c":"higher quality foam","d":"more versatility"},"answer":"C"},{"num":834,"text":"In basements with no exterior access, fire suppression actions should occur","options":{"a":"through exposed windows using either the length of the stream or with an appliance between the hoseline and nozzle.","b":"by stretching a hoseline down exterior stairs and forcing entry into the basement.","c":"by attacking the fire on its own level with a variety of different interior or transitional tactics.","d":"from the top of the interior stairs or by punching a hole through the floor."},"answer":"D"},{"num":835,"text":"What is one of the safety guidelines for hoisting tools and equipment","options":{"a":"Do not hoist a charged hoseline.","b":"Use the hand-over-hand method to maintain control of the rope.","c":"Use a tag line to help hoist a heavy object.","d":"Avoid hand-carrying tools and equipment up stairs or a ladder when hoisting equipment is available."},"answer":"B"},{"num":836,"text":"Metal framing members, metal cladding, and concrete-block wall construction are commonly used in _____ buildings","options":{"a":"Type V","b":"Type II","c":"Type IV","d":"Type III"},"answer":"B"},{"num":837,"text":"Which chain should only be used in rescue operations?","options":{"a":"Hardware","b":"Common","c":"Proof coil","d":"Alloy steel"},"answer":"D"},{"num":838,"text":"At an incident with rapidly evolving situations, responders should address each other","options":{"a":"by job title.","b":"according to their designations at the scene.","c":"according to their rank in the organization.","d":"by name."},"answer":"B"},{"num":839,"text":"The purpose of the United States Fire Administration’s National Fire Incident Reporting System (NFIRS) is to:","options":{"a":"create data for analyses and assist in addressing the nation’s fire problem.","b":"provide consistency for national code reporting.","c":"keep a record of all fire response-related costs.","d":"document criminal incidents for legal proceedings."},"answer":"A"},{"num":840,"text":"Pike poles may be used during ventilation to:","options":{"a":"cut through obstacles on roofs.","b":"force doors.","c":"open holes in the roof decking.","d":"pull or open ceilings."},"answer":"D"},{"num":841,"text":"VEIS is usually chosen","options":{"a":"if other methods fail.","b":"during backdraft conditions.","c":"with credible reports of victims in survivable areas.","d":"if interior access is unsafe."},"answer":"C"},{"num":842,"text":"After opening the hoistway doors, the first step in evacuating trapped occupants from an elevator is:","options":{"a":"aligning the elevator doors to the open hoistway door","b":"turning all power back on","c":"locking/tagging out the elevators","d":"aligning the elevator car with the elevator doors"},"answer":"A"},{"num":843,"text":"What causes spot fires?","options":{"a":"Fire burning along the outside edge","b":"Flying sparks or embers landing outside the main fire","c":"Burned material scattered into the black","d":"Fire burning into mixed fuel areas"},"answer":"B"},{"num":844,"text":"A portable water tank for a mobile water supply operation must be set up","options":{"a":"downhill and downwind from the fire scene.","b":"with intake strainers attached to the supply hose.","c":"so that only one mobile water supply apparatus can offload at a time.","d":"to allow easy access from multiple directions, but not block other apparatus from the fire scene."},"answer":"D"},{"num":845,"text":"Handline streams produce flows rated less than _____ while master streams discharge flow rates above that number","options":{"a":"500 gpm (2 000 L/min)","b":"200 gpm (800 L/min)","c":"150 gpm (600 L/min)","d":"350 gpm (1 400 L/min)"},"answer":"D"},{"num":846,"text":"What is one method for shutting off the power to hybrid vehicles?","options":{"a":"Apply water to the battery","b":"Turn the ignition off and remove the key","c":"Cut the orange cable","d":"Disable the fuel shutoff valve"},"answer":"B"},{"num":847,"text":"Why should firefighters working in the exhaust portion of the flow path limit their time there","options":{"a":"Visibility is lessened in these areas of heavy smoke","b":"Firefighter SCBA is more likely to fail in these areas of heavy smoke","c":"Increased convective heat transfer can make conditions unsurvivable even in PPE","d":"Smoke explosions will likely occur in the exhaust portion of the flow path"},"answer":"C"},{"num":848,"text":"To create an audience-centered fire and life safety presentation, firefighters should:","options":{"a":"teach fire service terminology","b":"talk to the audience on their level","c":"strictly follow the lesson plan","d":"address individuals instead of the group"},"answer":"B"},{"num":849,"text":"General maintenance requirements for ground ladders include","options":{"a":"painting the tip and butt of the beams to keep them from wear.","b":"storing ladders on the apparatus near the engine for quick loading and unloading.","c":"storing ladders fully extended and with hooks out.","d":"keeping ground ladders free of moisture."},"answer":"D"},{"num":850,"text":"When deploying preconnected hoselines, the _____ load deploys without dragging the hose on the ground","options":{"a":"minuteman","b":"accordion","c":"triple-layer","d":"Horseshoe"},"answer":"A"},{"num":851,"text":"The principle of “try before you pry” means to","options":{"a":"try all other methods of forcible entry before resorting to prying.","b":"try breaking door or window glass before prying.","c":"check if the building owner or occupant is available to unlock the door or window before attempting forcible entry.","d":"check if the door or window is unlocked before attempting forcible entry."},"answer":"D"},{"num":852,"text":"A Fire Fighter II can preserve evidence by:","options":{"a":"securing the scene","b":"moving evidence","c":"decontaminating evidence","d":"conducting overhaul"},"answer":"A"},{"num":853,"text":"What should you do if your SCBA cylinder is empty during a MAYDAY?","options":{"a":"Break the seal of your mask and breathe through your protective hood.","b":"Remove your regulator.","c":"Break the seal and cover your mouth.","d":"Remove your mask and hold breaths."},"answer":"A"},{"num":854,"text":"How can the construction of manufactured or mobile homes affect fire behavior","options":{"a":"Fire may spread more quickly because of fewer internal walls and interior finishes.","b":"Open crawl spaces help ventilate the fire and keep it from spreading.","c":"They do not conform to any building code, which makes it difficult to predict fire behavior.","d":"If lightweight building materials are used, the home is less likely to fail during fire conditions."},"answer":"A"},{"num":855,"text":"What is an example of an exothermic reaction","options":{"a":"Evaporation","b":"Steam","c":"Fire","d":"Melting"},"answer":"C"},{"num":856,"text":"Unplanned ventilation occurs when","options":{"a":"contents are extinguished","b":"a door in the exhaust flow path is left open","c":"extinguishing agents are applied on hot fire gases","d":"a window or roof fails"},"answer":"D"},{"num":857,"text":"The period between SCBA inspections must NOT exceed","options":{"a":"one month.","b":"one week.","c":"six months.","d":"two weeks."},"answer":"B"},{"num":858,"text":"Which part of rope is used to tie a knot","options":{"a":"Running part","b":"Working end","c":"Tag end","d":"Standing part"},"answer":"B"},{"num":859,"text":"Which vehicle component is a focal point of many extrication scenarios?","options":{"a":"Fenders","b":"Hinges","c":"Firewalls","d":"Rocker panels"},"answer":"B"},{"num":860,"text":"To remain mentally fit and healthy and reduce stress, firefighters need to","options":{"a":"build resilience.","b":"use the Critical Incident Stress Management (CISM) method.","c":"learn how to cope on their own.","d":"avoid any type of event that has the potential to be stressful."},"answer":"A"},{"num":861,"text":"The Health Insurance Portability and Accountability Act (HIPAA):","options":{"a":"provides firefighters with insurance against fraudulent medical claims","b":"does not apply to firefighters","c":"establishes regulations on protected health information (PHI)","d":"only applies to healthcare providers"},"answer":"C"},{"num":862,"text":"Which type of extinguishing agent is acceptable for extinguishing Class K fires?","options":{"a":"Carbon dioxide","b":"Aqueous film forming foam (AFFF)","c":"Wet chemical","d":"Dry chemical"},"answer":"C"},{"num":863,"text":"Which question would the first arriving firefighter ask during initial size-up of a structure fire?","options":{"a":"Was the fire intentionally set?","b":"Is the fire ventilated and at what location?","c":"What tools and equipment are needed for overhaul?","d":"Who will be the Incident Commander?"},"answer":"B"},{"num":864,"text":"Where does the search for the area of origin begin at a structure fire?","options":{"a":"Inside where air is clearest","b":"Outside or in unburned interior areas","c":"Outside where most debris exists","d":"Inside at the area of greatest damage"},"answer":"B"},{"num":865,"text":"Which type of roof is elevated in the center along a ridge line with a roof deck that slopes down to the eaves along the roof edges","options":{"a":"Photovoltaic","b":"Arched","c":"Greenhouse","d":"Pitched"},"answer":"D"},{"num":866,"text":"Any container valve operation must be performed:","options":{"a":"after suppression","b":"immediately","c":"with facility personnel supervision","d":"by hazmat technicians"},"answer":"C"},{"num":867,"text":"When a fire attack crew moves to a building entrance:","options":{"a":"the door should be opened to see if there are signs of heat and fire at that entrance","b":"they should stay low and out of the doorway","c":"the hoseline should be charged after the door is opened","d":"they should perform negative pressure ventilation"},"answer":"B"},{"num":868,"text":"The safest way to cut power to a structure is to follow SOPs and:","options":{"a":"shut down the meter","b":"allow the ISO to shut it down","c":"contact the electrical company to perform the shutdown","d":"have the owner shut it down"},"answer":"C"},{"num":869,"text":"How are portable radios different from other types of radio systems","options":{"a":"They have better performance than mobile and base station radios.","b":"They are intrinsically safer than mobile and base station radios.","c":"They are powered by vehicle electrical systems rather than a building's electrical system.","d":"They are powered by battery packs rather than an electrical system."},"answer":"D"},{"num":870,"text":"How can a fire's location within a building influence fire development","options":{"a":"Fires in the upper level will generally extend downward much more slowly","b":"Fuels in the lower level of a structure will pyrolize more quickly because of heat radiating from the hot gas layer","c":"Fuels in the upper level of a structure will pyrolize more slowly because of heat radiating from the hot gas layer","d":"Convected heat currents in the lower levels of a building will cause horizontal extension"},"answer":"A"},{"num":871,"text":"Which standpipe system is designed for use by trained fire suppression personnel?","options":{"a":"Class II","b":"Class III","c":"Class IV","d":"Class I"},"answer":"D"},{"num":872,"text":"Which end of a threaded hose coupling is cut on the interior surface of a swivel","options":{"a":"Male","b":"Female","c":"Storz","d":"Higbee"},"answer":"B"},{"num":873,"text":"Which type of materials are likely to produce toxic levels of hydrogen cyanide when under burning conditions","options":{"a":"Wood","b":"Brick and concrete","c":"Metal","d":"Upholstered furniture and carpets"},"answer":"D"},{"num":874,"text":"What happens if a ladder's butt is placed at an angle greater than 75 degrees","options":{"a":"The top of the ladder can hold more weight.","b":"The ladder may slip.","c":"There is less stress placed on the ladder.","d":"The ladder tip may pull away from the building."},"answer":"B"},{"num":875,"text":"An Enhanced 9-1-1 (E-9-1-1) public alerting system combines telephone and computer equipment to provide dispatchers with information such as","options":{"a":"the nearest responders available.","b":"number of people involved in the emergency.","c":"types of hazards or potential threats at the scene.","d":"the caller's location."},"answer":"D"},{"num":876,"text":"What is an unsafe condition that should be noted in a home safety survey?","options":{"a":"Nonworking smoke detectors","b":"Use of sparking power tools","c":"Older construction types","d":"Attic void spaces"},"answer":"A"},{"num":877,"text":"What can make lightweight concrete roofs challenging for firefighters","options":{"a":"They are extremely difficult to penetrate for ventilation procedures.","b":"They do not develop their design strength until after they have been placed, resulting in a higher risk of failure.","c":"They are not watertight and will fail during fire suppression activities.","d":"They are highly flammable and will fail quickly."},"answer":"A"},{"num":878,"text":"During ground cover firefighting, if an oil well or pipeline is exposed to fire, firefighters should:","options":{"a":"apply foam","b":"treat it as a hazardous materials incident and withdraw","c":"treat it as a standard ground cover fire","d":"apply water with a master stream"},"answer":"B"},{"num":879,"text":"Storz couplings are similar to quarter-turn couplings except that","options":{"a":"male and female couplings are used to make the connection in a Storz coupling.","b":"the locking components of Storz couplings consist of grooved lugs and inset rings built into each swivel.","c":"Storz couplings have threaded ends.","d":"Storz couplings are not found on large diameter hose."},"answer":"B"},{"num":880,"text":"When fire suppression and salvage are performed simultaneously, opening and closing doors to carry building contents outside","options":{"a":"takes time and effort, so doors should be propped open.","b":"may interfere with the flow path.","c":"should be done as the last step to prevent interference with operations.","d":"will have no effect on fire growth."},"answer":"B"},{"num":881,"text":"Proficiency training and evaluations are required ____, or whenever policies, procedures, or guidelines are updated to ensure that members maintain their knowledge and skills","options":{"a":"annually","b":"after any incident","c":"weekly","d":"Monthly"},"answer":"A"},{"num":882,"text":"Which product of complete combustion can displace oxygen, creating an oxygen-deficient atmosphere","options":{"a":"Nitrogen","b":"Heat","c":"Carbon dioxide","d":"Vapor"},"answer":"C"},{"num":883,"text":"The number of subordinates within a supervisor’s control is usually:","options":{"a":"three to seven.","b":"three to five.","c":"one to three.","d":"ten to fifteen."},"answer":"A"},{"num":884,"text":"What type of information should a dispatcher gather from an emergency call","options":{"a":"The home address of the caller","b":"Who is at fault for the emergency","c":"What type of personnel the caller would like to respond to the emergency","d":"The number and location of people involved"},"answer":"D"},{"num":885,"text":"Lakes, ponds, and rivers are all static water sources that","options":{"a":"may provide water through drafting operations.","b":"may NOT be used for drafting because the water is nonpotable.","c":"should be used as a last resort because of potential contaminants.","d":"can be used if chemicals are added to purify the water."},"answer":"A"},{"num":886,"text":"One additional advantage of structural fire fighting helmets is that they can","options":{"a":"help identify personnel.","b":"be donned without securing or tightening any straps.","c":"eliminate the need for protective hoods if ear flaps are folded down.","d":"also be used at wildland fires."},"answer":"A"},{"num":887,"text":"Because there are more occupants in high-rise buildings than in other structures:","options":{"a":"tactical ventilation is rarely a viable option.","b":"natural ventilation methods must be used.","c":"occupants must be evacuated before beginning ventilation.","d":"life safety considerations during ventilation are an even higher priority."},"answer":"D"},{"num":888,"text":"How does advancing a hose down a stairway differ from advancing a hose up a stairway","options":{"a":"Once the fire floor is reached, excess hose should be stretched outside the stairway instead of above the stairway.","b":"When advancing a hose down a stairway, the hoseline must be uncharged.","c":"When advancing a hose down a stairway, the hoseline must be charged.","d":"Once the fire floor is reached, excess hose should be stretched below the stairway instead of above the stairway."},"answer":"A"},{"num":889,"text":"When crawling on stairs","options":{"a":"keep limbs together.","b":"go headfirst both ways.","c":"headfirst up, feet first down.","d":"move sideways."},"answer":"C"},{"num":890,"text":"When the first firefighter arrives on the scene, they should:","options":{"a":"secure the scene and evacuate.","b":"begin suppression until IC arrives.","c":"act as the Incident Commander and establish command.","d":"wait for an IC."},"answer":"C"},{"num":891,"text":"Class B foam blankets prevent or reduce the release of flammable vapors by:","options":{"a":"smothering","b":"separating","c":"penetrating","d":"cooling"},"answer":"A"},{"num":892,"text":"What should you do if you are in a flat field and you get an indication lightning is about to strike?","options":{"a":"Drop to your knees and bend forward, putting your hands on your thighs","b":"Lie flat on your belly with your arms fully spread out","c":"Curl into a ball, tucking your knees up to your chin","d":"Lie flat on your back with your arms fully spread out"},"answer":"A"},{"num":893,"text":"To prevent rapid fire development from occurring:","options":{"a":"multiple ventilation points should be created.","b":"interior doors must be fully opened during tactical ventilation.","c":"ventilation must be coordinated with the appropriate water stream techniques.","d":"the structure or compartment must be allowed to burn with adequate ventilation."},"answer":"C"},{"num":894,"text":"An advantage of fog nozzles for foam application is:","options":{"a":"higher quality foam","b":"greater reach","c":"less maintenance","d":"optimal expansion"},"answer":"B"},{"num":895,"text":"Multigas monitors","options":{"a":"are hazmat-only.","b":"are slow.","c":"detect gases and oxygen.","d":"cannot measure oxygen."},"answer":"C"},{"num":896,"text":"To increase the area of coverage of a radio, _____ can be used","options":{"a":"inverters","b":"portable antennas","c":"converters","d":"repeaters"},"answer":"D"},{"num":897,"text":"Upon arrival at a technical rescue incident, firefighters should:","options":{"a":"conduct a size-up","b":"transfer command","c":"mitigate hazards","d":"begin rescue"},"answer":"A"},{"num":898,"text":"What should be done to avoid age deterioration in fire hose","options":{"a":"Fire hose should be loaded using an accordion load.","b":"Fire hose should be unrolled and left hanging in a hose tower intermittently.","c":"Unused hose loads should be removed and repacked on a regular schedule.","d":"Hose loads should be removed and replaced with new hose annually."},"answer":"C"},{"num":899,"text":"In NIMS-ICS, when might the Intelligence/Investigation Section be established at an incident","options":{"a":"It should be established at all incidents","b":"After all evidence has been collected or removed","c":"If the Command Section is not available","d":"If criminal activity is suspected"},"answer":"D"},{"num":900,"text":"Quality foam production requires blending foam concentrate, water, and:","options":{"a":"dry chemical","b":"air","c":"carbon dioxide","d":"fuel"},"answer":"B"},{"num":901,"text":"What is used to create an anchor point above an access hatch?","options":{"a":"Whizzer saw","b":"Rotary saw","c":"Air chisel","d":"Rescue tripod"},"answer":"D"},{"num":902,"text":"Fires in basements may be more difficult and dangerous primarily because of the increased risk of:","options":{"a":"ventilation-related hazards","b":"structural collapse","c":"hazardous materials","d":"smoke inhalation hazards"},"answer":"B"},{"num":903,"text":"Class B fires involve:","options":{"a":"ordinary combustibles.","b":"combustible metals and alloys.","c":"combustible cooking oils.","d":"flammable and combustible liquids and gases."},"answer":"D"},{"num":904,"text":"Which part of a ground cover fire is created when fire burns into areas of mixed fuel loads?","options":{"a":"Finger","b":"Flank","c":"Perimeter","d":"Island"},"answer":"A"},{"num":905,"text":"A reverse hose lay should be","options":{"a":"performed in such a way that the pump operator can leave the pumper and perform other activities.","b":"deployed from the water source to the incident scene.","c":"loaded so that the first coupling off the hose bed is female.","d":"deployed from the incident scene to the water source."},"answer":"D"},{"num":906,"text":"What is the most basic unit of fire fighting operations","options":{"a":"Battalion","b":"Operations division","c":"Company","d":"Response district"},"answer":"C"},{"num":907,"text":"How can fire walls work to stop the spread of fire in a structure","options":{"a":"They help to buffer fire doors in a structure in order to increase the fire resistance of the fire doors.","b":"They can divide the structure into smaller portions and contain a fire to a particular portion of the structure.","c":"They allow firefighters to penetrate the wall with fire suppression tools without affecting the fire flow.","d":"They are fire resistant, but easily penetrable if firefighters need to move through them."},"answer":"B"},{"num":908,"text":"Which power saw is useful for cutting shoring material?","options":{"a":"Reciprocating","b":"Circular","c":"Whizzer","d":"Rotary"},"answer":"B"},{"num":909,"text":"To overcome some wearer limitations of SCBA, wearers should","options":{"a":"use lightweight SCBA units.","b":"avoid donning the air cylinder during training activities.","c":"be in good physical condition.","d":"avoid filling the air cylinder to capacity"},"answer":"C"},{"num":910,"text":"If entangled while evacuating","options":{"a":"broadcast and self-extricate.","b":"shelter in place.","c":"remove SCBA.","d":"wait for RIC."},"answer":"A"},{"num":911,"text":"Which statement is true of an interior examination of a structure fire?","options":{"a":"Heavily charred flooring indicates the area of origin","b":"Multiple origins always indicate arson","c":"Floors normally suffer less damage than ceilings","d":"Ceilings show the least damage where the fire burned longest"},"answer":"C"},{"num":912,"text":"What might a very low-level neutral plane indicate about a fire's behavior","options":{"a":"The fire is reaching backdraft conditions","b":"The compartment has not yet been ventilated","c":"The fire is in the early stages of development","d":"Flashover is approaching"},"answer":"A"},{"num":913,"text":"Because it can disturb or destroy evidence, firefighters may need to delay _____ if the origin and cause have not been determined.","options":{"a":"fire extinguishment","b":"overhaul","c":"search and rescue","d":"evacuation"},"answer":"B"},{"num":914,"text":"To stabilize a vehicle with a manual transmission, put the vehicle in:","options":{"a":"neutral","b":"the highest gear","c":"reverse","d":"first gear"},"answer":"D"},{"num":915,"text":"Combustible metals and alloys such as titanium and magnesium are found in _____ fires.","options":{"a":"Class C","b":"Class K","c":"Class B","d":"Class D"},"answer":"D"},{"num":916,"text":"Engineered wood products such as joists, glulam, and laminates","options":{"a":"can be used to insulate other wood and steel structural members","b":"do not contribute to the fuel load","c":"can rapidly deteriorate under fire conditions","d":"do not ignite or burn as rapidly as other wood framing materials"},"answer":"C"},{"num":917,"text":"When fire attack crews are assigned to interior fire suppression or operations in an IDLH environment, what other operational assignment should be assigned?","options":{"a":"Rapid intervention crew (RIC)","b":"Personnel accountability","c":"Support function","d":"Search and rescue"},"answer":"A"},{"num":918,"text":"Which type of supervising station alarm is wired into a common receiving point operated by the facility owner?","options":{"a":"Zoned/annunciated receiving system","b":"Central station alarm system","c":"Proprietary alarm system","d":"Remote receiving system"},"answer":"C"},{"num":919,"text":"During a structural search, what should you do if you encounter a room NOT involved in the fire","options":{"a":"Mark the room as safe for sheltering in place.","b":"Direct heat and smoke into the room.","c":"Close the door unless it is being used for ventilation.","d":"Leave the door open."},"answer":"C"},{"num":920,"text":"Which incident type can be mitigated using local resources?","options":{"a":"Type 2","b":"Type 5","c":"Type 1","d":"Type 3"},"answer":"B"},{"num":921,"text":"One advantage of forcing entry through windows is that windows","options":{"a":"are a better entry point into a burning building.","b":"do not require size-up before breaking the glass.","c":"are easier to force than doors.","d":"create less of a flow path when broken."},"answer":"C"},{"num":922,"text":"Which type of roof has a slight slope to facilitate drainage and is commonly found on commercial, industrial, and multifamily structures","options":{"a":"Flat","b":"Cold","c":"Pitched","d":"Arched"},"answer":"A"},{"num":923,"text":"What tools or equipment are prohibited from being hoisted with rope and webbing","options":{"a":"Charged hoselines","b":"SCBA cylinders","c":"Ladders","d":"Power saws"},"answer":"B"},{"num":924,"text":"For a three-firefighter raise, where should the third firefighter be placed","options":{"a":"At the butt","b":"Under the rungs","c":"Along the beam","d":"At the tip"},"answer":"C"},{"num":925,"text":"Which type of knot is preferred for joining two pieces of webbing or the ends of the same piece of webbing when a loop is needed","options":{"a":"Figure-eight on a bight","b":"Water knot","c":"Figure-eight follow-through","d":"Half-hitch"},"answer":"B"},{"num":926,"text":"When donning an SCBA facepiece, firefighters should","options":{"a":"pull facepiece straps outward and to the sides.","b":"tighten the lower straps first.","c":"tighten the temple straps first.","d":"ensure harness or straps are over the protective hood."},"answer":"B"},{"num":927,"text":"Ventilation crews should always know the location of interior crews so that the:","options":{"a":"interior crews can work as backup to ventilation crews.","b":"interior crews can evacuate before ventilation begins.","c":"two crews are not working at the same time.","d":"ventilation crews do not change the flow path to an area where interior crews are working."},"answer":"D"},{"num":928,"text":"What action should be taken first if a victim is discovered during interior fire control?","options":{"a":"Continue suppression activities.","b":"Communicate the victim’s location to the IC or rescue crew.","c":"Split the crew for rescue and attack.","d":"Immediately withdraw."},"answer":"B"},{"num":929,"text":"Firefighters must undergo field reduction of contaminants","options":{"a":"to avoid appearing unprofessional to the public.","b":"before conducting overhaul operations.","c":"to prevent exposing themselves and others to carcinogens.","d":"after leaving the scene."},"answer":"C"},{"num":930,"text":"When performing chest compressions on an adult:","options":{"a":"use only one hand to avoid injuring the victim","b":"press down on the chest as hard as you can","c":"the patient must be lying on their back on a soft surface","d":"the patient must be lying on their back on a hard surface"},"answer":"D"},{"num":931,"text":"The International Association of Fire Chiefs (IAFC) initiated a(an) ______ to focus on firefighter safety","options":{"a":"Fire Fighter Safety Stand Down","b":"Everyone Goes Home program","c":"Fire and Life Safety Initiative program","d":"Cancer Support Network"},"answer":"A"},{"num":932,"text":"To control egress passageways","options":{"a":"suppress all fires.","b":"station a firefighter at the door.","c":"open adjacent doors.","d":"leave doors partially open."},"answer":"B"},{"num":933,"text":"In a structure fire with a single open doorway, the _____ is the lower portion of the doorway.","options":{"a":"exhaust vent","b":"high pressure area","c":"air intake","d":"neutral plane"},"answer":"C"},{"num":934,"text":"An example of employing a defensive strategy is:","options":{"a":"attacking a structure fire from the upwind side.","b":"protecting exposures and containing fires already in the area.","c":"using exterior fire control prior to interior suppression.","d":"attacking a fire directly to conduct a search."},"answer":"B"},{"num":935,"text":"Firefighters must wear hearing protection when:","options":{"a":"conducting apparatus pump operations.","b":"listening for changes in fire behavior.","c":"hearing radio transmissions.","d":"conducting any fire fighting operations."},"answer":"A"},{"num":936,"text":"The minimum requirements for a fire department safety and health program are specified by","options":{"a":"NFPA 1010.","b":"the Occupational Safety and Health Administration (OSHA).","c":"the National Fallen Firefighters Foundation (NFFF).","d":"NFPA 1550."},"answer":"D"},{"num":937,"text":"One disadvantage of hydraulic ventilation is that:","options":{"a":"firefighters operating the nozzle must remain in the heated, hazardous atmosphere throughout the operation.","b":"operations require additional equipment and personnel.","c":"it is the least effective and riskiest type of ventilation.","d":"it cannot clear a room or building of smoke, heat, steam, and gases."},"answer":"A"},{"num":938,"text":"Which tool would be most appropriate for clearing wire glass out of a window","options":{"a":"Pickhead axe","b":"Pike pole","c":"Hand saw","d":"Power saw"},"answer":"A"},{"num":939,"text":"When using a fire hose in extreme cold conditions,","options":{"a":"keep hose connections looser so they do not burst if water freezes in the hose.","b":"avoid rolling hose after use to prevent the hose from freezing in that position.","c":"allow a constant flow of high-pressure water through the nozzle to prevent water from freezing inside the hose.","d":"allow a constant low flow of water through the nozzle to prevent water from freezing inside the hose."},"answer":"D"},{"num":940,"text":"When carrying ground ladders","options":{"a":"keep the forward end of the ladder at eye level.","b":"carry roof ladders with the hooks open.","c":"carry ladders with the top end first","d":"identify one member of your lift team as a team leader."},"answer":"D"},{"num":941,"text":"When ventilation does NOT release heat and smoke directly above the fire:","options":{"a":"the smoke should be routed towards windows or openings of adjacent exposures.","b":"some routing of the smoke becomes necessary.","c":"multiple ventilation points must be created.","d":"the smoke will need to travel the same route as occupants and firefighters."},"answer":"B"},{"num":942,"text":"Which part of a ground cover fire is the area of unburned fuels next to the involved area?","options":{"a":"Black","b":"Green","c":"Flank","d":"Heel"},"answer":"B"},{"num":943,"text":"For piloted ignition to occur, the mixture of fuel and oxygen","options":{"a":"does not need an external flame or spark to ignite","b":"must off-gas before ignition","c":"cannot have an autoignition temperature higher than the piloted ignition temperature","d":"must encounter an external heat source to start the combustion reaction"},"answer":"D"},{"num":944,"text":"The ideal fire hose test site should be:","options":{"a":"paved with a slight grade","b":"grass or dirt with a slight grade","c":"paved with no grade","d":"grass or dirt with no grade"},"answer":"A"},{"num":945,"text":"Which tool is used when pushing farther than spreaders allow?","options":{"a":"Extension ram","b":"Pneumatic bag","c":"Combination tool","d":"Hydraulic jack"},"answer":"A"},{"num":946,"text":"What is a maintenance responsibility of a Firefighter II?","options":{"a":"Making modifications to lighting equipment","b":"Keeping battery packs halfway charged","c":"Documenting maintenance on appropriate forms or records","d":"Performing generator repairs"},"answer":"C"},{"num":947,"text":"The feasibility of opening a floor during a firefighting operation depends upon:","options":{"a":"the type of ventilation required and the tools available.","b":"the location of the fire and smoke.","c":"the number of occupants in the basement.","d":"how it was constructed and from what material."},"answer":"D"},{"num":948,"text":"Which pulling tool has the greatest pulling distance?","options":{"a":"Come-along","b":"Pneumatic puller","c":"Winch","d":"Chain"},"answer":"C"},{"num":949,"text":"The use of negative-pressure ventilation (NPV):","options":{"a":"typically requires gas-powered fans.","b":"requires the opening around the ventilation fan to be sealed.","c":"works best on fires confined to an adequately vented compartment.","d":"is most effective for removing smoke from a structure."},"answer":"B"},{"num":950,"text":"In order to protect any potential evidence from being disturbed until an investigator arrives, firefighters should","options":{"a":"not disturb evidence unless absolutely necessary.","b":"avoid extinguishing any fire that is threatening the destruction of evidence.","c":"immediately collect evidence and bag it for later analysis.","d":"apply water to the evidence to protect it from burning."},"answer":"A"},{"num":951,"text":"Of the three supply hose loads, the _____ load is the easiest to load","options":{"a":"flat","b":"combination","c":"accordion","d":"Horseshoe"},"answer":"A"},{"num":952,"text":"What hazard is associated with cutting the steering wheel ring?","options":{"a":"Fuel leaks","b":"Structural weakness","c":"Accidental air bag deployment","d":"HPS activation"},"answer":"C"},{"num":953,"text":"The primary function of the emergency medical responder is to:","options":{"a":"maintain life until more highly trained personnel arrive on scene","b":"administer intravenous fluids and narcotics per physician order and standard protocols","c":"transport patients to the hospital","d":"provide basic life support (BLS) to ill or injured patients"},"answer":"A"},{"num":954,"text":"When determining the area of origin, firefighters should:","options":{"a":"remove all debris","b":"continue overhaul operations","c":"find the area of greatest damage","d":"look for ignition sources"},"answer":"D"},{"num":955,"text":"The primary danger in moving injured victims quickly is","options":{"a":"aggravating spinal injuries.","b":"firefighter injury.","c":"lack of assessment.","d":"improper pulling angle."},"answer":"A"},{"num":956,"text":"Firefighters should attack a fire:","options":{"a":"facing the wind.","b":"on the unburned side.","c":"on the burned side.","d":"with the wind at their backs."},"answer":"D"},{"num":957,"text":"Structural fire fighting boots","options":{"a":"require thermal, physical, and moisture barriers inside the shell.","b":"must have the boot tops worn outside the trouser legs.","c":"are equipped with retroreflective trim.","d":"do not use steel because of its tendency to absorb heat."},"answer":"A"},{"num":958,"text":"When presenting fire and life safety messages:","options":{"a":"do not admit when you do not know an answer","b":"present all material before questions","c":"use negative messages","d":"use positive messages to instruct actions"},"answer":"D"},{"num":959,"text":"During fire fighting operations, what is the primary eye protection","options":{"a":"Helmet-mounted faceshield","b":"Goggles","c":"Safety glasses","d":"SCBA facepiece"},"answer":"D"},{"num":960,"text":"After locating a downed firefighter, the RIC should first","options":{"a":"contact Command.","b":"check the firefighter's air supply.","c":"stabilize the firefighter's injuries, if necessary.","d":"remove the firefighter's SCBA."},"answer":"B"},{"num":961,"text":"What is the purpose of exterior fire control?","options":{"a":"Provide exposure protection to adjacent structures","b":"Transition a fire from ventilation-limited to fuel-limited","c":"Reduce the fire hazard inside a structure from the exterior","d":"Extinguish any exterior fire"},"answer":"C"},{"num":962,"text":"Evacuation signals at an incident scene are:","options":{"a":"only broadcast by the Incident Safety Officer.","b":"mainly used to notify bystanders and ambulatory victims of an emergency situation.","c":"most commonly transmitted over a loud speaker.","d":"used when the IC determines firefighters must withdraw due to hazardous conditions."},"answer":"D"},{"num":963,"text":"Atmosphere-supplying respirators (ASRs)","options":{"a":"are the least common type of respiratory protection you will use in the fire service.","b":"only filter particulates out of the surrounding air.","c":"are NOT recommended for fire fighting operations.","d":"provide breathable air when working in oxygen-deficient, toxic, or gas-filled atmospheres."},"answer":"D"},{"num":964,"text":"During a fire, protected or enclosed stairs","options":{"a":"provide a means of egress, but do not provide protection for occupants.","b":"are to only be used as access or convenience stairs.","c":"are built to resist the spread of fire and smoke.","d":"are not a part of the means of egress system."},"answer":"C"},{"num":965,"text":"Which type of hose load permits the apparatus to make a forward lay from the water source to the fire, followed by a reverse lay back to the water source","options":{"a":"Flat","b":"Combination","c":"Accordion","d":"Horseshoe"},"answer":"B"},{"num":966,"text":"Which type of communicable disease is an inflammation of the liver and can be caused by consuming contaminated food or water or by close contact with infected individuals?","options":{"a":"Staph infection","b":"HIV/AIDS","c":"Tuberculosis (TB)","d":"Hepatitis A"},"answer":"D"},{"num":967,"text":"Care and maintenance of unprotected metal surfaces on forcible entry tools includes","options":{"a":"using an emery cloth or steel wool to remove dirt and rust.","b":"using a mechanical grinder to sharpen the blade edge.","c":"washing blades with mild detergent, rinsing, and drying them.","d":"applying oil to the striking surface of the tools."},"answer":"A"},{"num":968,"text":"While mounting an apparatus, you should","options":{"a":"make sure the apparatus is not running.","b":"be wearing all your PPE.","c":"face away from the apparatus.","d":"maintain three points of contact."},"answer":"D"},{"num":969,"text":"The cooling extinguishing method:","options":{"a":"interrupts the chemical chain reaction in the burning process.","b":"uses cold water to interrupt the combustion process.","c":"reduces the burning material below its ignition temperature.","d":"excludes oxygen from the burning process."},"answer":"C"},{"num":970,"text":"Vehicle overhaul should begin","options":{"a":"once all fires have been extinguished.","b":"in the area of least fire damage.","c":"in the engine compartment.","d":"once the IC gives the order."},"answer":"D"},{"num":971,"text":"Which preconnected hose load is mounted on the apparatus and provides instant water flow no matter what length of hose is needed","options":{"a":"Triple layer","b":"Booster hose","c":"Minuteman","d":"Preconnected flat"},"answer":"B"},{"num":972,"text":"Adapters are hose fittings that","options":{"a":"support intake or discharge hose at the pumping apparatus.","b":"connect hose couplings with similar threads and the same inside diameter.","c":"connect a small-diameter hoseline to the end of a larger one.","d":"prevent attack line kinks."},"answer":"B"},{"num":973,"text":"Once ignition occurs and the combustion process begins, development in the ____ stage depends largely on the characteristics and configuration of the fuel involved","options":{"a":"decay","b":"growth","c":"fully-developed","d":"incipient"},"answer":"D"},{"num":974,"text":"When a fire becomes ventilation-limited in a compartment,","options":{"a":"the environment is tenable for firefighters with full PPE and SCBA","b":"it can still reignite if more oxygen is introduced into the compartment","c":"the pyrolysis process is stopped","d":"the heat release rate increases rapidly"},"answer":"B"},{"num":975,"text":"During an interior examination of a structure fire, investigators work from:","options":{"a":"least damage to greatest damage","b":"ceiling to floor","c":"floor to ceiling","d":"greatest damage to least damage"},"answer":"A"},{"num":976,"text":"When loading hose on fire apparatus,","options":{"a":"tighten the couplings hand tight.","b":"pack hose tightly.","c":"load large diameter hose with all couplings near the rear of the hose bed.","d":"make sure lugs on the couplings are aligned."},"answer":"A"},{"num":977,"text":"A stored-pressure water extinguisher is useful for extinguishing:","options":{"a":"confined hot spots during overhaul operations.","b":"commercial kitchen fires.","c":"fires that involve energized electrical equipment.","d":"vapors and fires from small liquid fuel spills."},"answer":"A"},{"num":978,"text":"If a patient is unresponsive and not breathing, the responder should check the _____ first.","options":{"a":"circulation","b":"airway","c":"pulse","d":"breathing"},"answer":"A"},{"num":979,"text":"Your point of no return must be based on","options":{"a":"air consumption.","b":"highest gauge reading.","c":"team size.","d":"number of victims."},"answer":"A"},{"num":980,"text":"In order to protect the structure from damage due to weather and trespassers, firefighters should","options":{"a":"contract with a third-party company to cover the doors or windows.","b":"replace the doors and windows after overhaul is complete.","c":"advise the owner that it is their responsibility to cover and/or replace the doors and windows.","d":"cover doors or windows with plywood, heavy plastic, or similar materials."},"answer":"D"},{"num":981,"text":"Until the power is turned off at a Class C fire, firefighter activities are limited to:","options":{"a":"applying water directly.","b":"maintaining the perimeter and protecting exposures.","c":"evacuating and establishing command.","d":"performing search and rescue."},"answer":"B"},{"num":982,"text":"In the SCBA tag system, exit time from the IDLH environment for a team of firefighters is based on the","options":{"a":"estimated air capacity of a full SCBA.","b":"air pressure in the lowest-reading SCBA in the team.","c":"amount of time it took the team to perform entry/exit operations in training.","d":"air pressure in the highest-reading SCBA in the team."},"answer":"B"},{"num":983,"text":"In a fuel-limited structure and vehicle fires, the area of origin","options":{"a":"may not be the area with the most fire damage.","b":"is always the area with the most fire damage.","c":"may be less apparent and require an experienced investigator.","d":"does not contain the precise point of origin."},"answer":"A"},{"num":984,"text":"Spontaneous ignition through self-heating is an oxidation process produced by","options":{"a":"mechanical energy","b":"chemical energy","c":"radiant energy","d":"electrical energy"},"answer":"B"},{"num":985,"text":"Where should the dump site for mobile water supply operations be located","options":{"a":"Halfway between the fire or incident and the static water supply source","b":"Near the static supply water source","c":"On the fire apparatus","d":"Near the fire or incident"},"answer":"D"},{"num":986,"text":"Class A foam lowers surface tension allowing water to _____ fuels.","options":{"a":"dilute","b":"separate","c":"penetrate","d":"smother"},"answer":"C"},{"num":987,"text":"Which statement describes proper care of an SCBA facepiece","options":{"a":"Wash regulators and low-pressure hoses by submerging in warm water","b":"Dry facepiece with paper towels","c":"Limit cleaning of the facepiece to prevent wear","d":"Wash facepiece with warm water and a mild commercial disinfectant"},"answer":"D"},{"num":988,"text":"When establishing a fire scene perimeter, the perimeter should","options":{"a":"not be recognizable by bystanders or outsiders.","b":"stay the same size, regardless of additional evidence or debris that is found.","c":"not extend beyond the farthest piece of evidence.","d":"be larger than necessary for investigations."},"answer":"D"},{"num":989,"text":"In order to properly maintain the cutting edge of an axe, firefighters should","options":{"a":"keep the blade extremely sharp","b":"file the cutting edge by hand","c":"keep the blade thick","d":"use a grinder to carefully file the cutting edge"},"answer":"B"},{"num":990,"text":"Which information is typically contained in a written IAP?","options":{"a":"Budget restrictions","b":"PPE inspection documentation","c":"Names of individuals involved in the incident","d":"Tactical worksheet and incident briefing"},"answer":"D"},{"num":991,"text":"When cutting wire fencing materials, it is safest to stand","options":{"a":"in the middle of two posts and cut the wire where it joins the post.","b":"in the middle of two posts and cut the wire directly in the middle.","c":"beside the fence post and cut the wire directly in the middle of the wire between two posts.","d":"beside the fence post and cut the wire where it joins the post."},"answer":"D"},{"num":992,"text":"Which type of fire company performs fire suppression duties at all types of fires and is assigned to a pumping apparatus","options":{"a":"Tanker","b":"Wildland","c":"Engine","d":"Truck"},"answer":"C"},{"num":993,"text":"One method for removing a firefighter with nonfunctioning SCBA","options":{"a":"remove SCBA.","b":"cover face.","c":"shelter in place.","d":"connect to functioning SCBA."},"answer":"D"},{"num":994,"text":"If an ethanol/methanol vehicle is leaking fuel or on fire, establish a control zone and:","options":{"a":"request a hazardous materials response team","b":"allow fuel to burn off","c":"protect exposures","d":"use dry chemical"},"answer":"A"},{"num":995,"text":"Firefighters should use a lockout/tagout device to:","options":{"a":"prevent sprinkler activation","b":"mark hazard locations","c":"notify utilities","d":"prevent power from being turned back on before it is safe"},"answer":"D"},{"num":996,"text":"Which type of hepatitis may not exhibit symptoms for years?","options":{"a":"Hepatitis D","b":"Hepatitis C","c":"Hepatitis B","d":"Hepatitis A"},"answer":"B"},{"num":997,"text":"When a high-voltage line falls on a vehicle, responders should first:","options":{"a":"shut power remotely","b":"contact utility","c":"tell victims to remain inside","d":"begin extrication"},"answer":"C"},{"num":998,"text":"Which statement is true of wet-pipe sprinkler systems?","options":{"a":"Used below freezing temperatures","b":"Contain water under pressure at all times","c":"Require extensive maintenance","d":"Release air first upon activation"},"answer":"B"},{"num":999,"text":"How can a fire and life safety program benefit firefighters?","options":{"a":"Fundraising opportunities","b":"Connection with the community","c":"Hazard mitigation certification","d":"Protection from legal culpability"},"answer":"B"},{"num":1000,"text":"What is an example of unapproved building modifications that can create hazardous conditions?","options":{"a":"Installing smoke detectors","b":"Removing carpet","c":"Altering basements into living spaces","d":"Penetrating fire walls"},"answer":"D"},{"num":1001,"text":"What position oversees all training activities and supervises personnel assigned to the training division","options":{"a":"Chief officer","b":"Training officer/chief of training","c":"Fire marshal","d":"Instructional developer"},"answer":"B"},{"num":1002,"text":"The priority before any structural search should be","options":{"a":"locating occupants.","b":"suppressing fire.","c":"detecting hazmat.","d":"locating and isolating the fire."},"answer":"D"},{"num":1003,"text":"As the efficiency of combustion decreases in a hot gas layer, the heat release rate ____ and the amount of unburned fuel within the hot gas layer ____","options":{"a":"increases; decreases","b":"stays the same; decreases","c":"decreases; increases","d":"stays the same; increases"},"answer":"C"},{"num":1004,"text":"What can firefighters do to promote fire and life safety education to homeowners/occupants?","options":{"a":"Demonstrate how to install smoke detectors in kitchens","b":"Cite homeowners for building and fire code violations","c":"Discuss the importance of having bedroom doors closed while sleeping","d":"Explain the construction type and floor plans of the home"},"answer":"C"},{"num":1005,"text":"Following critical incidents or potentially traumatizing events (PTE), firefighters need to","options":{"a":"use the Critical Incident Stress Management (CISM) model to improve themselves.","b":"have a counselor come speak with those involved with the event.","c":"take time off from work.","d":"utilize positive coping mechanisms."},"answer":"D"},{"num":1006,"text":"The use of indirect fire control:","options":{"a":"may be desirable when entry into the fire structure is not possible","b":"produces less steam than direct fire control","c":"must occur from the exterior of a structure","d":"is more effective in terms of cooling fuels and room surfaces than direct fire control"},"answer":"A"},{"num":1007,"text":"Which hose appliance adapts a larger hoseline to a smaller hoseline?","options":{"a":"Fitting","b":"Siamese appliance","c":"Water thief","d":"Gate valve"},"answer":"C"},{"num":1008,"text":"To prevent reignition of a liquid fuel fire after foam has been applied, do NOT:","options":{"a":"apply more foam once the surface has been covered","b":"strike the foam blanket with a straight or solid stream","c":"apply more foam than necessary for extinguishment","d":"let the foam sit for more than 10 minutes without applying fresh foam"},"answer":"B"},{"num":1009,"text":"One indicator of internal bleeding is:","options":{"a":"bleeding from the mouth","b":"lacerations","c":"venous bleeding","d":"arterial bleeding"},"answer":"A"},{"num":1010,"text":"Whenever two firefighters are raising a ladder,","options":{"a":"it must be raised parallel to the building.","b":"the firefighter at the butt end determines the placement of the ladder.","c":"a flat raise must be used.","d":"the firefighter at the ladder tip determines the placement of the ladder."},"answer":"B"},{"num":1011,"text":"Which type of tool is ideal for disassembling machinery?","options":{"a":"Impact tool","b":"Whizzer saw","c":"Air chisel","d":"Come-along"},"answer":"A"},{"num":1012,"text":"A 4 1/2-inch (115 mm) hose or larger can be connected to a 2 1/2-inch (65 mm) hose outlet using a:","options":{"a":"hydrant valve.","b":"siamese appliance.","c":"reducer coupling.","d":"gated wye."},"answer":"C"},{"num":1013,"text":"A BLEVE occurs when a:","options":{"a":"liquid is heated and becomes gas, increasing pressure","b":"gas becomes liquid","c":"vessel is shaken","d":"vessel is cooled rapidly"},"answer":"A"},{"num":1014,"text":"All wye appliances have","options":{"a":"a single female inlet and multiple male outlet connections.","b":"multiple male inlets and multiple female outlet connections.","c":"a single male inlet and multiple female outlet connections.","d":"multiple male inlets and a single female outlet connection."},"answer":"A"},{"num":1015,"text":"In most jurisdictions, residential fire and life safety surveys are:","options":{"a":"paid for by occupants","b":"required by fire codes","c":"conducted without occupant knowledge","d":"conducted on a voluntary basis"},"answer":"D"},{"num":1016,"text":"What is one factor to consider when selecting the proper fire extinguisher?","options":{"a":"Size and intensity of the fire","b":"Weight of the extinguisher","c":"Whether the extinguisher can be refilled","d":"Approximate cost of the extinguisher"},"answer":"A"},{"num":1017,"text":"What is one way friction loss in a fire hose can be overcome or reduced","options":{"a":"Positioning the nozzle at a higher elevation","b":"Increasing the pump pressure","c":"Decreasing the pump pressure","d":"Decreasing the hose size"},"answer":"B"},{"num":1018,"text":"If carrying tools up and down a ladder, remember to","options":{"a":"use a ladder belt while ascending the ladder.","b":"slide your free hand along the beam rather than on the rungs.","c":"tie the tool to your body so that your hands are free.","d":"grasp alternating beams with each hand."},"answer":"B"},{"num":1019,"text":"Which type of fire department is continually staffed by full-time firefighters","options":{"a":"Career department","b":"Volunteer department","c":"Private department","d":"Combination department"},"answer":"A"},{"num":1020,"text":"Fire and life safety surveys should be documented because they:","options":{"a":"can be reused for similar surveys","b":"relieve departments of legal ramifications","c":"help departments secure more funding","d":"may be needed to force property owners to comply with code requirements"},"answer":"D"},{"num":1021,"text":"If your personal stress management program is not working, the organization's _____ should be able to assist with stress management","options":{"a":"Critical Incident Stress Management (CISM)","b":"Incident Management System (IMS)","c":"Fire and Life Safety Initiatives","d":"member assistance program (MAP)"},"answer":"D"},{"num":1022,"text":"Which type of sprinkler valve system uses a circular disk inside a flat plate and is operated with a built- in crank?","options":{"a":"Post indicator valve (PIV)","b":"Wall post indicator valve (WPIV)","c":"Outside screw and yoke (OS&Y) valve","d":"Post indicator valve assembly (PIVA)"},"answer":"D"},{"num":1023,"text":"When using a mobile radio, remember that it","options":{"a":"must be powered by a building's electrical system.","b":"is less powerful than a fixed location radio.","c":"uses rechargeable or replaceable batteries.","d":"does not perform as well as a portable radio."},"answer":"B"},{"num":1024,"text":"When inspecting metal and fiberglass ladders, look for","options":{"a":"areas where the finish has been chafed or scraped.","b":"rungs rounded or smooth.","c":"evidence of flame impingement or heat damage.","d":"water damage."},"answer":"C"},{"num":1025,"text":"Firefighters can establish new flow paths for structure fires when they","options":{"a":"advance a hoseline or ventilate windows to make entry","b":"decrease the fuel load by extinguishing flammable contents","c":"add more fuel gases to a compartment fire","d":"extinguish flames in the hot gas layer"},"answer":"A"},{"num":1026,"text":"Firefighter breathing air replenishment systems (FBARS)","options":{"a":"use an auto-cascade system.","b":"are found at fire stations.","c":"support a supplied air respirator (SAR) system.","d":"are designed for use at high-rise fires."},"answer":"D"},{"num":1027,"text":"What is one general method for conducting a search","options":{"a":"When you enter a room, turn right or left and follow the walls until you return to your starting point.","b":"Do not search a room that appears to contain a fire.","c":"To remove a victim to safety, turn in the opposite direction you entered.","d":"Never exit through the same doorway you entered."},"answer":"A"},{"num":1028,"text":"If separated from your team during a MAYDAY","options":{"a":"wait for voice commands.","b":"follow hoseline, search line, or wall out.","c":"follow smoke.","d":"wait for radio commands."},"answer":"B"},{"num":1029,"text":"Maintaining personnel safety during training evolutions includes","options":{"a":"maintaining situational awareness.","b":"having emergency medical services and law enforcement present during training.","c":"not training in conditions that are close to actual emergencies.","d":"training safely without PPE to prevent wear and tear on the equipment."},"answer":"A"},{"num":1030,"text":"Which type of structural collapse pattern is most vulnerable to secondary collapse?","options":{"a":"A-frame","b":"Pancake","c":"V-shaped","d":"Cantilever"},"answer":"D"},{"num":1031,"text":"Blood that is bright red and spurting or pulsing from the body is an indicator of _____ bleeding.","options":{"a":"arterial","b":"intravenous","c":"capillary","d":"venous"},"answer":"A"},{"num":1032,"text":"Hydraulic prying tools that can be operated by one person","options":{"a":"are not considered safe for extrication operations.","b":"are not recommended for forcible entry and extrication operations if multiple personnel are available.","c":"have proven to be very effective for forcible entry and extrication operations.","d":"should only be used for prying operations."},"answer":"C"},{"num":1033,"text":"What is one characteristic of a good fire and life safety presentation?","options":{"a":"Using a personal style based on experience","b":"Avoiding eye contact","c":"Monotone delivery","d":"Telling mostly war stories"},"answer":"A"},{"num":1034,"text":"In the intake flow of a structure fire, the ambient air (higher pressure)","options":{"a":"flows toward the seat of the fire and reacts with the fuel","b":"does not flow unidirectionally","c":"causes the fire to enter the decay stage","d":"flows away from the fire toward the low pressure outlet"},"answer":"A"},{"num":1035,"text":"What is one possible indicator of arson at a fire scene","options":{"a":"Passersby stopping to watch the fire","b":"A fire occurring late at night or in the early morning","c":"Windows being wide open when the outside temperature is high","d":"Office personnel being present after hours at an office building fire"},"answer":"D"},{"num":1036,"text":"A balloon throw is a common method for","options":{"a":"two firefighters to deploy a folded salvage cover.","b":"one firefighter to deploy a folded salvage cover.","c":"one firefighter to deploy a rolled salvage cover.","d":"two firefighters to deploy a rolled salvage cover."},"answer":"A"},{"num":1037,"text":"In order to control the flow path and fire during a positive-pressure attack (PPA):","options":{"a":"crews should not apply water to the fire compartment during ventilation.","b":"interior doors should be opened as soon as possible.","c":"the size of the exhaust opening must exceed the size of the intake to the fire compartment.","d":"crews must enter and exit the structure from another location besides the intake opening."},"answer":"C"},{"num":1038,"text":"What is an example of spoliation?","options":{"a":"Extinguishing a fire and washing away evidence","b":"Covering evidence with a tarp","c":"Gathering evidence at risk of destruction","d":"Altering evidence so it cannot be observed the same way by other investigators"},"answer":"D"},{"num":1039,"text":"Initially, Command in the NIMS-ICS structure will be assigned to the","options":{"a":"ranking individual that is not on scene, but supervises the first company on the scene","b":"fire department that will be responding.","c":"agency having the primary responsibility based on the nature of the incident.","d":"law enforcement agency having jurisdiction."},"answer":"C"},{"num":1040,"text":"When extricating victims:","options":{"a":"remove deceased first","b":"remove entrapped first","c":"remove in order found","d":"prioritize serious injuries"},"answer":"D"},{"num":1041,"text":"To maintain the integrity of interior protected stairs, firefighters need to","options":{"a":"prevent occupants from using them.","b":"control the doors.","c":"prop the doors open throughout fire suppression activities.","d":"use exterior stairs for fire suppression activities, if possible."},"answer":"B"},{"num":1042,"text":"What is one of the factors locally adopted building codes use to regulate the type of building construction for a structure","options":{"a":"Company contracted to build the structure","b":"Cost of the materials","c":"Intended use of the structure","d":"Availability of the materials"},"answer":"C"},{"num":1043,"text":"What should firefighters do if they feel contact burns developing underneath their PPE","options":{"a":"Remove the thermal barrier from the protective coat","b":"Cool the PPE with water","c":"Withdraw from the area immediately","d":"Begin loosening and removing the PPE"},"answer":"C"},{"num":1044,"text":"Which type of communications may take place among crewmembers as they carry out their duties?","options":{"a":"Tactical","b":"Informal","c":"Formal","d":"Briefing"},"answer":"B"},{"num":1045,"text":"Which statement describes nonemergency exit techniques","options":{"a":"Controlled breathing will increase air consumption during exit.","b":"Team members must leave as a group or in pairs.","c":"Breathing can be controlled by taking short bursts of breath.","d":"The egress path should not be the same path used for entry."},"answer":"B"},{"num":1046,"text":"In order to preserve evidence, firefighters should:","options":{"a":"collect and document it as quickly as possible","b":"leave it undisturbed unless it must be handled to be preserved","c":"begin overhaul operations during the fire investigation","d":"use a charged handline to decontaminate it"},"answer":"B"},{"num":1047,"text":"During an air emergency, firefighters should","options":{"a":"stay low to the ground.","b":"remove regulator.","c":"open bypass valve.","d":"half-open cylinder."},"answer":"A"},{"num":1048,"text":"What should be done with hose that has mildew","options":{"a":"It should be marked \"FOR TRAINING USE ONLY\" and used on the training ground.","b":"It should be marked as defective and disposed of as soon as possible.","c":"It should be tested for leaks to decide if it can still be used.","d":"It should be washed immediately with a very mild soap or manufacturer-recommended cleaning solution."},"answer":"D"},{"num":1049,"text":"If smoke obscures vision during a primary search","options":{"a":"report to the IC.","b":"open doors or windows.","c":"withdraw immediately.","d":"move objects."},"answer":"A"},{"num":1050,"text":"Heated gases expand and become ____; when cooled they contract and become ____","options":{"a":"conductive; convective","b":"convective; conductive","c":"denser; less dense","d":"less dense; denser"},"answer":"D"},{"num":1051,"text":"Class A portable fire extinguishers are rated 1-A through 40-A based on the amount of water and the:","options":{"a":"amount of saponification that will occur.","b":"reactivity of the water with electricity.","c":"duration and range of the discharge.","d":"types of metal-based fires they can extinguish."},"answer":"C"},{"num":1052,"text":"Which is a method to protect yourself from infection and exposure","options":{"a":"Decontaminate any patients before coming into contact with them.","b":"Limit unnecessary physical contact with all patients.","c":"Use hazmat monitoring and detection equipment.","d":"Do not come in contact with patients."},"answer":"B"},{"num":1053,"text":"Which personnel usually decide where to place the butt of a ladder if there are two firefighters stationed at the butt","options":{"a":"The firefighter not involved in carrying the ladder","b":"The firefighter on the right of the butt","c":"The firefighter on the left of the butt","d":"The firefighter at the tip of the ladder"},"answer":"B"},{"num":1054,"text":"What special tool might be needed to force entry through a lock?","options":{"a":"K-tool","b":"Pike pole","c":"Acetylene torch","d":"Halligan tool"},"answer":"A"},{"num":1055,"text":"To reduce the risk of unpredictable window failure, firefighters must transition a fully developed fire from","options":{"a":"fuel-limited to ventilation-limited","b":"fully developed to incipient","c":"preflashover to postflashover","d":"ventilation-limited to fuel-limited"},"answer":"D"},{"num":1056,"text":"When deploying a roof ladder, the roof ladder should be","options":{"a":"raised using a flat raise until the hooks are latched onto the roof edge.","b":"carried up the ground ladder with the hooks closed until it is ready to be deployed.","c":"carried up a ground ladder to the roof.","d":"hoisted to the roof with utility rope and/or webbing."},"answer":"C"},{"num":1057,"text":"When deploying traffic control measures and devices","options":{"a":"the company officer and driver/operator will determine where to position emergency vehicles.","b":"law enforcement officials will determine how to deploy them.","c":"deploy them so that all lanes of traffic are closed off.","d":"do NOT use emergency vehicles to form a protective barrier between oncoming traffic and working personnel."},"answer":"A"},{"num":1058,"text":"Reinforced gypsum walls","options":{"a":"are marked as such to differentiate them from gypsum wallboard.","b":"can be breached by conventional forcible entry hand tools.","c":"can be breached with the same methods as gypsum wallboard.","d":"should be identified in the preincident planning survey."},"answer":"D"},{"num":1059,"text":"If no safe haven exists for tank size, firefighters should:","options":{"a":"don explosion PPE","b":"shelter in place","c":"control ignition","d":"evacuate to a safe distance"},"answer":"D"},{"num":1060,"text":"Which type of fire is deliberately set knowing it should not be ignited?","options":{"a":"Accidental","b":"Incendiary","c":"Undetermined","d":"Natural"},"answer":"B"},{"num":1061,"text":"To produce thicker Class A foam:","options":{"a":"add more water","b":"increase foam percentage","c":"add more air","d":"lower foam percentage"},"answer":"B"},{"num":1062,"text":"What is one advantage of using a base station radio","options":{"a":"It is powered by vehicle electrical systems.","b":"It does not require an electrical system to power it.","c":"It provides better performance than mobile and portable radios.","d":"It has a longer battery life than mobile and portable radios."},"answer":"C"},{"num":1063,"text":"Fire apparatus and vehicle safety requirements include","options":{"a":"firefighters assisting in the movement of apparatus as ground guides (spotters).","b":"occupants wearing helmets in the apparatus cab when it is moving.","c":"not wearing seat belt restraints when responding to emergencies.","d":"driving personally-owned vehicles to the scene instead of riding in an apparatus."},"answer":"A"},{"num":1064,"text":"If gas is burning at an incident involving underground pipelines:","options":{"a":"the area should be blanketed with foam","b":"responders should attempt to shut off the gas supply first","c":"the flame should be extinguished","d":"the flame should NOT be extinguished"},"answer":"D"},{"num":1065,"text":"When inspecting synthetic laid rope","options":{"a":"feel for soft spots on the outer sheath.","b":"put a slight tension on the rope while feeling for lumps, depressions, or soft spots.","c":"untwist all sides so each strand can be inspected.","d":"check to see if core fibers have been misaligned."},"answer":"C"},{"num":1066,"text":"What should you do if you begin to feel a tingling in your legs at an electrical incident?","options":{"a":"Slowly backtrack your steps.","b":"Place your feet close together and hop or shuffle until out of danger.","c":"Crawl on hands and knees.","d":"Stay in place until power is shut off."},"answer":"B"},{"num":1067,"text":"What is the most reliable method for verifying the floor above a basement fire is structurally sound?","options":{"a":"Thermal imaging","b":"Sounding the floor","c":"Observation of smoke and flames","d":"Visual inspection of floor joists"},"answer":"D"},{"num":1068,"text":"A ladder's reach will be","options":{"a":"the length of its fly section.","b":"more than the designated length.","c":"less than the designated length.","d":"the same as its designated length."},"answer":"C"},{"num":1069,"text":"A vehicle's reserve energy supply lasts up to _____ after disconnecting the power.","options":{"a":"60 minutes","b":"15 minutes","c":"30 minutes","d":"45 minutes"},"answer":"A"},{"num":1070,"text":"In the NIMS-ICS, which individual in the chain of command sets the strategic goals and tactical objectives for the incident","options":{"a":"Liaison Officer","b":"Incident Safety Officer (ISO)","c":"Incident Commander (IC)","d":"Public Information Officer (PIO)"},"answer":"C"},{"num":1071,"text":"Chest compressions should be performed on infants with the:","options":{"a":"heel of one hand","b":"heel of each hand","c":"index and middle fingers of one hand","d":"index finger of one hand"},"answer":"C"},{"num":1072,"text":"When using radios, direct communication allows the same radio channel to be used by other groups:","options":{"a":"without speakers having to acknowledge each other.","b":"regardless of distance or physical barriers between the radios.","c":"without keying the radios before speaking.","d":"that are located at a greater distance from the first group."},"answer":"D"},{"num":1073,"text":"Inspection and maintenance of a power plant or electrical generator includes:","options":{"a":"running the generator for a long time without a load","b":"replacing the spark plug if it is damaged","c":"starting the generator while under a load","d":"making significant modifications to the generator"},"answer":"B"},{"num":1074,"text":"Once evidence is collected, a _____ must be developed and maintained.","options":{"a":"decontamination corridor","b":"chain of custody","c":"court-authorized warrant","d":"legal precedent"},"answer":"B"},{"num":1075,"text":"Why should fire and life safety presentations be developed around learning objectives?","options":{"a":"To estimate presentation length","b":"To prevent personalization","c":"To meet NFPA requirements","d":"To provide purpose and goals"},"answer":"D"},{"num":1076,"text":"Areas of the body with high absorption rates for carcinogens include","options":{"a":"groin, jaw, forehead, and back.","b":"armpits, top of the head, and other areas with body hair.","c":"chest, lower back, neck, and shoulders.","d":"fingers, toes, and stomach."},"answer":"A"},{"num":1077,"text":"Which section of an extension or combination ladder moves","options":{"a":"Fly section","b":"Butt section","c":"Truss section","d":"Bed section"},"answer":"A"},{"num":1078,"text":"Which drag or carry allows movement on stairs","options":{"a":"Webbing drag","b":"Cradle-in-arms carry","c":"Litter carry","d":"Incline drag."},"answer":"D"},{"num":1079,"text":"How can sharp metal edge hazards be reduced?","options":{"a":"Grind edges","b":"Bend edges","c":"Cover with tarp","d":"Cover with hose or duct tape"},"answer":"D"},{"num":1080,"text":"What is the best way to breach a brick or concrete block wall","options":{"a":"Use a rotary saw or jackhammer to breach the wall","b":"Use a hand tool to strike near the top of the wall","c":"Use a chain saw equipped with a diamond-tipped chain","d":"Use a hand tool to strike the corners of the wall"},"answer":"A"},{"num":1081,"text":"In order to remove a high-security lock, firefighters should","options":{"a":"cut one side of the shackle with a power saw or torch.","b":"cut both sides of the shackle with a power saw or torch.","c":"insert a hammerhead pick into the shackle and strike it with a maul or flat-head axe.","d":"twist the lock with a hockey puck lock breaker until the lock’s interior mechanism"},"answer":"B"},{"num":1082,"text":"What is one characteristic of a solid stream","options":{"a":"It produces a stream as compact as possible with little shower or spray.","b":"It produces a straight stream pattern.","c":"It can produce angles that range from narrow to wide.","d":"It is not affected by gravity or friction with air."},"answer":"A"},{"num":1083,"text":"Deep-cycle batteries:","options":{"a":"provide a steady stream of power for short periods of time","b":"are designed to be fully discharged before they are charged again","c":"provide more power than traditional batteries","d":"should be recharged after each use"},"answer":"B"},{"num":1084,"text":"The National Incident Management System - Incident Command System (NIMS-ICS)","options":{"a":"is an optional organizational structure for emergency services organizations.","b":"organizational functions must all be present at every incident.","c":"is only applicable to complex, large-scale incidents involving several agencies and mutual aid units.","d":"command structure will be dictated by the size and complexity of an emergency."},"answer":"D"},{"num":1085,"text":"At a highway incident scene, what is the recommended method for mounting and dismounting a fire apparatus","options":{"a":"Mount on the side of the vehicle opposite oncoming traffic and dismount on the side exposed to traffic","b":"Mount on the side of the vehicle exposed to oncoming traffic and dismount on the side opposite incoming traffic","c":"Mount and dismount on the side of the vehicle opposite oncoming traffic","d":"Mount and dismount on the side of the vehicle exposed to oncoming traffic"},"answer":"C"},{"num":1086,"text":"Firefighters are typically required to participate in a physical fitness program in _____departments","options":{"a":"combination","b":"career","c":"volunteer","d":"all"},"answer":"B"},{"num":1087,"text":"Which type of valve is used to control the flow from a hydrant","options":{"a":"Butterfly valve","b":"Gate valve","c":"Ball valve","d":"Clapper valve"},"answer":"B"},{"num":1088,"text":"The purpose of an SCBA fit test is to determine","options":{"a":"if the air cylinder capacity is sufficient for the wearer.","b":"if the wearer is physically fit for SCBA usage.","c":"how much heat an SCBA facepiece can withstand.","d":"the correct fit of an SCBA facepiece for a proper seal."},"answer":"D"},{"num":1089,"text":"Which type of hose appliance allows you to turn one hoseline into two or more?","options":{"a":"Wye appliance","b":"Gate valve","c":"Water thief","d":"Siamese appliance"},"answer":"A"},{"num":1090,"text":"When fighting fires involving pressurized gas containers, safe havens should offer protection from:","options":{"a":"vapor clouds","b":"explosion debris","c":"foam residue","d":"toxic fumes"},"answer":"B"},{"num":1091,"text":"Which type of door consists of flat face panels the full height and width of the door that are attached to a solid or hollow core","options":{"a":"Metal","b":"Flush","c":"Fire","d":"Folding"},"answer":"B"},{"num":1092,"text":"Mechanical fans and ventilation are examples of _____ smoke control systems.","options":{"a":"pressurization","b":"passive","c":"opposed air flow","d":"zoned"},"answer":"A"},{"num":1093,"text":"Class A fires involve ordinary combustibles such as:","options":{"a":"cooking greases and oils.","b":"solvents, lacquers, and alcohols.","c":"textiles, paper, and wood.","d":"petroleum greases, oils, and paints."},"answer":"C"},{"num":1094,"text":"Which type of forcible entry tool is designed to be used with prying tools to pull lock cylinders","options":{"a":"J-tool","b":"K-tool","c":"A-tool","d":"Shove knife"},"answer":"B"},{"num":1095,"text":"Conditions such as spinal trauma and head injuries may cause _____ shock.","options":{"a":"anaphylactic","b"
