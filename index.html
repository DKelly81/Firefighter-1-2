tions":{"a":"lean the top of the ladder against the wall or roof.","b":"lay the ladder flat on the ground.","c":"place the butt of the ladder on the ground.","d":"place the top of the ladder on the ground."},"answer":"C"},{"num":539,"text":"Friction and compression generate","options":{"a":"electrical energy","b":"radiant energy","c":"chemical energy","d":"mechanical energy"},"answer":"D"},{"num":540,"text":"Rescue cables and ropes must have a safety margin _____ the load.","options":{"a":"in excess of","b":"equal to","c":"less than","d":"close to"},"answer":"A"},{"num":541,"text":"When protective clothing is damaged beyond repair, it should be","options":{"a":"used as a backup set of PPE.","b":"used as a station or work uniform.","c":"worn in conjunction with other PPE.","d":"removed from service immediately."},"answer":"D"},{"num":542,"text":"What is a significant hazard that can be present during overhaul operations","options":{"a":"Severe burns","b":"Toxic gases and particulates","c":"Flashover","d":"Spalling of concrete"},"answer":"B"},{"num":543,"text":"Which NIMS-ICS Command function is responsible for relaying accurate information to other response sections, the media, or the public","options":{"a":"Incident Safety Officer (ISO)","b":"Incident Commander (IC)","c":"Public Information Officer (PIO)","d":"Liaison Officer"},"answer":"C"},{"num":544,"text":"To counteract the risk of a fire starting at an automobile accident, firefighters should:","options":{"a":"provide flash fire protection to protect victims and rescuers","b":"position downhill and smother fuel with foam","c":"continuously flow water onto the engine","d":"deploy master streams"},"answer":"A"},{"num":545,"text":"In general, a residential story averages about","options":{"a":"15 feet (4.5 m).","b":"5 feet (1.5 m).","c":"12 feet (4 m).","d":"10 feet (3 m)."},"answer":"D"},{"num":546,"text":"To extricate victims from an escalator, remove all other passengers and:","options":{"a":"activate the emergency switch","b":"use forcible entry tools to cut around the victim","c":"use hand pressure or a crank to move the treads backward","d":"restart the escalator"},"answer":"C"},{"num":547,"text":"To ensure the decay stage of a ventilation-limited fire is its final stage, firefighters must","options":{"a":"cool any furnishings or materials in the compartment","b":"cool the hot fire gases before any further ventilation occurs","c":"create multiple ventilation points in the compartment","d":"wait for the heat release rate to decrease to the point the heat can transfer outside the compartment"},"answer":"B"},{"num":548,"text":"Box beams and I-beams used in conjunction with wood joists to support flat roofs and floors:","options":{"a":"provide adequate structural strength in a fire.","b":"are susceptible to early failure in a fire.","c":"should only be metal or concrete, rather than wood or plywood.","d":"are rarely used in modern construction because they fail under normal conditions."},"answer":"B"},{"num":549,"text":"Fire department radio systems may be used to","options":{"a":"communicate with the media.","b":"coordinate tactics at an emergency.","c":"send personal messages outside the department.","d":"communicate outside of FCC regulations."},"answer":"B"},{"num":550,"text":"In the VEIS method, the second firefighter","options":{"a":"finds another entry.","b":"holds a search line.","c":"stays at the entry point.","d":"closes the entry."},"answer":"C"},{"num":551,"text":"When dealing with smaller electrical fires in computer equipment, firefighters should isolate the power source first then:","options":{"a":"extinguish the fire with Class C extinguishing agents.","b":"let the fire burn itself out.","c":"extinguish the fire with water-based agents.","d":"wait for a technician to arrive."},"answer":"A"},{"num":552,"text":"If the roof begins to lose integrity during roof ventilation operations, personnel should:","options":{"a":"evacuate the roof immediately and notify Command.","b":"create a horizontal ventilation opening.","c":"slowly egress from the roof using the same route of entry.","d":"find a sturdy place to stand, such as a load-bearing wall."},"answer":"A"},{"num":553,"text":"Sounding a roof includes:","options":{"a":"removing roof tiles/slates and striking the underlying structure.","b":"striking the roof with a tool to see if the sheathing is intact.","c":"cutting a hole in the roof to check the structure's integrity underneath.","d":"stepping on the roof to see if it will bear the weight of a firefighter."},"answer":"B"},{"num":554,"text":"Firefighters at a trench rescue may be assigned to:","options":{"a":"the backup rescue team","b":"mitigate all hazards at the scene","c":"create a safety zone around the trench","d":"shoring and stabilizing trench walls"},"answer":"C"},{"num":555,"text":"The most difficult walls to penetrate when attempting to force entry into or escape an area are fire walls and","options":{"a":"exterior walls.","b":"non-load bearing walls.","c":"interior walls.","d":"mass timber panels."},"answer":"A"},{"num":556,"text":"Twist-lock receptacles and connectors equipped with grounding wires","options":{"a":"can be safely immersed in water.","b":"should NOT be used for emergency scene lighting.","c":"provide secure, safe connections.","d":"are unstable power sources."},"answer":"C"},{"num":557,"text":"Which foam proportioning method uses an external pump or head pressure?","options":{"a":"Eduction","b":"Injection","c":"Ejection","d":"Premixing"},"answer":"B"},{"num":558,"text":"Patients who are exhibiting symptoms of shock should:","options":{"a":"be given time to recover from their shock before treatment or transport","b":"be treated immediately and prepared for transport","c":"never be treated before being transported","d":"not be transported from the scene as it could worsen the shock"},"answer":"B"},{"num":559,"text":"If an initial inspection of a rope shows contamination or soiling,","options":{"a":"use a stiff bristled brush to remove loose surface debris and grime.","b":"wash the rope with warm water and a mild detergent.","c":"clean the rope in a front- or top-loading clothes washing machine.","d":"remove the rope from service and destroy it."},"answer":"A"},{"num":560,"text":"What is one general safety guideline for handling ladders","options":{"a":"Grasp extension ladder rungs when extending or retracting.","b":"Do not use more than two firefighters to raise a single ladder.","c":"Slide down a ladder feet first, not head first.","d":"Use ropes to secure the foot of unattended ladders to a stationary object."},"answer":"D"},{"num":561,"text":"Which type of knot would be used as a stopper knot so rope will not pass through a rescue pulley or the grommet of a rope bag","options":{"a":"Figure-eight","b":"Water knot","c":"Clove hitch","d":"Half-hitch"},"answer":"A"},{"num":562,"text":"The main difference between flash point and fire point is that a","options":{"a":"flash point temperature will not actually lead to ignition, while ignition will begin at a fire point temperature","b":"fire point temperature will not actually lead to ignition, while ignition will begin at a flash point temperature","c":"flash point temperature will not sustain combustion, while a fire point temperature can begin a sustained combustion reaction","d":"fire point temperature will not sustain combustion, while a flash point temperature can begin a sustained combustion reaction"},"answer":"C"},{"num":563,"text":"Which agency can alert the public of traffic incidents, evacuations, and fire department activities","options":{"a":"Law enforcement","b":"Emergency/Disaster management","c":"Media","d":"Public information office"},"answer":"C"},{"num":564,"text":"When a hydrant is taken out-of-service, the fire department should","options":{"a":"repair the hydrant as soon as possible.","b":"notify the hydrant manufacturer.","c":"place out-of-service tags or devices on the hydrant.","d":"replace the hydrant as soon as possible."},"answer":"C"},{"num":565,"text":"The main consideration of an overhaul plan is","options":{"a":"conserving property and equipment.","b":"determining fire cause and origin.","c":"providing the highest possible degree of safety.","d":"evidence preservation and chain of custody."},"answer":"C"},{"num":566,"text":"Unless there is heavy smoke or heat, primary searches should","options":{"a":"replace secondary searches.","b":"be slow and thorough.","c":"be fast, allowing walking.","d":"occur after suppression."},"answer":"C"},{"num":567,"text":"Which type of bleeding is indicated by a darker blood that flows at a slow and steady pace?","options":{"a":"Capillary","b":"Intravenous","c":"Venous","d":"Arterial"},"answer":"C"},{"num":568,"text":"What factor determines the type of fully developed fire","options":{"a":"Whether it is a lack of fuel or oxygen that is limiting the peak heat release rate","b":"Whether the fire is entering decay or a stage of regrowth","c":"Whether it is flashover or backdraft that makes the fire fully developed","d":"Whether the fire can no longer grow or has just grown as much as it can"},"answer":"A"},{"num":569,"text":"What is a challenge of performing salvage operations in commercial occupancies","options":{"a":"Valuable merchandise may be damaged when covering it","b":"Large stocks and display features may be difficult to cover","c":"Property owners are often on site","d":"Rooms are likely small and hard to maneuver"},"answer":"B"},{"num":570,"text":"Assuming there is available oxygen, the higher the fuel load and the longer the fire burns, the","options":{"a":"less likely it is for the fire to reignite","b":"more fire spread accelerates","c":"lower the heat release rate","d":"slower the fire will spread"},"answer":"B"},{"num":571,"text":"Which statement is true of flame detectors?","options":{"a":"They are not affected by sunlight","b":"They should not be installed in enclosed areas","c":"They respond slower than other detectors","d":"They are usually in areas where other light sources are unlikely"},"answer":"D"},{"num":572,"text":"Some gases are stored at pressures high enough to force them into a _____ state.","options":{"a":"corrosive","b":"explosive","c":"solid","d":"liquid"},"answer":"D"},{"num":573,"text":"When wearing PPE at a fire scene, responders should ensure PPE is","options":{"a":"tight.","b":"loose.","c":"dry.","d":"Damp."},"answer":"C"},{"num":574,"text":"A rope log","options":{"a":"only indicates a rope's usage, not its age.","b":"should only come in hard copy format so it can be kept with the rope bag.","c":"is required for both life safety and utility ropes.","d":"helps determine when rope should be removed from service."},"answer":"D"},{"num":575,"text":"To prevent build-up of apparatus engine exhaust in fire station vehicle bays,","options":{"a":"fire apparatus must be equipped with vehicle emissions reducers.","b":"fire stations should be equipped with vehicle exhaust extraction systems.","c":"apparatus should be left idling on the ramps outside the station before being parked in the bays.","d":"the overhead doors should be left open for at least five minutes to air out the station."},"answer":"B"},{"num":576,"text":"Why is it recommended that firefighters be issued two sets of structural fire fighting PPE","options":{"a":"In case personnel or victims at an emergency scene need PPE","b":"So that one set can be used for field reduction of contaminants procedures","c":"In case an extra layer is needed at an emergency scene","d":"So that one uncontaminated set is available while the other set is being laundered"},"answer":"D"},{"num":577,"text":"Which statement is true of propane?","options":{"a":"It is flammable, but not explosive","b":"It is odorless and lighter than air","c":"It is stored in nonpressurized tanks","d":"It is flammable and can be explosive"},"answer":"D"},{"num":578,"text":"The easiest way to determine the presence of circulation is to:","options":{"a":"feel for a pulse","b":"listen for breathing","c":"check if the airway is open","d":"feel for respiration"},"answer":"A"},{"num":579,"text":"What is a hazard associated with caves, mines, and tunnels?","options":{"a":"Dangerous reptiles","b":"Extreme temperatures","c":"Lack of available light","d":"Weather conditions"},"answer":"C"},{"num":580,"text":"Which fire stream can be used for crew protection during shutoff operations?","options":{"a":"Broken","b":"Fog","c":"Solid","d":"Straight"},"answer":"B"},{"num":581,"text":"Open plan commercial structures, such as warehouse-style stores, have","options":{"a":"low fuel loads and many physical barriers to help prevent the spread of fire and smoke","b":"low fuel loads and no physical barriers to prevent the spread of fire and smoke","c":"high fuel loads but many physical barriers to help prevent the spread of fire and smoke","d":"high fuel loads and no physical barriers to prevent the spread of fire and smoke"},"answer":"D"},{"num":582,"text":"Photographs taken for a preincident survey:","options":{"a":"do not require permission from the owner/operator","b":"cannot be legally used as documentation","c":"are most useful when developing preincident operational plans","d":"are not as useful as drawings"},"answer":"C"},{"num":583,"text":"As heat begins to vibrate the molecules in a fuel, the fuel begins a physical change from a","options":{"a":"solid to a liquid or gas","b":"solid or gas to a liquid","c":"solid or liquid to a gas","d":"liquid or gas to a solid"},"answer":"C"},{"num":584,"text":"Which type of power saw is ideal for cutting sheet metal body panels and structural components on vehicles?","options":{"a":"Rotary rescue saw with large-toothed blade","b":"Electrical circular saw","c":"Whizzer saw","d":"Reciprocating saw with a metal-cutting blade"},"answer":"D"},{"num":585,"text":"When might it be necessary to advance hose up a ladder","options":{"a":"When standpipes are not available, stairways are not accessible, or there is no other viable option","b":"When the hose cannot be hoisted to an upper floor","c":"When only one firefighter is available to advance hose to an aboveground fire","d":"When a charged hoseline needs to be advanced to an upper floor"},"answer":"A"},{"num":586,"text":"The most common salvage method used is to","options":{"a":"remove contents from the structure.","b":"protect contents in place with salvage covers.","c":"set the contents on floor runners to prevent secondary damage.","d":"move contents to a safe location within the structure."},"answer":"B"},{"num":587,"text":"Which type of door is typically used as a loading dock or garage door, and can be used as a fire door for openings that are not part of the required means of egress","options":{"a":"Revolving","b":"Swinging","c":"Vertical","d":"Folding"},"answer":"C"},{"num":588,"text":"Which type of fuel must undergo pyrolysis before ignition?","options":{"a":"Aqueous","b":"Liquid","c":"Solid","d":"Gas"},"answer":"C"},{"num":589,"text":"Tracking devices on an SCBA harness","options":{"a":"activate after MAYDAY.","b":"are less effective than PASS.","c":"may be blocked by walls or floors.","d":"are always turned on in IDLH."},"answer":"D"},{"num":590,"text":"What is an example of exterior exposure protection?","options":{"a":"Closing exterior doors and windows on a burning structure","b":"Applying water spray or foam extinguishing agents to an adjacent structure","c":"Applying water spray or foam extinguishing agents to the exterior of a burning structure","d":"Ventilating adjacent structures to control the fire flow in the burning structure"},"answer":"B"},{"num":591,"text":"When using cutting tools for forcible entry operations, remember that","options":{"a":"manual cutting tools may take longer to use, but are effective on any material.","b":"cutting tools are often specific to the types of materials they can cut.","c":"cutting tools must be used in combination with another tool.","d":"a firefighter must be stationed nearby with a charged hoseline."},"answer":"B"},{"num":592,"text":"The purpose of fire doors is to","options":{"a":"provide a point of entry and exit for fire personnel only.","b":"provide a means of egress for those fleeing an emergency.","c":"create a flow path for fire and smoke.","d":"limit the spread of fire and total fire damage."},"answer":"D"},{"num":593,"text":"The use of prefabricated wood truss systems in place of solid floor joists","options":{"a":"is used in most Type I and Type II structures.","b":"creates a closed, channel system in the floors of a structure.","c":"helps prevent unseen fire travel during a structure fire.","d":"creates a large, open void between the floors of a structure."},"answer":"D"},{"num":594,"text":"Individual units operating at the incident provide their own _____ to the IC.","options":{"a":"needs assessments","b":"tactical progress reports","c":"after action reports","d":"initial action plans"},"answer":"B"},{"num":595,"text":"Which foam application technique allows foam to float gently down onto the fuel surface?","options":{"a":"Indirect method","b":"Roll-on method","c":"Bank-down method","d":"Rain-down method"},"answer":"D"},{"num":596,"text":"A limitation of structural fire fighting PPE is that it","options":{"a":"does not trap body sweat to cool the wearer.","b":"can become hot enough to cause contact burns.","c":"is difficult to remove or open during rehabilitation breaks.","d":"does not cover all of the skin when a firefighter is reaching or bending over"},"answer":"B"},{"num":597,"text":"During search and rescue operations, which condition should be communicated to crew members and/or supervisors","options":{"a":"Fire's cause and area of origin","b":"Structure's construction classification","c":"Number of responding personnel on the scene","d":"Locations of safe havens and alternate exit routes."},"answer":"D"},{"num":598,"text":"Most flammable liquids, such as gasoline, have a specific gravity less than 1, which means they are:","options":{"a":"lighter than water and will float","b":"heavier than water and will sink","c":"lighter than air and will rise","d":"heavier than air and will sink"},"answer":"A"},{"num":599,"text":"One procedure for conducting field reduction of contaminants includes","options":{"a":"scrubbing PPE and equipment with a heavy detergent.","b":"cleaning gear and apparatus interiors before returning to the station.","c":"leaving contaminated equipment at the scene for disposal.","d":"using soap and water or disposable towels to clean head, face, and neck."},"answer":"D"},{"num":600,"text":"Escaping to a safe haven is best when","options":{"a":"staffing is limited.","b":"collapse is imminent.","c":"victims are immobile.","d":"safer inside."},"answer":"B"},{"num":601,"text":"Which stabilization tools consist of wooden or plastic blocks?","options":{"a":"Buttress systems","b":"Cribbing","c":"Nonhydraulic jacks","d":"Chocks"},"answer":"B"},{"num":602,"text":"In the NIMS-ICS system, the Command Staff consists of incident management personnel who report directly to the","options":{"a":"Safety Officer.","b":"Public Information Officer.","c":"Incident Commander.","d":"Liaison Officer."},"answer":"C"},{"num":603,"text":"Which is a component of the LCES technique for situational awareness at ground cover fires?","options":{"a":"Exposures","b":"Command","c":"Safety zones","d":"Location"},"answer":"C"},{"num":604,"text":"When administering chest compressions on adults, depress the sternum:","options":{"a":"2 to 2.4 inches (50 to 60 mm) but no farther","b":"1 to 1.5 inches (25 to 40 mm) but no farther","c":"as far as possible before releasing","d":"at least 3 inches (75 mm)"},"answer":"A"},{"num":605,"text":"Which container breach is most associated with BLEVE?","options":{"a":"Runaway cracking","b":"Disintegration","c":"Tear","d":"Puncture"},"answer":"A"},{"num":606,"text":"When checking the air-cylinder capacity before donning SCBA, it is recommended cylinder capacity be no less than _____ percent","options":{"a":"80","b":"100","c":"90","d":"75"},"answer":"C"},{"num":607,"text":"Which search method employs a dedicated search line","options":{"a":"Oriented-search method","b":"Wide-area search method.","c":"VEIS method","d":"Secondary search method"},"answer":"B"},{"num":608,"text":"Woven-jacket, natural fiber hose","options":{"a":"may be placed back on an apparatus while wet.","b":"should NOT be allowed to dry on a hose tower or drying rack.","c":"should be dried with water still inside the hose to protect the lining.","d":"must be thoroughly dried before being reloaded on an apparatus."},"answer":"D"},{"num":609,"text":"Which statement is true of presentations to school children?","options":{"a":"Large groups are preferable","b":"Presentations should be about 15 minutes or less","c":"Teachers should not be present","d":"Never dress in PPE"},"answer":"B"},{"num":610,"text":"When attacking a vehicle fire, firefighters should:","options":{"a":"apply water to burning metal","b":"approach at a 90-degree angle","c":"extinguish any fire near vehicle occupants first","d":"apply Class D agents"},"answer":"C"},{"num":611,"text":"Which EMS level should provide a scope of practice for acute management and transportation of critically injured or ill patients?","options":{"a":"EMT","b":"First aid provider","c":"Advanced EMT","d":"Emergency medical responder"},"answer":"C"},{"num":612,"text":"In order to regulate air consumption in an IDLH, firefighters should","options":{"a":"share air.","b":"stay until alarm activates.","c":"open bypass valve.","d":"always know remaining air."},"answer":"D"},{"num":613,"text":"What is one tactic for responding to a hydrogen vehicle incident?","options":{"a":"Using a thermal imager to verify if the vehicle is on fire","b":"Establishing a control zone and requesting a hazardous materials response team","c":"Cutting vehicle C-posts if extrication is required","d":"Extinguishing any fire with water or water-based agents"},"answer":"A"},{"num":614,"text":"Why is it necessary to wear SCBA during overhaul operations","options":{"a":"Hazardous concentrations below short-term exposure limits are likely to be present.","b":"Hazardous concentrations above short-term exposure limits are likely to be present.","c":"Particulate size in the smoke increases, creating more hazards.","d":"Smoke volume and density typically increase during overhaul."},"answer":"B"},{"num":615,"text":"If the tang on a gas main valve is in line with the pipe, the valve is:","options":{"a":"closed, no flow","b":"open, no flow","c":"open, flow allowed","d":"closed, flow allowed"},"answer":"C"},{"num":616,"text":"Which presentation should a Firefighter II be able to perform?","options":{"a":"Extinguishing Fires","b":"Crawl Low Under Smoke","c":"Hazard Identification and Mitigation","d":"Building Construction Types and Hazards"},"answer":"B"},{"num":617,"text":"When forcing windows with security bars","options":{"a":"use methods that keep the security bars intact, if possible.","b":"remove all security bars, if possible.","c":"cut the wall around the entire window assembly.","d":"cut just enough of the security bars for someone to reach through and unlock the window."},"answer":"B"},{"num":618,"text":"Modern metal and fiberglass ladders are designed to be used with the","options":{"a":"fly facing away from the structure.","b":"pawls unattached.","c":"halyard untied.","d":"fly facing toward the structure."},"answer":"A"},{"num":619,"text":"One disadvantage of breaking ordinary door glass to force entry is that","options":{"a":"breaking door glass is typically more destructive than forcing doors or locks.","b":"conventional hand tools cannot break door glass.","c":"the flow path cannot be controlled once the glass is broken.","d":"breaking door glass creates a larger flow path than an open door."},"answer":"C"},{"num":620,"text":"One of the main functions of a truck (ladder) company is to","options":{"a":"provide access to upper levels of a structure.","b":"provide large volumes of water in hydrant deficient areas.","c":"respond to confined space rescues.","d":"mitigate hazardous materials incidents"},"answer":"A"},{"num":621,"text":"While cast iron stands up well to fire and intense heat, it","options":{"a":"may crack or shatter when rapidly cooled with water","b":"will begin to elongate after prolonged exposure","c":"can lose strength through spalling","d":"should be protected by gypsum drywall"},"answer":"A"},{"num":622,"text":"To stay safe while performing air monitoring","options":{"a":"perform bump tests.","b":"approach downwind.","c":"work with a buddy and backup team.","d":"monitor overhead first."},"answer":"C"},{"num":623,"text":"To maintain adequate water volume and pressure, a sprinkler system typically incorporates a:","options":{"a":"retard chamber","b":"waterflow device","c":"check valve","d":"fire pump"},"answer":"D"},{"num":624,"text":"A fire department organizational structure that is ____ has an uninterrupted series of steps.","options":{"a":"complex","b":"scalar","c":"constant","d":"linear"},"answer":"B"},{"num":625,"text":"Accessing a basement fire from above:","options":{"a":"must be coordinated with ventilation","b":"requires a penetrating nozzle","c":"is safe if flashover has not occurred","d":"must occur via stairwells"},"answer":"A"},{"num":626,"text":"The only way to ensure that fires in baled materials are extinguished is to","options":{"a":"break them apart.","b":"blanket them with foam.","c":"smother them with salvage covers.","d":"let them burn out while protecting exposures."},"answer":"A"},{"num":627,"text":"An upright sprinkler is designed to:","options":{"a":"break water into circular droplets","b":"discharge water to one side","c":"deflect water downward hemispherically","d":"deflect water toward the ceiling"},"answer":"C"},{"num":628,"text":"What is the purpose of a kerf cut?","options":{"a":"To show whether or not smoke or flame is escaping from the cut","b":"To allow a visual inspection of the conditions under the roof","c":"To test the integrity of the structure","d":"To allow vertical ventilation of the structure"},"answer":"A"},{"num":629,"text":"The fire triangle illustrates the conditions required for ____ while the fire tetrahedron illustrates the conditions required for ____","options":{"a":"flaming combustion; nonflaming combustion","b":"autoignition; piloted ignition","c":"piloted ignition; autoignition","d":"nonflaming combustion; flaming combustion"},"answer":"D"},{"num":630,"text":"Interior fire environments untenable for victims","options":{"a":"are untenable for firefighters.","b":"may be tenable with PPE and SCBA.","c":"require hazmat specialists.","d":"require ventilation."},"answer":"B"},{"num":631,"text":"Cutting a hole in the roof above a fire is an example of:","options":{"a":"mechanical ventilation.","b":"vertical ventilation.","c":"horizontal ventilation.","d":"hydraulic ventilation."},"answer":"B"},{"num":632,"text":"When heeling a ladder from outside the ladder,","options":{"a":"grasp the ladder beams and pull the ladder away from the building.","b":"have two firefighters stand on each side of the ladder to heel each butt spur.","c":"stand on the outside of the ladder and heel the butt end with one foot.","d":"stand beneath the ladder with feet about shoulder-width apart."},"answer":"C"},{"num":633,"text":"Which powered rescue tool uses compressed air?","options":{"a":"Pneumatic","b":"Standard","c":"Manual","d":"Hydraulic"},"answer":"A"},{"num":634,"text":"All station and work uniforms should meet NFPA _____ requirements","options":{"a":"1970","b":"1971","c":"1982","d":"1977"},"answer":"A"},{"num":635,"text":"Emergency operations should be managed","options":{"a":"through other departmental agencies, if possible.","b":"by a chief officer only.","c":"through an Incident Management System (IMS).","d":"by personnel that are not on scene."},"answer":"C"},{"num":636,"text":"Which personnel are responsible for managing fire prevention, Investigation Divisions, and plans review","options":{"a":"Plans examiners","b":"Fire marshals","c":"Fire prevention officers","d":"Company officers"},"answer":"B"},{"num":637,"text":"Which NIMS-ICS response section provides services and support systems to all organizational components involved in an incident","options":{"a":"Finance/Administration","b":"Planning","c":"Operations","d":"Logistics"},"answer":"D"},{"num":638,"text":"When responding to electrical emergencies, responders should:","options":{"a":"assume all wires are energized until a technician confirms otherwise.","b":"drag a hoseline into the area of a downed wire to create a ground gradient.","c":"cut wires immediately to deenergize the scene.","d":"quickly leave any vehicle or apparatus in contact with power lines."},"answer":"A"},{"num":639,"text":"Before cutting the power to a vehicle's electrical system:","options":{"a":"break glass and lock doors","b":"lower windows and lock doors","c":"lower windows and unlock doors","d":"break glass and unlock doors"},"answer":"C"},{"num":640,"text":"Which control zone may include the Incident Command Post (ICP) and rehabilitation areas","options":{"a":"Hot","b":"Medium","c":"Warm","d":"Cold"},"answer":"D"},{"num":641,"text":"When assessing the integrity of a roof:","options":{"a":"avoid standing and walking on load-bearing walls.","b":"continue to check the roof ahead of your progress as you cross it.","c":"make a ventilation cut first before checking the roof's integrity.","d":"a spongy roof will indicate the roof can withstand fire conditions."},"answer":"B"},{"num":642,"text":"What is the primary principle of ground cover fire safety?","options":{"a":"Exposure protection","b":"Environmental protection","c":"Fire suppression","d":"Life safety"},"answer":"D"},{"num":643,"text":"A basement with limited exterior access","options":{"a":"may have large windows or doors at grade that allow ventilation, suppression, and entry.","b":"may have small windows that can be used for venting/suppression.","c":"has no windows or doors that will allow venting/suppression.","d":"has a door at grade, but no windows that will allow venting/suppression."},"answer":"B"},{"num":644,"text":"What is the minimum number of firefighters required for handling any attack line during structural operations","options":{"a":"Two","b":"Four","c":"One","d":"Three"},"answer":"A"},{"num":645,"text":"The end-of-service-time indicator (EOSTI) alarm on an SCBA typically warns the user the system is reaching the end of its air supply when it reaches _____ percent of the cylinder's capacity","options":{"a":"25","b":"33","c":"13","d":"10"},"answer":"B"},{"num":646,"text":"What type of materials can thermal imagers not “see” through?","options":{"a":"Wood and vinyl flooring","b":"Gypsum board and insulation","c":"Synthetic furnishings","d":"Water, glass, or other reflective surfaces"},"answer":"D"},{"num":647,"text":"While reinforced concrete performs well under fire conditions, it can lose strength through","options":{"a":"moisture absorption","b":"spalling","c":"degradation","d":"elongation"},"answer":"B"},{"num":648,"text":"The two main considerations for positive-pressure attack (PPA) are:","options":{"a":"ventilation fan location and number of exhaust points.","b":"fire location and exhaust-to-intake size ratio.","c":"amount of smoke and types of fans available.","d":"direction of fire travel and pressure differences."},"answer":"B"},{"num":649,"text":"Care and maintenance of forcible entry tools with wooden or fiberglass handles includes:","options":{"a":"washing handles with mild detergent, rinsing, and wiping them dry.","b":"soaking handles in warm water and wiping them dry.","c":"using an emery cloth to clean the handles.","d":"painting the handles of the tools to preserve them."},"answer":"A"},{"num":650,"text":"What can make forcing entry on doors with locking devices such as drop bars, door chains, and surface bolts difficult","options":{"a":"It may be difficult to tell if any of these devices are mounted and in use before attempting to force entry.","b":"These locking devices are normally found in commercial buildings where permission is required to force entry.","c":"These types of locking devices typically cannot be forced with common forcible entry tools.","d":"The doors typically do not close properly once they are forced."},"answer":"A"},{"num":651,"text":"Which standpipe system is supplied with water only through a fire department connection (FDC)?","options":{"a":"Automatic wet","b":"Semiautomatic dry","c":"Manual wet","d":"Manual dry"},"answer":"D"},{"num":652,"text":"To maintain situational awareness at a roadway incident,","options":{"a":"use vehicle warning lights for traffic control.","b":"walk with oncoming traffic.","c":"wear a low-visibility garment.","d":"walk facing oncoming traffic."},"answer":"D"},{"num":653,"text":"How does a fire in a large compartment compare to a fire in a small compartment","options":{"a":"A fire in a large compartment will normally develop more slowly than one in a small compartment","b":"A fire in a large compartment will normally develop more quickly than one in a small compartment","c":"A fire in a large compartment tends to be smaller than a fire in a small compartment because more air is entrained","d":"A fire in a large compartment will develop at the same rate as one in a small compartment but will have less intensity"},"answer":"A"},{"num":654,"text":"Foams containing PFOAs/PFOSs are hazardous because they:","options":{"a":"do not degrade PPE","b":"biodegrade rapidly","c":"cause only acute effects","d":"persist in environment and body"},"answer":"D"},{"num":655,"text":"When carrying forcible entry tools","options":{"a":"carry tools with the head secured across the body.","b":"strap tool combinations together.","c":"carry tools over the shoulder with the blade pointed toward the ground.","d":"always use a scabbard or another type of carrying case."},"answer":"B"},{"num":656,"text":"When breaking window glass, remember that","options":{"a":"your department will be responsible for replacing the window.","b":"window glass is typically heat resistant.","c":"breaking window glass should be a last resort.","d":"the flow path cannot be controlled once glass is broken."},"answer":"D"},{"num":657,"text":"Ceilings are generally constructed of gypsum board, tin tiles, or","options":{"a":"cellular concrete poured over metal decking.","b":"finished wood or tiles.","c":"poured, reinforced concrete.","d":"lath and plaster attached to joists, roof trusses, or beams."},"answer":"D"},{"num":658,"text":"The portion of roof between the roof supports and the roof covering is the","options":{"a":"roof deck.","b":"attic.","c":"roof opening.","d":"ceiling."},"answer":"A"},{"num":659,"text":"Most ladders should be carried with the","options":{"a":"top end forward.","b":"butt end pointed toward the sky.","c":"top end pointed toward the sky.","d":"butt end forward."},"answer":"D"},{"num":660,"text":"Thermal runaway may occur in fires involving:","options":{"a":"solar panel arrays","b":"lithium-ion battery electrical storage systems (ESS)","c":"cryogenic liquids","d":"fuel generators"},"answer":"B"},{"num":661,"text":"Protecting property requires firefighters to","options":{"a":"prioritize property conservation over incident stabilization and life safety.","b":"begin loss control after the fire has been extinguished.","c":"stop fire suppression efforts until the area has been secured.","d":"use good loss control techniques throughout the incident."},"answer":"D"},{"num":662,"text":"Which type of swinging door makes a good fire barrier if it is closed at the time of a fire","options":{"a":"Wood panel","b":"Glass","c":"Hollow-core","d":"Solid-core"},"answer":"D"},{"num":663,"text":"What should responders do to dissipate the vapor cloud from an LPG leak?","options":{"a":"Shut off the valve","b":"Apply AFFF","c":"Use a fog stream of at least 100 gpm (400 L/min)","d":"Use a straight stream"},"answer":"C"},{"num":664,"text":"New sources of fuel introduced after a fire is fully developed will","options":{"a":"allow ventilation-limited fires to grow","b":"allow fuel-limited fires to grow","c":"decrease the heat release rate","d":"speed up the decay of the fire"},"answer":"B"},{"num":665,"text":"Which statement is true of conducting fire hose tests?","options":{"a":"Test lengths should not exceed 100 feet (30 m)","b":"Valves should be closed quickly to prevent water hammer","c":"Hoses should not be tested when pressurized","d":"Any hose tests should be recorded and documented"},"answer":"D"},{"num":666,"text":"The most common cause of a BLEVE is:","options":{"a":"water on upper tank","b":"pressure relief activation","c":"flame contact above liquid level","d":"overfilling"},"answer":"C"},{"num":667,"text":"Safety considerations during overhaul operations include","options":{"a":"wearing hearing protection to prevent hearing loss.","b":"carrying as few tools as possible in order to reduce exhaustion.","c":"having a charged hoseline present.","d":"working in teams of three or more."},"answer":"C"},{"num":668,"text":"Which vehicle frame is least affected by collisions?","options":{"a":"Unibody","b":"Monocoque","c":"Space frame","d":"Full or rigid frame"},"answer":"D"},{"num":669,"text":"Which materials can bolt cutters be used on","options":{"a":"High-security padlock shackles","b":"Energized cables","c":"Iron bars","d":"Case-hardened locks"},"answer":"C"},{"num":670,"text":"The primary power for a fire alarm system usually comes from:","options":{"a":"batteries with chargers","b":"an offsite power plant","c":"auxiliary generators","d":"the building’s main electrical supply"},"answer":"D"},{"num":671,"text":"What can make basement fires more hazardous than fires in other compartments","options":{"a":"No stairs to provide a flow path into the structure","b":"Limited access due to being partially or fully underground","c":"Quicker ignition due to drywall used in basement construction","d":"Very little available knowledge or training on responding to basement fires"},"answer":"B"},{"num":672,"text":"What hazard is associated with breaking tempered glass?","options":{"a":"Large falling pieces","b":"Long-distance shards","c":"Sharp pointed pieces","d":"Tiny glass fragments"},"answer":"D"},{"num":673,"text":"What is a consideration when drawing site sketches and floor plans?","options":{"a":"They are rarely accurate","b":"Permission is required before drawing","c":"Drawings must be accurate because they affect tactics","d":"Pencil drawings cannot be documented"},"answer":"C"},{"num":674,"text":"When searching for hidden fires during vehicle overhaul","options":{"a":"responders should use pike poles or plaster hooks to search at a distance.","b":"components such as floor carpets, ceiling liner, and insulation should not be disturbed.","c":"check adjoining compartments and perform exposure protection before checking the fire compartment.","d":"components such as floor carpets, ceiling liner, and insulation may need to be removed."},"answer":"D"},{"num":675,"text":"Computer-based electronic personnel accountability systems","options":{"a":"can provide an even greater level of safety than other accountability systems.","b":"do NOT need a MAYDAY alarm.","c":"are less reliable than other personnel accountability systems.","d":"are NOT recommended for most fire departments."},"answer":"A"},{"num":676,"text":"An oxygen-enriched atmosphere","options":{"a":"is safer.","b":"requires SCBA.","c":"is no longer IDLH.","d":"increases fire and explosion risk."},"answer":"D"},{"num":677,"text":"Tactical ventilation can be used to assist in the incident priority of life safety by:","options":{"a":"preventing the atmosphere from becoming immediately dangerous to life and health (IDLH).","b":"allowing firefighters to advance into the structure safely without a charged handline.","c":"limiting the oxygen entering the structure while occupants are injured or trapped.","d":"altering the exhaust portion of the flow path away from trapped occupants."},"answer":"D"},{"num":678,"text":"Which hose load involves laying the hose on edge in folds that lie adjacent to each other and placing the first coupling in the rear or corner of the hose bed","options":{"a":"Preconnected","b":"Accordion","c":"Flat","d":"Combination"},"answer":"B"},{"num":679,"text":"What hazard might occur with lath and plaster under fire conditions","options":{"a":"Lath and plaster can be easily penetrated with axes or hand tools","b":"Heated lath and plaster will crack when water is applied to it","c":"Lath and plaster walls can conceal fire between surfaces","d":"Lath and plaster walls may collapse quickly with minimal heat"},"answer":"C"},{"num":680,"text":"When anticipating resource needs, which NIMS-ICS section will usually require the most resources?","options":{"a":"Logistics","b":"Command","c":"Planning","d":"Operations"},"answer":"D"},{"num":681,"text":"Which type of fire department communication is used whenever the IC makes changes to strategies and tactics at the scene?","options":{"a":"Tactical progress report","b":"After action report (AAR)","c":"Hazard report","d":"Personnel accountability report (PAR)"},"answer":"D"},{"num":682,"text":"Most fuels are organic, meaning they contain _____ and other elements","options":{"a":"methane","b":"carbon","c":"nitrogen","d":"oxygen"},"answer":"B"},{"num":683,"text":"Which type of structural elements may be identified as elements that contribute to roof failure during a fire?","options":{"a":"Legacy dimensional lumber","b":"Lightweight roof trusses","c":"OSB decking","d":"Plywood"},"answer":"B"},{"num":684,"text":"When a firefighter acting as the Incident Commander needs to transfer Command,","options":{"a":"Command must be transferred to someone not on scene.","b":"the firefighter must remain in the area to assist the new Incident Commander.","c":"a face-to-face transfer is preferred.","d":"a transfer over the radio is preferred."},"answer":"C"},{"num":685,"text":"To hoist a pike pole with rope, start by tying a clove hitch near the butt end of the handle, followed by a half-hitch in the middle of the handle and","options":{"a":"raise the pike pole with the pike down.","b":"another half-hitch around the head.","c":"raise the pike pole with the pike up.","d":"then tie a second rope to the head."},"answer":"B"},{"num":686,"text":"Which fire services personnel inform the public about fire and life safety hazards, fire causes, and precautions or actions to take before and during a fire?","options":{"a":"Fire protection specialists","b":"Fire prevention officers","c":"Fire and life safety educators","d":"Chief officers"},"answer":"C"},{"num":687,"text":"Which method of heat transfer can have a significant effect on the ignition of objects located some distance from a fire","options":{"a":"Combustion","b":"Convection","c":"Radiation","d":"Conduction"},"answer":"C"},{"num":688,"text":"If there is any question of the hazards present in a small, unattached structure, firefighters should:","options":{"a":"attack the fire from a safe distance","b":"contact the hazardous materials team","c":"allow the fire to self-extinguish","d":"cool the contents"},"answer":"C"},{"num":689,"text":"What is one indication that proper fire stream application has been used?","options":{"a":"An increase in the volume of smoke","b":"Smoke color changing from lighter to darker","c":"Increased steam production","d":"Temperature reduction within the compartment"},"answer":"D"},{"num":690,"text":"Flammable liquids have flashpoints below 100°F, meaning they:","options":{"a":"must be heated before ignition","b":"can be ignited without preheating","c":"are combustible","d":"displace foam"},"answer":"B"},{"num":691,"text":"Under fire conditions, the primary concern with a Type I construction high-rise building is","options":{"a":"flying glass from windows or curtain walls","b":"structure-wide structural collapse","c":"debris from the building causing the collapse of other structures","d":"the contents of the building burning"},"answer":"A"},{"num":692,"text":"When forcing fire doors during firefighter operations, remember that fire doors","options":{"a":"should not be used as a means of egress.","b":"must be shut immediately after opening.","c":"will need to be blocked open if the doorway is needed for operations.","d":"will lock in place if fire is detected."},"answer":"C"},{"num":693,"text":"A veneer that covers wood framing in Type V construction","options":{"a":"provides little additional fire protection or structural support.","b":"is composed of mostly combustible materials.","c":"helps minimize fire spread in Type V structures.","d":"makes the framing extremely stable and resistant to collapse."},"answer":"A"},{"num":694,"text":"In some jurisdictions, the _____ is also responsible for transporting patients to the hospital.","options":{"a":"medical first responder","b":"emergency medical responder","c":"first aid provider","d":"emergency medical technician (EMT)"},"answer":"D"},{"num":695,"text":"Which type of strategy would have fire suppression crews extinguish a fire, conduct searches, and perform rescues in the interior of a structure?","options":{"a":"Neutral","b":"Combined","c":"Defensive","d":"Offensive"},"answer":"D"},{"num":696,"text":"When establishing the perimeter to control access to required control zones, responders should use","options":{"a":"webbing.","b":"utility rope.","c":"rope that has been placed out of service.","d":"life safety rope."},"answer":"B"},{"num":697,"text":"How can gypsum wallboard fail under fire conditions","options":{"a":"Heat from fire causes the gypsum to elongate and push out load-bearing walls","b":"Heat from fire may overcome the protective abilities of the wallboard and expose structural members","c":"The gypsum begins to lose strength through spalling","d":"The gypsum melts and begins to heat the surrounding structural members"},"answer":"B"},{"num":698,"text":"When searching for downed firefighters, RIC should","options":{"a":"wear different PPE.","b":"maintain silence to hear PASS.","c":"move rapidly.","d":"start near fire."},"answer":"B"},{"num":699,"text":"When planning for potential fires in commercial, industrial, and storage facilities with large fuel loads, remember that","options":{"a":"firefighters should not attempt fire suppression operations without consent from facility supervisors","b":"more than one fire department or response unit will be required","c":"firefighters should perform and update preincident surveys to establish awareness of fuel load hazards","d":"fire suppression systems should be sufficient for extinguishment"},"answer":"C"},{"num":700,"text":"When searching for hidden fires in structures","options":{"a":"do not remove insulation material.","b":"only open areas that have plausible fire extension.","c":"do not open doors or windows if fire has burned around them.","d":"assume all concealed spaces have fire extension."},"answer":"B"},{"num":701,"text":"Ventilating slate or tile-covered pitched roofs may require:","options":{"a":"removing the individual roofing tiles before ventilating.","b":"using horizontal ventilation to create the intake point.","c":"using a power saw to cut through the roofing tiles.","d":"creating a trench cut in the roofing tiles."},"answer":"A"},{"num":702,"text":"When working under a Unified Command structure,","options":{"a":"all agencies involved will contribute to the process.","b":"fire department personnel fall under the authority of law enforcement.","c":"each agency continues to operate as normal.","d":"there is no clearly defined chain of command."},"answer":"A"},{"num":703,"text":"What is one possible indicator of a hidden fire","options":{"a":"Mortar in wall joints opened","b":"Smoke emissions from cracks","c":"Spalling on concrete","d":"Large quantities of wet insulation"},"answer":"B"},{"num":704,"text":"When transmitting information from an emergency call, remember that the more time a department spends obtaining information and dispatching resources","options":{"a":"the less time spent sizing up the scene by responders.","b":"the more prepared the responders will be for the response.","c":"the longer the situation goes unmitigated.","d":"the less potential there will be for severe injury or damage at the scene."},"answer":"C"},{"num":705,"text":"During side-impact collisions, HPS airbags deploy from:","options":{"a":"steering wheel","b":"above door frame","c":"below door frame","d":"A- and B-posts"},"answer":"B"},{"num":706,"text":"Which type of shock can occur when there is a severe infection in the body?","options":{"a":"Neurogenic","b":"Hypovolemic","c":"Anaphylactic","d":"Septic"},"answer":"D"},{"num":707,"text":"What is one advantage of using positive-pressure ventilation (PPV) over negative-pressure ventilation (NPV)?","options":{"a":"PPV can be performed before fire suppression activities to reduce the thermal effect of fire on firefighters.","b":"PPV is most effective with vertical ventilation because it supplements natural air currents.","c":"PPV blowers can be set up without firefighters having to enter a smoke-filled environment.","d":"PPV does not use gas-powered fans that can add carbon monoxide to the structure."},"answer":"C"},{"num":708,"text":"Clean agents extinguish fire by:","options":{"a":"removing fuel","b":"cooling material","c":"removing oxygen","d":"interrupting the combustion reaction"},"answer":"D"},{"num":709,"text":"Firefighters who are performing contaminant reduction and collecting contaminated tools need to be:","options":{"a":"inside the hot zone.","b":"certified at the hazmat operations level or higher.","c":"the ones who bag PPE and equipment and store it for transport.","d":"wearing PPE at or beyond the structural fire fighting ensemble."},"answer":"D"},{"num":710,"text":"Which foam technique directs foam onto an elevated object and lets it run down?","options":{"a":"Roll-on","b":"Rain-down","c":"Bank-down","d":"Indirect"},"answer":"C"},{"num":711,"text":"To prevent injury when using a power saw","options":{"a":"only use blades that are manufacturer approved for the saw.","b":"have a firefighter standing by with a charged hoseline when working in or near a flammable atmosphere.","c":"use blades that are interchangeable, regardless of the manufacturer.","d":"start all cuts at a low rpm, and carefully increase until it reaches full rpm."},"answer":"A"},{"num":712,"text":"When placing a ground ladder for victim rescue through a window, the ladder should be placed","options":{"a":"alongside the window with the tip even with the top of the window.","b":"approximately one foot below the sill.","c":"so that the tip is raised to just below the sill.","d":"so that the tip touches the top of the window."},"answer":"C"},{"num":713,"text":"Which organizational level in NIMS-ICS is organizationally located between Section and Division or Group","options":{"a":"Unit","b":"General Staff","c":"Command","d":"Branch"},"answer":"D"},{"num":714,"text":"Where should wheel chocks be placed?","options":{"a":"Uphill rear","b":"Downhill rear","c":"Uphill front","d":"Downhill front"},"answer":"B"},{"num":715,"text":"Which type of construction consists of unprotected steel joists and I-beams that may cause collapse under fire conditions","options":{"a":"Type II","b":"Type III","c":"Type IV","d":"Type I"},"answer":"A"},{"num":716,"text":"When arranging grouped items in a room so they can be protected with a salvage cover","options":{"a":"one high point should be created so that water can run off the salvage cover.","b":"multiple high points should be created to collect water in the salvage cover.","c":"rugs should be left in place to guard against secondary damage.","d":"fragile items should not be included in the group."},"answer":"A"},{"num":717,"text":"One advantage of thermal imagers is they can","options":{"a":"locate hidden fires.","b":"see through glass.","c":"detect people through walls.","d":"detect fires below floors."},"answer":"A"},{"num":718,"text":"In the fire environment, convection usually involves heat transfer through","options":{"a":"spontaneous combustion","b":"insulating materials","c":"the transmission of energy as electromagnetic waves","d":"the movement of hot smoke and fire gases"},"answer":"D"},{"num":719,"text":"In which NIMS-ICS response section do personnel help develop the incident action plan for the next operational period","options":{"a":"Logistics","b":"Finance/Administration","c":"Operations","d":"Planning"},"answer":"D"},{"num":720,"text":"Dry chemical extinguishing agents are for use on:","options":{"a":"Class B-C and/or Class B-C-D fires.","b":"Class D fires only.","c":"Class K fires only.","d":"Class A-B-C and/or Class B-C fires."},"answer":"D"},{"num":721,"text":"The _____ the hose diameter and the _____ the hose lay, the higher the friction loss at a given pressure and flow rate","options":{"a":"larger; shorter","b":"larger; longer","c":"smaller; shorter","d":"smaller; longer"},"answer":"D"},{"num":722,"text":"Scene stabilization may include:","options":{"a":"suppressing fires","b":"powering down machinery","c":"patient care","d":"recovery operations"},"answer":"A"},{"num":723,"text":"Under the IMS, which individual would first assume Command of an incident","options":{"a":"The highest ranking fire department official, regardless of whether they are on scene or not","b":"The first person on scene or ranking individual of the first company on scene","c":"Whomever the Incident Commander chooses","d":"The law enforcement official having jurisdiction"},"answer":"B"},{"num":724,"text":"When searching for hidden fires in concealed spaces below floors, above ceilings, or within walls and partitions","options":{"a":"do not move furnishings so the scene can be preserved for fire investigation.","b":"completely remove wall, ceiling, or floor coverings.","c":"do not remove wall, ceiling, or floor coverings.","d":"weight-bearing members should not be disturbed."},"answer":"D"},{"num":725,"text":"The leading cause of firefighter fatalities is","options":{"a":"chronic obstructive pulmonary disease (COPD).","b":"smoke inhalation.","c":"suicide.","d":"cardiovascular disease."},"answer":"D"},{"num":726,"text":"The self-sustained chemical reaction process","options":{"a":"decreases the speed of the oxidation reaction","b":"does not affect the oxidation reaction","c":"pauses the oxidation reaction","d":"increases the speed of the oxidation reaction"},"answer":"D"},{"num":727,"text":"Why might a ladder have a white tip or reflective tape on the tip","options":{"a":"To indicate the balance point","b":"To indicate it has been exposed to heat or direct flame","c":"To make it visible in smoky or dark conditions","d":"To identify it as a ground ladder"},"answer":"C"},{"num":728,"text":"An indicator a pressure vessel may rupture is when:","options":{"a":"a skunk-like odor is present","b":"relief valve sound increases","c":"relief valve opens","d":"condensation appears"},"answer":"B"},{"num":729,"text":"Detailed written plans that list specific steps for approaching a recurring problem or situation are","options":{"a":"policies.","b":"regulations.","c":"procedures.","d":"Guidelines."},"answer":"C"},{"num":730,"text":"When deploying and using emergency scene lighting equipment, personnel should","options":{"a":"adjust the color temperature of the lights to best match the ambient environment.","b":"never connect more lights than the power source can support.","c":"avoid wearing hearing protection as it makes communication difficult.","d":"ensure portable generators are only operated in enclosed spaces."},"answer":"B"},{"num":731,"text":"The responsibility of an Incident Safety Officer (ISO) in the NIMS-ICS is to","options":{"a":"relay accurate information between the Incident Commander (IC) and all stakeholders.","b":"assume command in the absence of the Incident Commander (IC).","c":"conduct safety briefings before each operational period.","d":"designate an Accountability Officer (AO)."},"answer":"C"},{"num":732,"text":"Which drag or carry allows rescuers to stay low","options":{"a":"Incline drag","b":"Seat carry","c":"Cradle-in-arms carry","d":"Webbing drag."},"answer":"D"},{"num":733,"text":"What organizational principle is necessary in the fire service to assign responsibility, assign specific and clear-cut tasks, and prevent duplication of effort","options":{"a":"Division of labor","b":"Unity of command","c":"Span of control","d":"Discipline"},"answer":"A"},{"num":734,"text":"What program provides assistance for personal issues to firefighters and their families","options":{"a":"Member assistance program (MAP)","b":"Firefighter Life Safety Program (FLSP)","c":"Firefighter Wellness Program (FWP)","d":"Personal Protection Program (PPP)"},"answer":"A"},{"num":735,"text":"(PAR). The cradle-in-arms technique is used to carry","options":{"a":"unconscious adults.","b":"deceased victims.","c":"firefighters wearing SCBA.","d":"children."},"answer":"D"},{"num":736,"text":"When using foam handlines to protect retreating firefighters:","options":{"a":"use rain-down method","b":"safe location should be downwind and downhill","c":"mix water streams with foam","d":"safe location should be uphill and upwind"},"answer":"D"},{"num":737,"text":"Flat or tubular webbing that is used in the fire service is","options":{"a":"not required to meet any NFPA standards.","b":"made of the same materials used for synthetic rope.","c":"intended for utility purposes only.","d":"not commonly used for rescue applications."},"answer":"B"},{"num":738,"text":"When connecting attack hoseline to a standpipe system, fire crews normally make the connection","options":{"a":"one floor below the fire floor.","b":"one floor above the fire floor.","c":"on the fire floor.","d":"at ground level."},"answer":"A"},{"num":739,"text":"Which type of construction is one of the least likely to collapse because of the weight-bearing capacity of its large-dimension wood members","options":{"a":"Type V","b":"Type IV","c":"Type II","d":"Type III"},"answer":"B"},{"num":740,"text":"Uniform fire safety symbols are found in:","options":{"a":"NFPA 704","b":"GHS","c":"NFPA 170","d":"ERG"},"answer":"C"},{"num":741,"text":"Which roof modification uses multiple layers to create a void air space that can also conceal attic fires","options":{"a":"Green roof","b":"Cold roof","c":"Photovoltaic roof","d":"Rain roof"},"answer":"B"},{"num":742,"text":"What is the primary hazard at any motor vehicle accident?","options":{"a":"Bloodborne pathogens","b":"Fire","c":"Sharp objects","d":"Traffic"},"answer":"D"},{"num":743,"text":"Like other fire fighting tools and equipment, ventilation tools and equipment should:","options":{"a":"only be inspected if the user suspects a malfunction.","b":"receive yearly inspection and maintenance.","c":"remain in service even if they fail inspection.","d":"receive routine inspection and maintenance."},"answer":"D"},{"num":744,"text":"Which improvised use of a salvage cover may be constructed on the floor below firefighting operations to drain runoff out of the structure","options":{"a":"Catchall","b":"Carryall","c":"Water chute","d":"Spliced cover"},"answer":"C"},{"num":745,"text":"At incidents involving possible criminal or terrorist activities, a safety briefing should cover","options":{"a":"dismantling booby traps.","b":"investigating criminal activity.","c":"documenting all actions.","d":"how to remove and dispose of evidence."},"answer":"C"},{"num":746,"text":"PPE that needs more than routine cleaning should be","options":{"a":"cleaned by the wearer with specialized washing machines.","b":"disposed of by the wearer after decontamination.","c":"cleaned using preliminary exposure reduction methods.","d":"removed from service and reported to the supervisor."},"answer":"D"},{"num":747,"text":"To open a window for ventilation, place the tip of a ladder","options":{"a":"even with the top of the window and to the upwind side of it.","b":"three to five rungs above the window.","c":"just below the windowsill.","d":"even with the top of the window and to the downwind side of it."},"answer":"A"},{"num":748,"text":"Salvage operations begin upon arrival and continue until","options":{"a":"fire suppression is complete.","b":"overhaul operations begin.","c":"the scene is determined to be safe.","d":"the last unit leaves the scene."},"answer":"D"},{"num":749,"text":"The most common cause of oxygen-deficient atmospheres is","options":{"a":"combustion.","b":"elevated temperatures.","c":"carbon dioxide extinguishing systems.","d":"confined spaces."},"answer":"A"},{"num":750,"text":"It is recommended that underwear made of _____ be worn under PPE","options":{"a":"100 percent natural fibers","b":"50 percent spandex","c":"nylon or polyester","d":"non-fire-resistant synthetic materials"},"answer":"A"},{"num":751,"text":"What is the MOST effective tool for removing doubly laminated vehicle glass?","options":{"a":"Saw","b":"Center punch","c":"Axe","d":"Windshield cutter"},"answer":"A"},{"num":752,"text":"When administering chest compressions on a small child, rescuers should:","options":{"a":"only use one hand to avoid injuring the victim","b":"make sure the child is on a soft surface","c":"avoid using rescue breathing","d":"use both hands and align their shoulders directly over their hands"},"answer":"A"},{"num":753,"text":"Unprotected engineered-steel and wooden trusses used in construction","options":{"a":"can withstand heat exposure, but not flame contact","b":"are designed to remain intact under fire conditions","c":"can fail after five to ten minutes of exposure to fire","d":"are less popular in modern construction"},"answer":"C"},{"num":754,"text":"Which type of powered rescue tools can be used for pushing and pulling when combined with chains and adapters?","options":{"a":"Cutters","b":"Spreaders","c":"Pneumatic bags","d":"Extension rams"},"answer":"B"},{"num":755,"text":"What is the recommended extinguishing agent for batteries in electric and hybrid vehicles?","options":{"a":"Clean agent","b":"Carbon dioxide","c":"Dry chemical","d":"Water or foam"},"answer":"D"},{"num":756,"text":"Which two NFPA standards include information about the use and requirements for thermal imagers (TIs)?","options":{"a":"1010 and 1970","b":"1408 and 1801","c":"472 and 901","d":"1500 and 1901"},"answer":"B"},{"num":757,"text":"What is one disadvantage of using nonthreaded couplings","options":{"a":"Nonthreaded couplings are much easier to damage.","b":"Hydrants require an adapter to make connections with nonthreaded couplings.","c":"Fire hose cannot be connected as quickly with nonthreaded couplings.","d":"Double-male or double-female adapters are needed when deploying hose from the hose bed."},"answer":"B"},{"num":758,"text":"How can firefighters help prevent backdraft from occurring","options":{"a":"By controlling or limiting ventilation openings","b":"By creating multiple ventilation openings in the compartment","c":"By protecting the surrounding exposures","d":"By confining the fuel/air mixture in the compartment"},"answer":"A"},{"num":759,"text":"Hydraulic jacks may be used for stabilization when used with:","options":{"a":"chains","b":"cribbing","c":"nonhydraulic jacks","d":"wheel chocks"},"answer":"B"},{"num":760,"text":"What is one hazard associated with glass in fire conditions","options":{"a":"Glass will conceal fires within a compartment until it shatters","b":"Shattered glass will contribute to the fuel load","c":"Glass may crack and shatter spontaneously, causing sudden structural collapse","d":"Heated glass may crack and shatter when a cold hose stream strikes it"},"answer":"D"},{"num":761,"text":"Security doors with padlocks on the inside","options":{"a":"usually indicate there is a second means of entry.","b":"should have their hinges removed.","c":"will need to be pried from their frames.","d":"should not be forced."},"answer":"A"},{"num":762,"text":"To determine if there is damage on a kernmantle rope,","options":{"a":"check the elasticity of the rope.","b":"put a slight tension on the rope while feeling for lumps, depressions, or soft spots.","c":"untwist the rope strands so that each can be inspected.","d":"check the rope log to determine how often it has been used."},"answer":"B"},{"num":763,"text":"What is one general step for decontaminating medical equipment and nondisposable PPE?","options":{"a":"Clean contaminated station uniforms in home or public laundry facilities","b":"Decontaminate PPE on scene before transporting","c":"Decontaminate PPE in the kitchen area of the fire station","d":"Transport contaminated items to designated disinfecting area"},"answer":"D"},{"num":764,"text":"In order to eliminate the danger of the working end of a rope from slipping back through a knot, tie a(an)","options":{"a":"water knot.","b":"overhand safety knot.","c":"figure-eight.","d":"clove hitch."},"answer":"B"},{"num":765,"text":"Which statement accurately describes transfer of Incident Command","options":{"a":"Command can be transferred face-to-face or over-the-radio","b":"Command should be transferred no more than three times","c":"To avoid confusion, do not notify the other responders on scene of the change","d":"Previous IC(s) should leave the incident scene"},"answer":"A"},{"num":766,"text":"Inspecting extension ladders includes checking that the:","options":{"a":"pawl assemblies do not move in and out freely.","b":"fly sections move freely.","c":"halyard does not have water damage.","d":"halyard cable is loose when in the bedded position."},"answer":"B"},{"num":767,"text":"Mitigating foam hazards includes:","options":{"a":"disposing of equipment","b":"diluting concentrates","c":"decontaminating PPE","d":"flushing foam into water"},"answer":"C"},{"num":768,"text":"Which type of fuel is typically the easiest to ignite?","options":{"a":"Gas","b":"Liquid","c":"Solid","d":"Aqueous"},"answer":"A"},{"num":769,"text":"What is an example of an emergency exit indicator?","options":{"a":"A change in oxygen level","b":"A change in operational strategy","c":"An air cylinder needs replaced","d":"The situation is stabilized"},"answer":"A"},{"num":770,"text":"Which extinguishing agent should be applied on LNG fuel leaks?","options":{"a":"Dry powder","b":"Purple K dry chemical","c":"Water","d":"Carbon dioxide"},"answer":"B"},{"num":771,"text":"After identifying yourself in a radio transmission, you should","options":{"a":"wait for your microphone to key.","b":"continue with the rest of your message.","c":"wait for the receiver to acknowledge the message.","d":"repeat yourself one time."},"answer":"C"},{"num":772,"text":"When ventilating shingle-covered pitched roofs, cut:","options":{"a":"a few inches (mm) below the peak on the upwind side.","b":"at or near the lowest point of the roof, when possible.","c":"directly at the peak.","d":"a few inches (mm) below the peak on the downwind side."},"answer":"D"},{"num":773,"text":"Ladders are set at approximately _____ degrees for climbing","options":{"a":"45","b":"90","c":"75","d":"60"},"answer":"C"},{"num":774,"text":"When creating a fire line close to the fire's edge, firefighters should:","options":{"a":"throw burned material into the green","b":"throw dirt away from the fire","c":"scatter unburned fuels into the black","d":"throw dirt onto the fire to cool and smother it"},"answer":"D"},{"num":775,"text":"When donning SCBA from a seat mount, firefighters should","options":{"a":"do so while seated.","b":"stand in front of the seat.","c":"remove the apparatus seat belt first.","d":"connect the regulator and breathe cylinder air while in-transit."},"answer":"A"},{"num":776,"text":"Steel structural members that have been exposed to significant fire conditions","options":{"a":"will still support 60% of the designed load","b":"should not be cooled with water","c":"will begin to melt as temperatures rise","d":"could fail at any time"},"answer":"D"},{"num":777,"text":"Removing a windshield for extrication:","options":{"a":"clears the work area","b":"is preferred","c":"should never occur","d":"may weaken the vehicle body"},"answer":"D"},{"num":778,"text":"Which alarm-initiating device allows occupants to manually activate the alarm?","options":{"a":"Noncoded system","b":"Central station alarm","c":"Pull station","d":"Fire alarm control panel"},"answer":"C"},{"num":779,"text":"Indications of possible roof collapse include:","options":{"a":"spongy roofs.","b":"loose slate or tiles.","c":"sounding tools bouncing off a roof when striking it.","d":"no smoke or fire escaping from ventilation cuts."},"answer":"A"},{"num":780,"text":"Most line-of-duty deaths at ground cover fires result from:","options":{"a":"uncontrolled fire","b":"heart failure","c":"lightning","d":"smoke inhalation"},"answer":"B"},{"num":781,"text":"Catchalls are constructed from a salvage cover and used","options":{"a":"to cover doors and windows after openings have been made.","b":"to route large amounts of water out of the structure through windows or doors.","c":"as a temporary means to control large amounts of water until chutes can be constructed.","d":"as a carrying device for salvage tools and equipment."},"answer":"C"},{"num":782,"text":"Dry chemical wheeled units are:","options":{"a":"rated for Class A, B, and C fires.","b":"applied in the same manner as handheld, stored-pressure extinguishers.","c":"smaller than the handheld units.","d":"intended for Class D combustible metal fires."},"answer":"A"},{"num":783,"text":"Tactics for LPG vehicle incidents include:","options":{"a":"directing streams at the bottom of the tank","b":"allowing any fire to self-extinguish","c":"contacting hazmat immediately","d":"using Purple-K on leaking fuel"},"answer":"B"},{"num":784,"text":"Which tools would be most useful for opening ceilings to inspect for fire extension","options":{"a":"Pike poles and plaster hooks","b":"Prying tools","c":"Bale hooks and pitchforks","d":"Power saws"},"answer":"A"},{"num":785,"text":"Handsaws may be useful","options":{"a":"in creating the initial cut before using a power saw","b":"when the work space around a cut is limited","c":"if quicker cutting operations are needed","d":"when used in combination with another tool"},"answer":"B"},{"num":786,"text":"Carbon dioxide, sulfur dioxide, and chlorine are examples of","options":{"a":"nonfire gases and vapors.","b":"nonhazardous materials.","c":"oxygen-enriched materials.","d":"fire gases and vapors."},"answer":"A"},{"num":787,"text":"Because they slow the travel of people through the door opening, _____ doors are never allowed as a part of means of egress during fire conditions","options":{"a":"revolving","b":"swinging","c":"sliding","d":"Folding"},"answer":"C"},{"num":788,"text":"Thermal layering can be significantly altered by","options":{"a":"isolated or intermittent flames","b":"ventilation and flow paths","c":"products of combustion","d":"Backdrafts"},"answer":"B"},{"num":789,"text":"SCBA annual inspection and maintenance by specially trained, factory-qualified technicians should be","options":{"a":"performed if SCBA misuse or negligence is suspected.","b":"part of the doffing procedures after leaving the hot zone.","c":"documented in the SCBA maintenance log.","d":"performed after each use."},"answer":"C"},{"num":790,"text":"Newer mortise latch and lock units consist of both a latch and a(an)","options":{"a":"night latch","b":"door chain","c":"electronic keyless lock","d":"key-operated deadbolt."},"answer":"D"},{"num":791,"text":"The Incident Command Post (ICP) at an incident scene","options":{"a":"is established in an area where the Incident Commander (IC) is not accessible.","b":"should be unmarked and unidentifiable to avoid unwanted attention.","c":"makes the Incident Commander (IC) accessible to other personnel.","d":"should be downhill, downwind, or downstream from the incident."},"answer":"C"},{"num":792,"text":"Where do the hooks of a roof ladder fit when it is deployed","options":{"a":"The top rung of the ground ladder that was used to carry it","b":"The roof's edge","c":"The roof's peak","d":"The halyard of the ground ladder that was used to carry it"},"answer":"C"},{"num":793,"text":"When inspecting wooden ladders or ladders with wooden components, look for","options":{"a":"damaged or missing rubber on the footpads.","b":"damage to the halyard.","c":"a change in the color on the heat-sensor label.","d":"water damage."},"answer":"D"},{"num":794,"text":"High-pressure bobtail tanks commonly contain LPG or:","options":{"a":"liquid nitrogen","b":"parathion","c":"methyl salicylate","d":"anhydrous ammonia"},"answer":"D"},{"num":795,"text":"What is the primary use of a bar screw jack?","options":{"a":"Heavy lifting operations","b":"Supporting collapsed structural members","c":"Pushing or pulling operations","d":"Replacing wooden cross braces during trench rescue"},"answer":"B"},{"num":796,"text":"What is a responsibility of a Firefighter II at a rope rescue incident?","options":{"a":"Locating rescue equipment on an apparatus and taking it to technical rescuers","b":"Providing a safety net for the rescuers","c":"Performing rescue in high-angle situations","d":"Serving as a backup rescue team for the primary rescue team"},"answer":"A"},{"num":797,"text":"Where should water in hoselines should be drained after fire extinguishment is complete to prevent unnecessary water damage","options":{"a":"Up the stairway or out fire doors","b":"Down a floor drain, out a window, or down a stairway","c":"On the fire floor","d":"Into the surrounding compartment"},"answer":"B"},{"num":798,"text":"When climbing a ladder, grasp","options":{"a":"rungs with palms up.","b":"alternating rungs.","c":"the same rung with both hands.","d":"beams rather than rungs."},"answer":"B"},{"num":799,"text":"Which foam application technique involves directing the foam stream on the ground near the front edge of a burning liquid spill?","options":{"a":"Bank-down method","b":"Direct method","c":"Rain-down method","d":"Roll-on method"},"answer":"D"},{"num":800,"text":"Which action improves survivability during a MAYDAY","options":{"a":"opening doors.","b":"removing regulator.","c":"staying low.","d":"running."},"answer":"C"},{"num":801,"text":"During victim self-evacuation, rescuers may","options":{"a":"shelter in place.","b":"carry victims inside.","c":"open stairwells.","d":"establish a safe haven away from the structure."},"answer":"D"},{"num":802,"text":"Forcing entry through a sliding patio door may include","options":{"a":"spreading the door from the frame with a hydraulic spreader or prying tool.","b":"using the same techniques used to force a swinging door.","c":"breaking the door glass with an axe.","d":"cutting through the lock with a power saw."},"answer":"C"},{"num":803,"text":"In simple terms, products of combustion are","options":{"a":"carbon dioxide and methane","b":"heat and smoke","c":"flaming and nonflaming","d":"fire and ash"},"answer":"B"},{"num":804,"text":"Under fire conditions, Type III construction with _____ construction walls can collapse in one piece or crumble","options":{"a":"masonry","b":"steel","c":"wood","d":"plaster"},"answer":"A"},{"num":805,"text":"Fire prevention officers/inspectors, plans examiners, and fire and life safety educators are positions in the ____ division","options":{"a":"training","b":"operations","c":"fire prevention or Community Risk Reduction (CRR)","d":"incident safety/health and safety"},"answer":"C"},{"num":806,"text":"To safely and efficiently perform assigned tasks, a Firefighter I must maintain situational awareness throughout the entire operation by","options":{"a":"remaining observant about changing conditions on the emergency scene.","b":"changing strategies, tactics, and orders during an incident.","c":"relying on other personnel to remain aware of hazards.","d":"asking for situation updates every 15 minutes."},"answer":"A"},{"num":807,"text":"Inspection of an extinguisher before use may include:","options":{"a":"removing the hose to thoroughly inspect it for damage or obstructions.","b":"visually inspecting the external condition of the extinguisher.","c":"squeezing the handles together to release a short burst to test the extinguisher.","d":"pulling and twisting the pin to check its condition."},"answer":"B"},{"num":808,"text":"The highest risk factor that firefighters face is to have a _____ as a result of overexertion, poor health habits, or occupational stress","options":{"a":"sudden cardiac arrest","b":"physical breakdown","c":"hemorrhage","d":"mental breakdown"},"answer":"A"},{"num":809,"text":"What is one way firefighters can influence fire dynamics at a structure fire","options":{"a":"Using water and foam for chemical flame inhibition","b":"Using dry chemicals and halogenated agents to cool hot fire gases and surfaces","c":"Using doors to control the amount of air available to the fire","d":"Using flashover or backdraft to control the fire"},"answer":"C"},{"num":810,"text":"What is one hazardous condition to consider in a Type I structure fire","options":{"a":"The structure may degrade from the effects of fire.","b":"The structural members will add to the fire load.","c":"The structure may easily collapse.","d":"The structure has a low fire-resistive rating."},"answer":"A"},{"num":811,"text":"Lightweight steel trusses used in structures of tilt-up construction can","options":{"a":"fail once the metal gusset plates fall out during a fire.","b":"be protected from fire with gypsum wall board or spray-on fire resistant material.","c":"be expected to fail much slower than other types of lightweight trusses.","d":"withstand most fuel loads within the structure."},"answer":"B"},{"num":812,"text":"The type of PPE cleaning required is determined by the amount and type of contamination and","options":{"a":"whether the equipment must be removed from service.","b":"the type of cleaning equipment available to a department.","c":"how long the PPE has been in service.","d":"whether spare sets of PPE are available."},"answer":"A"},{"num":813,"text":"To shut off the inline valve on a natural gas pipeline, the tang should be turned until it is:","options":{"a":"45 degrees to the pipe","b":"rotated 360 degrees","c":"90 degrees to the pipe","d":"in line with the pipe"},"answer":"C"},{"num":814,"text":"When equipped with a metal-cutting blade, a _____ saw is ideal for cutting sheet metal body panels and structural components on vehicles","options":{"a":"chain","b":"rotary","c":"reciprocating","d":"circular"},"answer":"C"},{"num":815,"text":"A wide-angle fog pattern has","options":{"a":"the highest forward velocity and the longest reach of all the fog settings.","b":"less forward velocity, but a longer reach than other fog settings.","c":"the highest forward velocity, and its reach varies in proportion to the pressure applied.","d":"less forward velocity and a shorter reach than other fog settings."},"answer":"D"},{"num":816,"text":"To detect propane, the industry uses an additive called:","options":{"a":"ethyl mercaptan","b":"methanol","c":"ethylene glycol","d":"n-butanol"},"answer":"A"},{"num":817,"text":"What is the main hazard associated with photovoltaic roofs","options":{"a":"Roof panels may retain a significant amount of electricity under fire conditions.","b":"Multiple layers of roof panels creates a void air space, which may conceal fires in the structure.","c":"HVAC units can be hidden from view underneath the roofs.","d":"Roof drainage adds weight to the roof, increasing the collapse hazard."},"answer":"A"},{"num":818,"text":"Firefighter station and work uniforms","options":{"a":"are made of non-
