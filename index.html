:"neurogenic","c":"cardiogenic","d":"hypovolemic"},"answer":"B"},{"num":1096,"text":"Firefighters should ensure that PASS devices are on and operating properly:","options":{"a":"before entering the structure","b":"before applying water to the fire","c":"after entering the structure","d":"once they reach the seat of the fire"},"answer":"A"},{"num":1097,"text":"The purpose of a rapid intervention crew (RIC) is to","options":{"a":"rescue firefighters.","b":"conduct primary search.","c":"conduct secondary search.","d":"rescue occupants."},"answer":"A"},{"num":1098,"text":"When conducting maintenance of portable lighting equipment, firefighters should:","options":{"a":"inspect all electrical cords for damage","b":"perform repairs of electrical wires and components","c":"connect all lights to the generator at one time","d":"allow qualified technicians to replace faulty bulbs"},"answer":"A"},{"num":1099,"text":"The methods used to fight ground cover fires revolve around:","options":{"a":"total extinguishment","b":"property conservation","c":"perimeter control","d":"exposure protection"},"answer":"C"},{"num":1100,"text":"Type V construction has exterior load-bearing walls composed entirely of","options":{"a":"metal.","b":"wood.","c":"brick.","d":"Concrete."},"answer":"B"},{"num":1101,"text":"To isolate ignition source hazards at vehicle incidents, responders should:","options":{"a":"remove power lines","b":"activate air bags","c":"cut struts","d":"disconnect batteries"},"answer":"D"},{"num":1102,"text":"Gypsum wallboard or lath-and-plaster partition walls","options":{"a":"may hide what materials are actually inside of them.","b":"increase the fire resistance of the walls.","c":"are more difficult to breach than other interior walls.","d":"must be breached with power saws."},"answer":"B"},{"num":1103,"text":"Field Level briefings occur at the:","options":{"a":"end of an incident.","b":"beginning of an incident and as necessary throughout.","c":"end of an operational shift.","d":"beginning of an operational shift."},"answer":"D"},{"num":1104,"text":"The scene perimeter for explosions","options":{"a":"may expand as additional debris is located.","b":"should be established at 1.5 times the distance from the area of origin.","c":"must be the same as a scene perimeter for structure fires.","d":"may not be recognizable to bystanders."},"answer":"A"},{"num":1105,"text":"A situation that might cause a fire to enter fuel-limited decay would be a compartment","options":{"a":"fire with a new source of ventilation","b":"that has failed and burned to the ground","c":"that has additional fuel added","d":"fire with an increasing heat release rate"},"answer":"B"},{"num":1106,"text":"Structural overhaul typically begins in the area","options":{"a":"of origin.","b":"of least severe fire involvement.","c":"with the most property damage.","d":"of most severe fire involvement."},"answer":"D"},{"num":1107,"text":"Which SCBA component reduces the air cylinder's high pressure to slightly above atmospheric pressure and controls air flow to the wearer","options":{"a":"Facepiece assembly","b":"Regulator assembly","c":"Remote pressure gauge","d":"Backplate assembly"},"answer":"B"},{"num":1108,"text":"The three main influences on ground cover fire behavior are the _____, weather at the time of the fire, and topography of the area.","options":{"a":"size of the fire","b":"population of the area","c":"fuel(s) involved","d":"exposures present"},"answer":"C"},{"num":1109,"text":"When breaching walls to force entry, remember that","options":{"a":"interior walls will be more difficult to breach than exterior walls.","b":"firefighters must know every building utility that exists in the wall before breaching.","c":"it is safer than breaching doors and windows but is more time-consuming.","d":"breaching load-bearing exterior walls in fire-weakened structures could cause partial"},"answer":"D"},{"num":1110,"text":"What is a good visual indicator that a fire is leaving the incipient stage","options":{"a":"Smoke density","b":"Flame color","c":"Flame height","d":"Sparks"},"answer":"C"},{"num":1111,"text":"Which statement is true of cleaning firefighting equipment?","options":{"a":"Most equipment requires very little cleaning","b":"Equipment cleaning should be performed by a qualified technician","c":"Personnel should consult the safety data sheet (SDS) when using solvents","d":"Never use soap to clean equipment"},"answer":"C"},{"num":1112,"text":"Firefighters should identify possible safe havens within the structure in order to have a space","options":{"a":"for rehabilitation.","b":"closed off to heat, smoke, and toxic gases.","c":"for medical evaluation.","d":"for command and RIC."},"answer":"B"},{"num":1113,"text":"What is one advantage of using a slide valve for nozzle control","options":{"a":"Slide valves allow the nozzle to be operated in any position between fully closed and fully open.","b":"The nozzle can be closed quickly without the risk of water hammer.","c":"Slide valves do not cause turbulence.","d":"The nozzle operator does not have to control the operating flow and nozzle reaction."},"answer":"C"},{"num":1114,"text":"When engineered roof joists fail quickly under fire conditions,","options":{"a":"firefighters will only be able to tell by \"sounding\" or standing on the roof","b":"the roof decking will fall directly into the fire","c":"the roof will immediately start to sag","d":"there may not be any indicator to firefighters that the roof is failing"},"answer":"D"},{"num":1115,"text":"What is the most likely use of salvage covers during salvage operations","options":{"a":"Preventing damage to flooring during fire suppression","b":"Catching and carrying debris","c":"Protecting unaffected furniture and areas of the building","d":"Providing a water basin for immersing small burning or smoldering objects"},"answer":"C"},{"num":1116,"text":"If no fire is visible at a CNG vehicle incident:","options":{"a":"use a gas detector to locate leaks and eliminate ignition sources","b":"contact a hazardous materials technician","c":"enter the vehicle to turn off ignition","d":"cool the container with water"},"answer":"A"},{"num":1117,"text":"Forcing entry through projecting and pivoting windows may be limited to breaking the glass or","options":{"a":"cutting through the wall around the entire window assembly.","b":"forcing the lock on the outside of the window.","c":"cutting the window panel out of the frame.","d":"prying the window up from the frame."},"answer":"C"},{"num":1118,"text":"Hand tools cannot cut through posts made from:","options":{"a":"aluminum","b":"copper","c":"exotic metals","d":"steel"},"answer":"C"},{"num":1119,"text":"How does a vehicle-mounted generator compare to a portable generator","options":{"a":"It is typically smaller than a portable unit.","b":"It is less commonly used than a portable unit.","c":"It has more power than a portable unit.","d":"It has less power than a portable unit."},"answer":"C"},{"num":1120,"text":"When using a fire department pumper for hose testing, the hose should be connected on the:","options":{"a":"side of the apparatus opposite the pump panel","b":"front of the apparatus","c":"rear of the apparatus","d":"same side as the pump panel"},"answer":"A"},{"num":1121,"text":"The purpose of fire and life safety surveys in private dwellings is to:","options":{"a":"determine the extent to which community members implement fire and life safety","b":"give residents the opportunity to meet fire department members","c":"provide fundraising opportunities for the department","d":"see if residents are violating fire or building codes"},"answer":"A"},{"num":1122,"text":"In order to minimize your exposure to risk at an incident, you should","options":{"a":"let more experienced personnel respond first.","b":"wear more PPE than is required.","c":"work individually under your own supervision.","d":"conduct a risk/benefit analysis for every action."},"answer":"D"},{"num":1123,"text":"What should firefighters do if they inhale excessive heat or heated gases into their lungs","options":{"a":"Introduce fresh, cool air","b":"Introduce cold water into the air","c":"Don an emergency breathing support system (EBSS)","d":"Seek prompt medical attention"},"answer":"D"},{"num":1124,"text":"What does frost on the exterior of an LNG fuel tank indicate?","options":{"a":"There is no leak","b":"There is no fire hazard","c":"Empty tank","d":"Tank failure"},"answer":"D"},{"num":1125,"text":"Inspection of salvage covers","options":{"a":"should occur while they are still wet from cleaning.","b":"must be performed by the manufacturer.","c":"is not necessary as they are disposable.","d":"should occur after they are dried."},"answer":"D"},{"num":1126,"text":"Water and water-based agents can be used to extinguish all _____ fuels.","options":{"a":"Class B","b":"Class D","c":"Class A","d":"Class C"},"answer":"C"},{"num":1127,"text":"In order to open a door with an electromagnetic lock, firefighters should","options":{"a":"shut off the power to the door","b":"remove the hinges from the door","c":"spread the door from the door jamb","d":"cut through the door lock"},"answer":"A"},{"num":1128,"text":"An important step in traffic incident management at a highway/roadway incident is","options":{"a":"interviewing witnesses in the cars that drive by.","b":"establishing traffic control zones.","c":"collecting evidence before letting cars pass the scene.","d":"shutting down all lanes of traffic."},"answer":"B"},{"num":1129,"text":"Which type of extinguisher is intended primarily for use on ground cover fires?","options":{"a":"Stored-pressure water-mist extinguisher","b":"Pump-type water extinguisher","c":"Aqueous film forming foam (AFFF) extinguisher","d":"Carbon dioxide extinguisher"},"answer":"B"},{"num":1130,"text":"What is the next step after a vehicle incident scene has been assessed?","options":{"a":"Hazard mitigation","b":"Vehicle stabilization","c":"Victim extrication","d":"Scene documentation"},"answer":"B"},{"num":1131,"text":"What is one quality of a competent ignition source?","options":{"a":"Material must be liquid","b":"Material must be solid","c":"Adequate ventilation","d":"Sufficient heat energy transfer"},"answer":"D"},{"num":1132,"text":"When determining the area of origin at a ground cover fire, remember that:","options":{"a":"there will be no unburned material","b":"the point of origin is always central","c":"fire burns equally in all directions","d":"fire spread may be affected by wind and topography"},"answer":"D"},{"num":1133,"text":"Some of the medical and physical requirements of NFPA 1550 include medical evaluations, development of physical performance standards, and","options":{"a":"medical records being available to all personnel.","b":"operation of an infection control program.","c":"randomized drug testing to be administered twice a year.","d":"monthly medical exams to ensure continued fitness for duty."},"answer":"B"},{"num":1134,"text":"A person smelling propane or natural gas is an example of:","options":{"a":"physical evidence","b":"trace evidence","c":"circumstantial evidence","d":"direct evidence"},"answer":"D"},{"num":1135,"text":"Why is structural fire fighting PPE NOT practical for wildland fire fighting","options":{"a":"It is not made of synthetic materials.","b":"It is too thin and light.","c":"It is generally too bulky, heavy, and hot.","d":"It does not protect the wearer from extreme heat."},"answer":"C"},{"num":1136,"text":"The greatest danger of fires in stacked and piled combustible materials is:","options":{"a":"rollover","b":"hazardous materials exposure","c":"collapse","d":"fire spreading to exposures"},"answer":"D"},{"num":1137,"text":"Which would be a time when firefighters should check their SCBA gauges","options":{"a":"Immediately after entering an IDLH atmosphere","b":"Once the operation is complete","c":"When moving from one area to another.","d":"When removing SCBA"},"answer":"C"},{"num":1138,"text":"When advancing a hoseline into a burning structure, firefighters should","options":{"a":"charge the hoseline before advancing it towards the designated point of entry.","b":"open the nozzle fully to bleed air from the hose and check for adequate water flow.","c":"keep doors that will be used as a point of entry open.","d":"position the nozzle operator and hose team members on opposite sides of the hoseline."},"answer":"B"},{"num":1139,"text":"After exiting the field reduction of contaminants, firefighters then proceed to","options":{"a":"the station","b":"the fire apparatus.","c":"medical monitoring.","d":"the warm zone."},"answer":"C"},{"num":1140,"text":"Utility rope that is used to hoist equipment, secure unstable objects, or cordon off an area","options":{"a":"has specific NFPA standards addressing its use.","b":"must be removed from service if subjected to an impact load.","c":"may be downgraded life safety rope.","d":"does not require regular inspection."},"answer":"C"},{"num":1141,"text":"How should an aqueous film forming foam (AFFF) solution be applied onto a fuel?","options":{"a":"The solution should rain down gently onto the fuel's surface or deflect off a nearby object or surface.","b":"The solution should be applied directly onto the fuel's surface.","c":"The solution should be applied directly onto the point where the fuel is leaking from.","d":"The solution should blanket the area immediately around the fuel, but not the fuel's surface."},"answer":"A"},{"num":1142,"text":"How can you limit ambient noise during radio communications","options":{"a":"Avoid using voice amplification devices.","b":"Move near noise-emitting equipment when transmitting.","c":"Use your body or PPE to create a wind barrier when transmitting.","d":"Use repeaters when transmitting."},"answer":"C"},{"num":1143,"text":"Which fire alarm component senses products of combustion and sends a signal to the control panel?","options":{"a":"Fire command center","b":"Automatic initiating device","c":"Manual initiating device","d":"Notification appliance"},"answer":"B"},{"num":1144,"text":"If environmental conditions allow, what can firefighters do to lessen heat stress and reduce their heart rate while wearing structural fire fighting PPE","options":{"a":"Simply leave the hot environment for a short period of time","b":"Allow the protective clothing to trap body heat and sweat inside the clothing barriers","c":"Open or remove protective clothing to permit air flow around your body","d":"Remove station/work uniforms as a layer worn beneath the PPE"},"answer":"C"},{"num":1145,"text":"Which type of fence may be easier to go over with an A-frame ladder rather than through it with a cutting tool","options":{"a":"Barbed wire","b":"Chain-link","c":"Masonry","d":"Electric"},"answer":"C"},{"num":1146,"text":"Security bars or grilles on windows","options":{"a":"must not be removed or disabled for fire fighting operations.","b":"have a negative effect on fire and life safety.","c":"are not permitted by building codes, but may be illegally installed.","d":"provide great vertical ventilation."},"answer":"B"},{"num":1147,"text":"Which activity should NOT be allowed during a fire station tour?","options":{"a":"Children wearing clean PPE","b":"Firefighters responding to an emergency during a tour","c":"Visitors roaming around the station unescorted","d":"Visitors climbing on apparatus"},"answer":"C"},{"num":1148,"text":"How does a nonhydraulic jack differ from a hydraulic jack?","options":{"a":"Designed for heavy lifting","b":"Much less powerful","c":"Much more powerful","d":"Much more stable"},"answer":"B"},{"num":1149,"text":"The size of the nozzle opening or orifice, along with _____ will determine the quantity of water flowing from the nozzle","options":{"a":"water velocity","b":"air friction","c":"nozzle pressure","d":"Gravity"},"answer":"C"},{"num":1150,"text":"What should the attack team do if they open the door to a structure and observe a low neutral plane and turbulent smoke?","options":{"a":"Close the door and use a different entrance","b":"Perform negative pressure ventilation","c":"Apply water to the hot gas layer while advancing","d":"Apply water to the hot gas layer, but stay outside the structure"},"answer":"D"},{"num":1151,"text":"How can a building's contents affect structural collapse","options":{"a":"Contents may create barriers that block fire spread and keep structural members sound","b":"Contents will burn much slower, but more intensely, causing rapid structural failure","c":"Contents stored in concealed spaces can increase the potential for ceiling joists to fail","d":"Contents that burn slowly may give the illusion that a structure is more stable than it actually is"},"answer":"C"},{"num":1152,"text":"Which type of extinguishing agent is NOT rated for use on other classes of fire?","options":{"a":"Class A","b":"Class B","c":"Class D","d":"Class C"},"answer":"C"},{"num":1153,"text":"To avoid respiratory hazards, firefighters should","options":{"a":"let hazmat-certified personnel handle any situation that is considered IDLH.","b":"wear SCBA to any incident, whether it is deemed an IDLH situation or not.","c":"wear SCBA at an incident until they feel it is safe to remove it.","d":"never remove SCBA during structural fire fighting until your supervisor or IC says it is safe to do so."},"answer":"D"},{"num":1154,"text":"Which type of rim lock will lock when the door closes","options":{"a":"Electromagnetic lock","b":"Night latch","c":"Key-in-knob lock","d":"Vertical deadbolt"},"answer":"B"},{"num":1155,"text":"One safety precaution to remember when wearing SCBA is that","options":{"a":"air supply duration varies.","b":"improved visibility indicates an area is free of contamination.","c":"radio contact is the most sufficient form of communication in an IDLH atmosphere.","d":"the low air alarm does not mean to exit the area."},"answer":"A"},{"num":1156,"text":"When would a fire service hose need to be tested?","options":{"a":"After a vehicle has run over the hose","b":"At the beginning of each work shift","c":"Every six months","d":"After prolonged use at a fire scene"},"answer":"A"},{"num":1157,"text":"The autoignition temperature (AIT) of a substance is","options":{"a":"always lower than its piloted ignition temperature","b":"the same as its piloted ignition temperature","c":"the maximum temperature at which a fuel must be heated to start combustion","d":"always higher than its piloted ignition temperature"},"answer":"D"},{"num":1158,"text":"Evidence of spalling on concrete may indicate:","options":{"a":"a hazardous materials incident.","b":"a loss of structural integrity.","c":"arson.","d":"an accidental fire."},"answer":"B"},{"num":1159,"text":"In the passport system, when do firefighters get their passports back","options":{"a":"After leaving the IDLH environment","b":"After going through decon procedures","c":"After they are back at the station","d":"After going through rehabilitation procedures"},"answer":"A"},{"num":1160,"text":"A structure fire scene perimeter should:","options":{"a":"be set at 1.5× debris distance","b":"be at least 100 feet","c":"extend beyond the farthest evidence","d":"be as small as possible"},"answer":"C"},{"num":1161,"text":"What is a major hazard of a Type V construction building under fire conditions","options":{"a":"Interior collapse","b":"Localized structural collapse","c":"Falling debris causing other structures to collapse","d":"Flying glass from windows"},"answer":"A"},{"num":1162,"text":"When conducting tactical vertical ventilation in high-rise buildings, stairwells should:","options":{"a":"only be used for evacuation procedures.","b":"be controlled to prevent occupants from entering ventilation stairwells.","c":"be simultaneously used for both ventilation and evacuation operations.","d":"only be used for ventilation operations."},"answer":"B"},{"num":1163,"text":"What personnel are typically stationed in the warm zone","options":{"a":"Those providing direct support to personnel in the hot zone","b":"General public (media, civilians, witnesses, onlookers, etc.)","c":"Rapid intervention crews (RICs)","d":"Those personnel mitigating the problem at the scene"},"answer":"A"},{"num":1164,"text":"Inspection of roof ladders includes checking","options":{"a":"the tautness of the halyard cable.","b":"the movement of pawl assemblies.","c":"fly sections for damage.","d":"hook assemblies for signs of rust."},"answer":"D"},{"num":1165,"text":"Which technique should be used when attacking a shielded fire?","options":{"a":"Attack from multiple entry points","b":"Apply water onto shielding objects","c":"Apply water to the hot gas layer without advancing","d":"Cool the hot gas layer while advancing"},"answer":"D"},{"num":1166,"text":"One disadvantage of using lifting jacks is that they:","options":{"a":"cannot be adjusted to common vehicle heights","b":"cannot fit into tight spaces","c":"are less safe than other methods","d":"may shift, allowing a vehicle to move"},"answer":"D"},{"num":1167,"text":"What is the primary purpose of salvage operations","options":{"a":"Fire suppression","b":"Evidence preservation","c":"Fire investigation","d":"Property conservation"},"answer":"D"},{"num":1168,"text":"Because fires inside structures are almost always _____, tactical ventilation may provide the fire with the necessary oxygen to grow.","options":{"a":"ventilation-limited","b":"fuel-limited","c":"oxygen enriched","d":"approaching rapid fire development"},"answer":"A"},{"num":1169,"text":"When pressurizing a hose for testing, firefighters should:","options":{"a":"stand next to the discharge valve connection while charging","b":"close valves as quickly as possible","c":"pressurize the hose beyond recommended pressure","d":"lay the hose flat on the ground before charging"},"answer":"D"},{"num":1170,"text":"How should a natural fiber rope be cleaned","options":{"a":"Soaked in a bleach solution","b":"Washed with warm water and detergent","c":"Wiped or gently brushed","d":"Washed with cold water and no cleaning solvents"},"answer":"C"},{"num":1171,"text":"What should be done with deceased victims during a fire investigation?","options":{"a":"Decontaminate them before marking as evidence","b":"Leave them in place and do not disturb them","c":"Transport them as soon as possible","d":"Remove and tag them as evidence"},"answer":"B"},{"num":1172,"text":"Protection plates are strips of metal attached to ladders","options":{"a":"at the butt of the ladder.","b":"on the beam.","c":"on the rungs.","d":"at chafing points."},"answer":"D"},{"num":1173,"text":"What is one way to demonstrate leadership traits?","options":{"a":"Transfer command immediately.","b":"Accept input and feedback from others.","c":"Delegate demanding tasks.","d":"Give strict time constraints."},"answer":"B"},{"num":1174,"text":"During search and rescue operations, rescuers should","options":{"a":"find the room center.","b":"leave doors open.","c":"stay low if visibility is limited.","d":"enter regardless of survivability."},"answer":"C"},{"num":1175,"text":"To prevent contamination at the site and/or removal or loss of evidence relating to the origin and cause of the fire, firefighters must conduct _____ procedures","options":{"a":"scene preservation","b":"salvage","c":"field reduction of contaminants","d":"rehabilitation"},"answer":"A"},{"num":1176,"text":"Protective gloves worn for structural fire fighting","options":{"a":"protect the hands from hazardous materials.","b":"may not allow enough dexterity to grasp tools and small objects.","c":"must be NFPA compliant.","d":"must not cover the wristlet of the protective coat."},"answer":"C"},{"num":1177,"text":"When making a forward hose lay, the driver/operator and firefighter making the connection should communicate so that the firefighter making the connection","options":{"a":"does not have to leave the apparatus to secure the hose","b":"can make sure water will not arrive until after the tank is empty.","c":"ensures the first coupling to come off the hose bed is female.","d":"can make sure water will arrive before the tank is empty."},"answer":"D"},{"num":1178,"text":"What are attached to hard-suction hose during drafting operations to keep debris from entering the apparatus or pump","options":{"a":"Reducer couplings","b":"Gated wyes","c":"Siamese appliances","d":"Intake strainers"},"answer":"D"},{"num":1179,"text":"Unless identified during pre-fire planning or size-up, firefighters should assume that any structure fire is ventilation-limited and:","options":{"a":"the structure itself consists of lightweight construction.","b":"that horizontal ventilation should be attempted first.","c":"the structure itself consists of heavy timber construction.","d":"that vertical ventilation should be attempted first."},"answer":"A"},{"num":1180,"text":"What is an auto-cascade system","options":{"a":"A stationary air fill system that automatically fills a cylinder to the desired pressure","b":"A mobile breathing air fill system designed to automatically refill cylinders at emergency incidents","c":"A mobile breathing air fill system designed to refill cylinders while firefighters are still wearing the cylinders","d":"A stationary air fill system installed in high-rise buildings"},"answer":"A"},{"num":1181,"text":"Which sprinkler is designed to discharge most of its water to one side?","options":{"a":"Sidewall","b":"Concealed","c":"Pendent","d":"Upright"},"answer":"A"},{"num":1182,"text":"Who selects the level of competency fire department members should be trained to meet","options":{"a":"The authority having jurisdiction (AHJ)","b":"Chief officer","c":"The National Fire Protection Association (NFPA)","d":"Firefighter II"},"answer":"A"},{"num":1183,"text":"During fire conditions, swinging doors are usually required","options":{"a":"as fire doors to protect openings that are not a means of egress.","b":"to ventilate openings for smoke.","c":"as exit doors in a means of egress.","d":"to be propped open."},"answer":"C"},{"num":1184,"text":"An atmosphere containing a flammable gas in excess of 10 percent of its _____ is considered hazardous","options":{"a":"autoignition temperature (AIT)","b":"lower explosive limit (LEL).","c":"parts per million (ppm)","d":"upper explosive limit (UEL)"},"answer":"B"},{"num":1185,"text":"The VEIS search method is","options":{"a":"rapid rescue and room isolation.","b":"first step of search.","c":"secondary search.","d":"part of 360 size-up."},"answer":"A"},{"num":1186,"text":"Before entering the building or fire area, the firefighter assigned to the nozzle should:","options":{"a":"open the nozzle halfway","b":"bleed the air from the hoseline","c":"ensure the bale is closed","d":"rapidly open and close the nozzle"},"answer":"B"},{"num":1187,"text":"When performing a one-firefighter single ladder raise, the firefighter","options":{"a":"can place the butt end at the point where it will be located for climbing.","b":"should use a rope to raise the ladder.","c":"will need to steady the ladder against a building or another object before raising.","d":"should use the low-shoulder carry before raising."},"answer":"A"},{"num":1188,"text":"How might law enforcement interact with fire department personnel","options":{"a":"Dispatching a medical professional to a scene","b":"Coordinating multiagency activities","c":"Shutting off natural gas lines or water mains","d":"Providing incident scene security"},"answer":"D"}];

function toggleMode(){state.mode=state.mode==="practice"?"exam":"practice";save();render();}
function toggleJump(){document.getElementById("jump").classList.toggle("show");buildJump();}
function resetExam(){if(confirm("Reset all answers and progress?")){state={i:0,answers:{},mode:"practice"};save();render();}}
function restart(){state.i=0;state.answers={};save();document.getElementById("results").style.display="none";render();}
function choose(letter){state.answers[state.i]=letter;save();render();}
function next(){if(state.i<QUESTIONS.length-1){state.i++;save();render();window.scrollTo(0,0)}else scoreNow();}
function prev(){if(state.i>0){state.i--;save();render();window.scrollTo(0,0)}}
function scoreNow(){let a=Object.keys(state.answers).length,c=Object.entries(state.answers).filter(([i,v])=>v===QUESTIONS[i].answer).length;document.getElementById("exam").style.display="none";document.getElementById("results").style.display="block";document.getElementById("score").textContent=(a?Math.round(c/a*100):0)+"%";document.getElementById("detail").textContent=`${c} correct out of ${a} answered (${QUESTIONS.length-a} unanswered).`;}
function review(){document.getElementById("results").style.display="none";document.getElementById("exam").style.display="block";state.i=0;render();}
function buildJump(){const j=document.getElementById("jump");j.innerHTML="";QUESTIONS.forEach((q,i)=>{let b=document.createElement("button");b.textContent=i+1;if(state.answers[i])b.classList.add(state.answers[i]===q.answer?"correct":"wrong");b.onclick=()=>{state.i=i;save();render();window.scrollTo(0,0)};j.appendChild(b)})}
function render(){
 document.getElementById("exam").style.display="block";
 const q=QUESTIONS[state.i], selected=state.answers[state.i];
 let answered=Object.keys(state.answers).length;
 let correct=Object.entries(state.answers).filter(([i,v])=>v===QUESTIONS[i].answer).length;
 document.getElementById("answered").textContent=`Answered: ${answered} / ${QUESTIONS.length}`;
 document.getElementById("correct").textContent=`Correct: ${answered?correct:"—"}`;
 document.getElementById("current").textContent=`Current: #${state.i+1}`;
 document.getElementById("fill").style.width=(answered/QUESTIONS.length*100)+"%";
 document.getElementById("modeBtn").textContent="Mode: "+(state.mode==="practice"?"Practice":"Exam");
 const letters=["a","b","c","d"];
 let opts=letters.map(l=>`<button class="option ${selected===l?"selected":""} ${state.mode==="practice"&&selected?(l===q.answer?"correct":(l===selected?"wrong":"")):""}" onclick="choose('${l}')"><span class="letter">${l.toUpperCase()}.</span><span>${escapeHtml(q.options[l])}</span></button>`).join("");
 let fb="";
 if(state.mode==="practice"&&selected) fb=`<div class="feedback show ${selected===q.answer?"good":"bad"}">${selected===q.answer?"Correct.":"Incorrect. Correct answer: "+q.answer.toUpperCase()}</div>`;
 document.getElementById("exam").innerHTML=`<div class="card"><div class="num">Question ${q.num} of ${QUESTIONS.length}</div><div class="question">${escapeHtml(q.text)}</div>${opts}${fb}</div><div class="nav"><button class="secondary" onclick="prev()" ${state.i===0?"disabled":""}>← Previous</button><button onclick="next()">${state.i===QUESTIONS.length-1?"Finish / Score":"Next →"}</button></div>`;
 buildJump();
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
render();
</script>
</body>
</html>
