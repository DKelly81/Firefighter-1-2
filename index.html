pes to a vehicle"},"answer":"B"},{"num":266,"text":"Breaching an interior wall","options":{"a":"must be done with power or hydraulic tools.","b":"may give you access to a safe haven or room from which you can safely exit.","c":"is the preferred method for escaping to a safe haven.","d":"is much harder than breaching an exterior wall."},"answer":"B"},{"num":267,"text":"What is one duty performed by a fire investigator at a fire scene?","options":{"a":"Interview firefighters at the scene","b":"Extinguish hot spots found during the investigation","c":"Perform overhaul after the investigation","d":"Give personal opinions about fire cause"},"answer":"A"},{"num":268,"text":"In the case of a preflashover, ventilation-limited fire:","options":{"a":"firefighters should attempt to gain entry before water application","b":"a door or window should be opened near the fire and water applied from the exterior","c":"no new openings should be made","d":"water application should be made through fuel-rich smoke or flames"},"answer":"B"},{"num":269,"text":"The discharge outlets on hydrants are","options":{"a":"Storz couplings.","b":"quarter-turn couplings.","c":"female threaded.","d":"male threaded."},"answer":"D"},{"num":270,"text":"Which is a ladder placement guideline","options":{"a":"Place a ladder at an angle of 60 degrees or greater.","b":"Avoid placing ladders where they may come in contact with overhead obstructions.","c":"Place ladders in front of doors.","d":"Position ladders in front of doors or other paths of travel firefighters or evacuees will need to use."},"answer":"B"},{"num":271,"text":"Windowless buildings usually require ____ ventilation for the removal of smoke.","options":{"a":"mechanical","b":"vertical","c":"natural","d":"hydraulic"},"answer":"A"},{"num":272,"text":"Buildings that are old and/or abandoned","options":{"a":"pose an even greater risk of fire and collapse than new structures","b":"can easily be maintained during a fire since there are less fuel sources","c":"pose less risk of fire or collapse than new structures","d":"are usually permitted to collapse or burn if they are not occupied"},"answer":"A"},{"num":273,"text":"When attempting to gain access to property that is protected by an electrified fence","options":{"a":"use cutting tools with insulated handles to prevent electric shock.","b":"hand tools should be used to cut the fence instead of power tools, whenever possible.","c":"deenergize the fence before attempting to cut.","d":"it is safer to go over the fence with a wooden ladder rather than through it."},"answer":"C"},{"num":274,"text":"Which type of apparatus has ladders mounted vertically on the left or right side of the apparatus bed or horizontally in racks within the bed","options":{"a":"Aircraft rescue and fire fighting apparatus","b":"Specialized apparatus","c":"Aerial and quint apparatus","d":"Mobile water supply apparatus"},"answer":"C"},{"num":275,"text":"Which type of raise is normally used for a four-firefighter raise","options":{"a":"Low-shoulder raise","b":"Flat raise","c":"Rung raise","d":"Beam raise"},"answer":"B"},{"num":276,"text":"Ventilating basement fires must be coordinated with fire attack because they are likely to be:","options":{"a":"inaccessible.","b":"ventilation limited.","c":"in flashover conditions.","d":"fuel limited."},"answer":"B"},{"num":277,"text":"Which type of salvage equipment is constructed of nonflammable material and may be used as a water basin for immersing small burning or smoldering objects","options":{"a":"Carryalls","b":"Salvage covers","c":"Dewatering devices","d":"Catchalls"},"answer":"A"},{"num":278,"text":"Which through-the-lock forcible entry tool is designed for use on doors equipped with panic hardware","options":{"a":"A-tool","b":"K-tool","c":"J-tool","d":"Shove knife"},"answer":"C"},{"num":279,"text":"The officer responsible for all operations within a fire department is the","options":{"a":"district/battalion chief.","b":"fire chief.","c":"company officer.","d":"fire captain."},"answer":"B"},{"num":280,"text":"Lumps on a braid-on-braid rope indicate","options":{"a":"rot and mildew.","b":"damage to the sheath.","c":"the rope has been overloaded.","d":"damage to the core."},"answer":"D"},{"num":281,"text":"When rooms extend from a center hallway during a search","options":{"a":"both sides should be searched.","b":"the doors of any rooms on the opposite side should be opened.","c":"the doors of any rooms on that side should be opened.","d":"the side closest to the fire should be searched."},"answer":"A"},{"num":282,"text":"Ventilation without coordination can lead to:","options":{"a":"flashover.","b":"reduced temperature levels.","c":"increased oxygen concentration.","d":"fuel-limited conditions."},"answer":"A"},{"num":283,"text":"Which type of hydrant is installed in or near static water sources to allow apparatus to draft from the source","options":{"a":"Wet-barrel hydrants","b":"Dry hydrants (Nonpressurized)","c":"Wet hydrants (Pressurized)","d":"Dry-barrel hydrants"},"answer":"D"},{"num":284,"text":"All personnel operating in an immediately dangerous to life and health (IDLH) atmosphere or hazardous area must be","options":{"a":"fully equipped with PPE, including SCBA.","b":"have at least hazmat operations level certification.","c":"trained to a Firefighter II level, at minimum.","d":"under the supervision of law enforcement."},"answer":"A"},{"num":285,"text":"Which vehicle extrication situation may require a rescuer to cut an opening in the roof and flap it down to access victims?","options":{"a":"A vehicle is upright and the wheels are chocked","b":"A vehicle has rear end damage","c":"A vehicle is on its side","d":"A vehicle has front end damage"},"answer":"C"},{"num":286,"text":"Ambulance service is provided as a function of the fire department in _____ EMS.","options":{"a":"fire service-based","b":"community-based","c":"hospital-based","d":"third-service"},"answer":"A"},{"num":287,"text":"In order to help ensure a rope maintains its condition and reaches its life expectancy, the rope should","options":{"a":"not be stored at fire department facilities.","b":"be kept in a heated area.","c":"be removed from its reel before it is stored.","d":"be placed in a storage bag."},"answer":"D"},{"num":288,"text":"When using the over-the-head or coat methods for donning SCBA, the SCBA must be","options":{"a":"positioned on the ground in front of the firefighter.","b":"donned with the help of another firefighter.","c":"mounted on an internal or external compartment mount.","d":"mounted from a telescoping frame that extends outward."},"answer":"A"},{"num":289,"text":"At a machinery rescue incident, rescuers should:","options":{"a":"leave the machine running until an expert arrives","b":"shut off the machine's power immediately","c":"stabilize the machine and then shut off its power","d":"attempt to remove victims first"},"answer":"C"},{"num":290,"text":"A fog pattern that is _____ will make the nozzle easier to handle","options":{"a":"straight","b":"broken","c":"narrow","d":"Wide"},"answer":"D"},{"num":291,"text":"A common method for forcing inward-swinging and outward-swinging doors is","options":{"a":"cutting around the hinges of the doors.","b":"breaking the lock with a cutting or striking tool.","c":"removing the hinges from the door.","d":"prying with a Halligan tool."},"answer":"D"},{"num":292,"text":"Where is the emergency shutoff on a high-pressure cargo tank truck?","options":{"a":"Driver compartment","b":"Left-front corner behind the driver compartment","c":"Guard cage around bottom loading piping","d":"Right-front corner behind passenger seat"},"answer":"B"},{"num":293,"text":"Whenever pivoting a ladder against a building,","options":{"a":"pivot the ladder after it has been extended.","b":"pivot the ladder on the beam closest to the structure.","c":"lower the tip to the ground and raise the ladder again.","d":"slide the top of the ladder sideways and pick up the butt to move it into position."},"answer":"B"},{"num":294,"text":"To perform hydraulic ventilation, firefighters will need to:","options":{"a":"operate the nozzle outside of the contaminated atmosphere.","b":"be as close to the exhaust opening as possible.","c":"use a spray stream from a fog nozzle.","d":"use a spray stream from a broken stream nozzle."},"answer":"C"},{"num":295,"text":"The use of seat belts or mitigation of hazardous spills are examples of","options":{"a":"organizational norms.","b":"Standards of Conduct.","c":"procedures.","d":"Policies."},"answer":"C"},{"num":296,"text":"Tying in a ladder means to tie the ladder","options":{"a":"to a spotter on the ground.","b":"to a fixed object.","c":"halyard with a clove hitch and an overhand safety.","d":"onto those ascending/descending the ladder."},"answer":"B"},{"num":297,"text":"The purpose of a combustible gas indicator (CGI) is to","options":{"a":"measure flammable vapors and gases.","b":"measure UEL percentage.","c":"detect toxic particulates.","d":"detect oxygen levels."},"answer":"A"},{"num":298,"text":"What is the first step if there is a fire in the trunk or engine compartment of a car?","options":{"a":"Use a piercing nozzle","b":"Cut out the compartment lid","c":"Try to open the compartment using the release lever or button","d":"Use hydraulic tools"},"answer":"C"},{"num":299,"text":"Soft sleeve hose is designed to","options":{"a":"connect the pumper intake to a pressurized water source.","b":"draft water from static water supplies.","c":"perform fire attack operations.","d":"connect directly to a fire hydrant"},"answer":"A"},{"num":300,"text":"Which is a characteristic of a roof ladder","options":{"a":"A roof ladder is equipped with folding hooks.","b":"A roof ladder is hinged so that it can be folded.","c":"A roof ladder has a fly section for extension.","d":"A roof ladder is equipped with a halyard."},"answer":"A"},{"num":301,"text":"One limitation of thermal imagers is that they cannot:","options":{"a":"locate the seat of the fire or hidden fires.","b":"provide information about interior conditions during search and rescue.","c":"detect a fire in the next lower floor through a carpeted floor.","d":"“see” through synthetic materials and furnishings."},"answer":"C"},{"num":302,"text":"For use in the fire service, a knot must","options":{"a":"be supported by an overhand safety knot or hitch.","b":"bear the weight on the standing part of the rope.","c":"create a tight bend in the rope.","d":"be easy to tie and untie."},"answer":"D"},{"num":303,"text":"The triangle cut and kerf cut are examples of:","options":{"a":"ventilation holes.","b":"mechanical ventilation.","c":"inspection holes.","d":"trench ventilation."},"answer":"C"},{"num":304,"text":"Which type of stress accumulates over time and can take years to develop","options":{"a":"Occupational","b":"Chronic","c":"Posttraumatic","d":"Atypical"},"answer":"A"},{"num":305,"text":"What determines the available flow path in a structure fire","options":{"a":"Temperature and pressure differences","b":"Construction materials and occupancy types","c":"Thermal gas layers","d":"The floor plan and openings in the structure"},"answer":"D"},{"num":306,"text":"All PPE designed for structural and proximity fire fighting must meet the requirements of NFPA","options":{"a":"1977.","b":"1550.","c":"1970.","d":"1975."},"answer":"C"},{"num":307,"text":"How is wood with smaller dimensions or mass affected by fire conditions","options":{"a":"It is difficult to ignite and retains structural integrity after prolonged exposure to fire","b":"It is difficult to ignite, but will lose structural integrity faster","c":"It is easier to ignite and loses structural integrity faster","d":"It is easier to ignite, but retains structural integrity after prolonged exposure to fire"},"answer":"C"},{"num":308,"text":"Which item would likely be found in a fire command center?","options":{"a":"Fire alarm control panel","b":"Hydrant wrench","c":"Secondary power supply","d":"Standpipe systems"},"answer":"A"},{"num":309,"text":"What is an indicator that a hose should be removed from service?","options":{"a":"Air escaping from the hose during testing","b":"The hose twisting when pressurized","c":"The age of the hose","d":"A blister on the hose jacket"},"answer":"D"},{"num":310,"text":"Class B foams designed solely for hydrocarbons:","options":{"a":"work on polar solvents","b":"will not extinguish polar solvent fires","c":"work when mixed with water","d":"must be mixed at 6%"},"answer":"B"},{"num":311,"text":"What is the first priority at an incident scene?","options":{"a":"Incident stabilization","b":"Environmental consideration","c":"Property conservation","d":"Life safety"},"answer":"D"},{"num":312,"text":"The components of a structural fire fighting protective coat are designed to","options":{"a":"trap body sweat to cool the firefighter down during fire fighting operations.","b":"have the liner removed to keep the firefighter from getting too hot during fire fighting operations.","c":"have the shell removed to let the heat escape from the coat more quickly.","d":"absorb heat and trap insulating air that prevents heat transfer from the fire to the wearer's body."},"answer":"D"},{"num":313,"text":"Which type of window may be forced by breaking the glass and cutting the window screen in order to reach the crank that opens the window","options":{"a":"Jalousie","b":"Casement","c":"Pivoting","d":"Awning"},"answer":"B"},{"num":314,"text":"One common characteristic of NIMS-ICS is that it:","options":{"a":"must include a written IAP.","b":"is only used on large incidents.","c":"only applies to firefighters.","d":"uses common terminology."},"answer":"D"},{"num":315,"text":"Class A foam is used on:","options":{"a":"flammable liquids","b":"noncombustibles","c":"flammable gases","d":"ordinary combustibles"},"answer":"D"},{"num":316,"text":"When wearing high-visibility vests at a roadway incident, responders should","options":{"a":"only wear them at night when visibility is the lowest. C","b":"NOT be performing fire fighting or hazardous materials activities.","c":"NOT be wearing PPE.","d":"wear vests under PPE."},"answer":"B"},{"num":317,"text":"Why use pike poles or hay hooks on stacked or piled material fires?","options":{"a":"To spread the fire","b":"To allow fire streams to reach all burning material","c":"To let it burn faster","d":"To salvage material"},"answer":"B"},{"num":318,"text":"In a _____, decisions and information are directed from the top of the organizational structure down through intermediate levels to the base of the structure.","options":{"a":"linear structure","b":"scalar structure","c":"division of labor","d":"span of control"},"answer":"B"},{"num":319,"text":"What is a consideration when conducting a risk assessment?","options":{"a":"Always prioritize property conservation.","b":"Cost of the structure must be less than firefighting costs.","c":"Victim life always outweighs firefighter safety.","d":"Do not commit to interior operations in abandoned or derelict buildings."},"answer":"D"},{"num":320,"text":"In order to conduct a safer and faster primary search, firefighters should:","options":{"a":"always work in teams of two or more.","b":"stay low when searching.","c":"move through the search area with a charged hoseline.","d":"wait until after the fire is under control."},"answer":"A"},{"num":321,"text":"One firefighter may be assigned to operate a large hoseline","options":{"a":"when a master stream device is also available.","b":"if there are no hose straps or rope hose tools.","c":"when maneuvering of the nozzle is required.","d":"during exposure protection or overhaul operations."},"answer":"D"},{"num":322,"text":"What is one advantage of donning SCBA from a compartment mount","options":{"a":"SCBA does not need to be removed from the compartment.","b":"SCBA is protected from weather because it is inside a compartment.","c":"SCBA is mounted at waist height, allowing users to don it without removing it from the apparatus.","d":"SCBA is mounted on the exterior of an apparatus, allowing it to be donned quicker."},"answer":"B"},{"num":323,"text":"When operating a master stream device, firefighters must","options":{"a":"shut down the device before relocating it.","b":"aim the master stream at a downward angle.","c":"stay with the device at all times once it is deployed.","d":"use a 2 1/2-inch (65 mm) hoseline or smaller."},"answer":"A"},{"num":324,"text":"Which agency regulates all radio communication in the United States","options":{"a":"Occupational Safety and Health Administration (OSHA)","b":"Federal Communications Commission (FCC)","c":"Telecommunication Commission","d":"Federal Emergency Management Agency (FEMA)"},"answer":"B"},{"num":325,"text":"Life safety, incident stabilization, and property conservation are:","options":{"a":"strategic goals.","b":"defensive strategies.","c":"tactical objectives.","d":"offensive strategies."},"answer":"A"},{"num":326,"text":"Why should responders approach a vehicle fire at a 45-degree angle from the side of the vehicle?","options":{"a":"To avoid standing in the path of leaking fuels","b":"To avoid exploding hydraulic or pneumatic struts","c":"To have multiple sides of the vehicle in sight during the approach","d":"To be more visible to possible vehicle occupants"},"answer":"B"},{"num":327,"text":"The personal alert safety system (PASS) alarm activates when a firefighter is motionless for more than ____ seconds, or when a firefighter presses the emergency button","options":{"a":"45","b":"10","c":"30","d":"60"},"answer":"C"},{"num":328,"text":"Life safety rope is designed","options":{"a":"to cordon off areas and create a control zone perimeter.","b":"for rescue and other emergency operations only.","c":"to be used as utility rope, if needed.","d":"for securing unstable objects."},"answer":"B"},{"num":329,"text":"When using a shove knife to force entry, the tool is inserted","options":{"a":"into the collar of the lock and hit with a striking tool to break the lock.","b":"into the keyhole of the lock and twisted to break the lock.","c":"between the door and the doorframe just above the lowest door hinge.","d":"between the door and the doorframe near the lock mechanism."},"answer":"D"},{"num":330,"text":"Most fire doors will be constructed of ____ and may roll, slide, or swing into place when released","options":{"a":"wood","b":"fiberglass","c":"metal","d":"tempered glass"},"answer":"C"},{"num":331,"text":"In order to create a mechanical advantage during hoisting operations, use a","options":{"a":"tag line.","b":"pulley.","c":"Halligan tool.","d":"pike pole."},"answer":"B"},{"num":332,"text":"Which extinguishing agent is very effective on stacked and piled materials fires?","options":{"a":"Dry powder","b":"Dry chemical","c":"Carbon dioxide","d":"Class A foam"},"answer":"D"},{"num":333,"text":"Which type of extinguishing agent is nonconductive and can also cool and smother fuels in Class A and B fires?","options":{"a":"Carbon dioxide","b":"Dry powder","c":"Clean agent","d":"Wet chemical"},"answer":"C"},{"num":334,"text":"Stucco walls may be difficult to breach because they","options":{"a":"are typically interior walls that are hard to access.","b":"weaken the structure and make it more susceptible to collapse.","c":"hide what materials are behind them.","d":"tend to contain more building utility components."},"answer":"C"},{"num":335,"text":"Forcing entry through an overhead door involves","options":{"a":"using a striking tool to break through the door.","b":"using a rotary saw to cut a hole in the door.","c":"inserting a prying tool between the edge of the door and the ground.","d":"forcing the lock with a through-the-lock forcible entry tool or other forcible entry tool."},"answer":"B"},{"num":336,"text":"The type of building construction used in a structure is regulated by","options":{"a":"local building codes.","b":"federal building codes.","c":"the fire department.","d":"the National Fire Protection Association (NFPA)."},"answer":"A"},{"num":337,"text":"The National Incident Management System (NIMS) was created so that","options":{"a":"each member of an emergency service organization could be held accountable for their actions on scene.","b":"each emergency services organization would establish its own terminology and command structures.","c":"all emergency services organizations use common terminology and command structures.","d":"fire service organizations could have priority over other agencies/organizations on scene."},"answer":"C"},{"num":338,"text":"When using PPV to ventilate a multistory building, it is best to apply positive pressure at the:","options":{"a":"entry point.","b":"highest point, if possible.","c":"lowest point, ground level.","d":"exit point(s)."},"answer":"C"},{"num":339,"text":"The primary advantage of a forward lay is that","options":{"a":"it most directly supplements hydrant pressure and establishes drafting operations.","b":"a pumper can remain at the hydrant so its equipment is readily available.","c":"a pumper can remain at the incident scene so its equipment is readily available.","d":"the driver/operator can perform the hose lay without any outside assistance."},"answer":"C"},{"num":340,"text":"Letting a fire burn may be best when:","options":{"a":"vapors travel toward havens","b":"combustion products are more hazardous","c":"rescue is complete and evacuation done","d":"combustion products are less hazardous"},"answer":"D"},{"num":341,"text":"Which statement about foam application is true?","options":{"a":"Application should be continuous","b":"Apply intermittently","c":"Oxygen degradation equals eco-friendliness","d":"Drain foam into water sources"},"answer":"A"},{"num":342,"text":"When advancing a hoseline up a stairway,","options":{"a":"the hoseline must not be charged.","b":"excess hose should be deployed on the stairs below the fire floor once the hoseline has reached the fire floor.","c":"the hose should be laid against the outside wall to keep the stairs as clear as possible.","d":"excess hose should be stretched outside the stairway."},"answer":"C"},{"num":343,"text":"Force fixed windows","options":{"a":"by separating the frame from the wall.","b":"as a last resort.","c":"by prying the lock.","d":"with the same methods as double-hung windows."},"answer":"B"},{"num":344,"text":"Broken or punctured fuel tanks may be:","options":{"a":"sealed with a fuel-resistant sealing compound","b":"blanketed with firefighting foam","c":"allowed to leak if contained","d":"carefully drained"},"answer":"A"},{"num":345,"text":"Which is a recommendation for preventing or limiting chemical and carcinogen exposures","options":{"a":"Disposing of contaminated gear instead of laundering for reuse.","b":"Waiting to doff contaminated gear at the station.","c":"Remaining upwind of fires and smoke plumes.","d":"Sealing contaminated gear in an air-tight container until it's ready for reuse."},"answer":"C"},{"num":346,"text":"Which type of radio system is found in fixed locations such as fire stations or telecommunications centers","options":{"a":"Portable radio","b":"Dispatch radio","c":"Mobile radio","d":"Base station radio"},"answer":"D"},{"num":347,"text":"One of the first priorities at a fire in a protected structure is to:","options":{"a":"turn off automatic sprinklers until fire suppression is complete","b":"connect a pumping apparatus to the fire department connection (FDC)","c":"close the main sprinkler control valve","d":"advance the attack hose to the fire floor"},"answer":"B"},{"num":348,"text":"Shutting a sprinkler system’s control valve should be done:","options":{"a":"before fire control","b":"only as a last resort","c":"by the owner","d":"once the fire is under control"},"answer":"D"},{"num":349,"text":"Foam expansion depends on the:","options":{"a":"solution temperature","b":"foam concentrate type","c":"application technique","d":"nozzle type"},"answer":"B"},{"num":350,"text":"The advanced cleaning method may be necessary for cleaning PPE when","options":{"a":"a gentle spray of water is needed to rinse off debris and other contaminants.","b":"the PPE needs to be cleaned for immediate reuse.","c":"a washing machine is needed to remove soiling and contamination from products of combustion.","d":"hazardous materials or contaminants cannot be removed by preliminary exposure reduction or specialized cleaning."},"answer":"C"},{"num":351,"text":"What happens to steel structural members when they are heated by fire","options":{"a":"They crack, causing rapid structural collapse","b":"They lengthen, pushing the walls of a structure out","c":"They melt, causing the surrounding walls to fail","d":"They shorten, pulling the walls of a structure in"},"answer":"B"},{"num":352,"text":"When using water for fire suppression, every gallon (liter) used adds approximately _____ of weight to weakened floors","options":{"a":"2 pounds (1 kilogram)","b":"10 pounds (5 kilograms)","c":"5 pounds (2.5 kilograms)","d":"8 pounds (4 kilograms)"},"answer":"D"},{"num":353,"text":"Secondary searches are conducted","options":{"a":"once victims are located.","b":"after size-up.","c":"after fire control.","d":"during primary search."},"answer":"C"},{"num":354,"text":"The purpose of a bump test is to","options":{"a":"test oxygen levels.","b":"calibrate a gas detector before use.","c":"reset default settings.","d":"recalibrate on scene."},"answer":"B"},{"num":355,"text":"What can cause the protection of a fire wall to be lessened","options":{"a":"Contractors or owners sealing any wall penetrations with caulking material","b":"Using it to separate two adjoining structures rather than two portions inside a single structure","c":"Unprotected penetrations for pipes, wires, and ducts","d":"Weather and other environmental conditions"},"answer":"C"},{"num":356,"text":"What is an indicator of structural instability or collapse","options":{"a":"Visible bricks, blocks, or stones","b":"Very little movement in the roof, walls, or floors","c":"Spongy roof or floor","d":"Lots of water runoff from the structure's interior"},"answer":"C"},{"num":357,"text":"When responding to fires in underground and confined spaces,","options":{"a":"only specially trained technical rescue units should enter those spaces.","b":"firefighters should not attempt to keep the fire contained.","c":"regular attack crews should only enter when a RIT is available.","d":"the most common hazard is hazardous materials exposure."},"answer":"A"},{"num":358,"text":"What is one guideline for ensuring a rope remains in good condition","options":{"a":"Store rope in tight spaces.","b":"Reverse the ends of the rope in rope bag periodically.","c":"Periodically walk on the rope to extend its elasticity.","d":"Do not whip or tape cut the ends of rope."},"answer":"B"},{"num":359,"text":"If there are potentially hazardous spills of hydraulic and battery fluids at a vehicle accident, firefighters should","options":{"a":"cover these spills with approved absorption materials.","b":"wash them away with a light water spray.","c":"preserve the spills as potential evidence.","d":"let law enforcement handle the spill."},"answer":"A"},{"num":360,"text":"Each employee in a fire department reporting to one supervisor is an example of","options":{"a":"unity of command.","b":"division of labor.","c":"chain of command.","d":"span of control."},"answer":"A"},{"num":361,"text":"Which type of nozzle operates at a low nozzle pressure and can be used to apply compressed-air foam","options":{"a":"Broken stream","b":"Spray","c":"Fog","d":"Smooth bore"},"answer":"D"},{"num":362,"text":"What are the three elements of the fire triangle","options":{"a":"Fuel, carbon, and heat","b":"Incipient, fully-developed, and decay","c":"Fuel, oxygen, and heat","d":"Incipient, growth, and decay"},"answer":"C"},{"num":363,"text":"What causes backdraft in a ventilation-limited compartment fire","options":{"a":"A high neutral plane","b":"An increase in ventilation","c":"An increase in fuel","d":"A decrease in temperature"},"answer":"B"},{"num":364,"text":"Both load-bearing and nonload-bearing interior walls","options":{"a":"may contain electrical wires, water or gas pipes, or heating and cooling ducts.","b":"are more difficult to breach than exterior walls.","c":"should be breached with power tools and saws.","d":"will increase fire spread during a structure fire."},"answer":"A"},{"num":365,"text":"During VEIS, the searching firefighter's first priority is to","options":{"a":"assess survivability.","b":"ventilate.","c":"locate and close the door.","d":"locate occupants."},"answer":"C"},{"num":366,"text":"Why is it important to identify roof modifications during preincident surveys and the initial size-up","options":{"a":"To determine if the roof modifications are accurately designed to code","b":"In case firefighters need to force entry through the roof","c":"For liability purposes in case the roof collapses","d":"In case the structure needs to be ventilated"},"answer":"D"},{"num":367,"text":"What is one way that braided rope differs from laid rope","options":{"a":"Braided rope is more vulnerable to direct abrasion and damage than laid rope.","b":"Braided rope is less likely to twist during use than laid rope.","c":"Braided rope is commonly used as utility rope, while laid rope is used for life safety applications.","d":"Most braided ropes are made of natural fibers, while laid rope is made of synthetic fibers."},"answer":"B"},{"num":368,"text":"Withdrawal may be the safest tactical option when:","options":{"a":"there is potential for a BLEVE","b":"hidden ignition sources exist","c":"combustion products are more hazardous","d":"vapors are traveling"},"answer":"A"},{"num":369,"text":"When should personnel inspect thermal imagers?","options":{"a":"After purchasing and before replacing","b":"After each use","c":"Once a month","d":"Once a week"},"answer":"B"},{"num":370,"text":"When sheltering in place, firefighters should","options":{"a":"leave the door open to signal others.","b":"avoid drawing attention to themselves.","c":"remain in the fire compartment.","d":"get to an uninvolved, nearby room if possible."},"answer":"D"},{"num":371,"text":"Which tool stabilizes vehicles on their sides or roofs?","options":{"a":"Bar screw jacks","b":"Tensioned buttress system","c":"Cribbing","d":"Wheel chock"},"answer":"B"},{"num":372,"text":"Which type of webbing do firefighters prefer for rescue work","options":{"a":"Spiral weave tubular","b":"Natural fiber flat","c":"Synthetic flat","d":"Edge-stitch tubular"},"answer":"A"},{"num":373,"text":"All portable fire extinguishers must be labeled with:","options":{"a":"both letter and numerical rating systems.","b":"appropriate letters and/or symbols that identify their class ratings.","c":"the level of training required for operating the extinguisher.","d":"the weight and pressure when the extinguisher is full."},"answer":"B"},{"num":374,"text":"One safety guideline for using forcible entry tools includes","options":{"a":"carefully striking the handle of a prying tool if the tool is not large enough to force entry.","b":"positioning yourself with your dominant foot slightly in front of your other foot.","c":"using a cheater bar to protect the handle of a tool during forcible entry.","d":"ensuring you have adequate space to operate the tool properly."},"answer":"D"},{"num":375,"text":"When might a clove hitch be tied in a rope","options":{"a":"To join two pieces of webbing","b":"Life safety applications","c":"When attaching a rope to an object","d":"When it will be subjected to repeated loading and unloading"},"answer":"C"},{"num":376,"text":"What situation may require the use of a hydrant valve","options":{"a":"When a reverse lay is made from a low-pressure hydrant to the fire scene","b":"When a forward lay is made from a low-pressure hydrant to the fire scene","c":"When a reverse lay is made from a high-pressure hydrant to the fire scene","d":"When a forward lay is made from a high-pressure hydrant to the fire scene"},"answer":"B"},{"num":377,"text":"Which type of information is typically included on a postincident report?","options":{"a":"Legal action to be taken","b":"Names of personnel that responded","c":"Names and addresses of occupant and/or owner","d":"Property owner insurance coverage"},"answer":"C"},{"num":378,"text":"How should hard rubber booster, hard intake hose, and rubber-jacket collapsible hose be washed?","options":{"a":"Rinsing with clean water and a mild soap, if necessary","b":"Washing with a mild soap or detergent, using scrub brushes or straw brooms","c":"Brushing or sweeping thoroughly","d":"Soaking in warm water and a mild soap or detergent"},"answer":"A"},{"num":379,"text":"Which type of door may be found in residential occupancies, in places of assembly to divide larger conference areas into smaller rooms, and as a horizontal fire door?","options":{"a":"Glass","b":"Swinging","c":"Folding","d":"Revolving"},"answer":"C"},{"num":380,"text":"Which telecommunications system for receiving emergency calls uses a central location that routes emergency calls to the appropriate dispatcher","options":{"a":"Enhanced 9-1-1 (E-9-1-1)","b":"Public Safety Answering Point (PSAP)","c":"Mobile Data Terminal (MDT)","d":"Emergency Services Specific Telecommunications Center"},"answer":"B"},{"num":381,"text":"Which type of shock occurs when the body is unable to supply blood to tissue due to blood loss?","options":{"a":"Hypovolemic","b":"Cardiogenic","c":"Neurogenic","d":"Anaphylactic"},"answer":"A"},{"num":382,"text":"How is negative pressure used to ventilate a structure?","options":{"a":"High-volume fans are used to increase the pressure to a level higher than the pressure of the exterior of the structure.","b":"Artificial air flow and a fog stream are combined to push smoke from the structure.","c":"Artificial air flow is used to pull smoke from the structure or to enhance natural ventilation.","d":"High-volume fans are used to create a slightly higher pressure in adjacent compartments to pull smoke to the exterior of the structure."},"answer":"C"},{"num":383,"text":"Class K fires involve:","options":{"a":"ordinary combustibles.","b":"combustible metals and alloys.","c":"energized electrical equipment.","d":"combustible cooking oils."},"answer":"D"},{"num":384,"text":"Crown or canopy fires are wind-driven, high-intensity fires that:","options":{"a":"can occur anywhere","b":"consume low-lying vegetation","c":"move through the tree tops of heavily forested areas","d":"can go undetected for months"},"answer":"C"},{"num":385,"text":"An effective foam blanket produces uniform bubbles through:","options":{"a":"separating","b":"expansion","c":"proportioning","d":"aeration"},"answer":"D"},{"num":386,"text":"Where should tempered glass be struck to break it easily?","options":{"a":"Middle","b":"Lower corner","c":"Upper corner","d":"Outer edges"},"answer":"B"},{"num":387,"text":"Which SCBA component allows two firefighters to share air from one cylinder without removing their facepieces","options":{"a":"Integrated PASS control module","b":"Rapid intervention crew universal air coupling (RIC UAC)","c":"Regulator assembly","d":"Emergency escape breathing support system (EEBSS)"},"answer":"D"},{"num":388,"text":"What precaution should firefighters take at a vehicle incident involving conventional and alternative vehicle fuels?","options":{"a":"Leaking fuel must be cleaned up before extrication begins","b":"Fire protection must be established to prevent the ignition of fuel vapors","c":"Fuel leaks must be identified and plugged as part of scene control","d":"A master stream device must be placed near the vehicle"},"answer":"B"},{"num":389,"text":"Which type of preconnected load deploys from the shoulder as a firefighter advances toward the fire","options":{"a":"Preconnected flat load","b":"Minuteman load","c":"Triple layer load","d":"Booster hose reel"},"answer":"B"},{"num":390,"text":"Through-the-lock forcible entry methods require the lock cylinder to be removed from the door and then a _____ tool to open the lock","options":{"a":"striking","b":"cutting","c":"prying","d":"key"},"answer":"D"},{"num":391,"text":"Dry-pipe sprinkler systems are used where:","options":{"a":"water damage must be prevented","b":"large volumes are needed quickly","c":"temperatures may drop below 40°F (4°C)","d":"high-hazard occupancies exist"},"answer":"C"},{"num":392,"text":"A stored-pressure _____ extinguisher is suitable for use on Class C fires.","options":{"a":"water","b":"dry chemical","c":"wet chemical","d":"water-mist"},"answer":"D"},{"num":393,"text":"Once a fire has been brought under control, sprinkler water flow should be stopped to:","options":{"a":"minimize water damage to the structure and its contents","b":"reduce costs","c":"reduce system wear","d":"prevent overload"},"answer":"A"},{"num":394,"text":"When an unconscious victim is being assisted down a ladder, the victim's feet should be","options":{"a":"grasped by one of the firefighters.","b":"outside the rails.","c":"tied together.","d":"on the beams."},"answer":"B"},{"num":395,"text":"Exchanging SCBA breathing air cylinders:","options":{"a":"must be done by two firefighters.","b":"may be required if the cylinder contains less than 90 percent of its capacity during inspection.","c":"always requires firefighters to doff SCBA before exchanging the cylinders.","d":"must be done by specially trained factory-qualified technicians."},"answer":"B"},{"num":396,"text":"When all available oxygen is consumed and not replenished, the heat release rate","options":{"a":"becomes stagnant","b":"becomes extremely variable","c":"increases","d":"decreases"},"answer":"D"},{"num":397,"text":"If fire is encountered during a search","options":{"a":"mark the door.","b":"leave door open.","c":"attack fire.","d":"close door and report."},"answer":"D"},{"num":398,"text":"Which type of extinguishing agents may be commonly used to fight fires in highly sensitive computer equipment?","options":{"a":"Water and water-based agents","b":"Clean agent or carbon dioxide","c":"Dry chemical or dry powder","d":"Wet chemical or foam"},"answer":"B"},{"num":399,"text":"What is an advantage of a trench cut?","options":{"a":"It can be used to establish a defensive position in the attic space for fire attack.","b":"It impacts structural stability less than other vertical ventilation methods.","c":"It is quicker than the other vertical ventilation methods.","d":"It allows firefighters to ventilate the structure without having to perform other vertical ventilation methods."},"answer":"A"},{"num":400,"text":"The primary difference between a Firefighter I and a Firefighter II is a","options":{"a":"Firefighter I works under the direct supervision of a Firefighter II or company officer.","b":"Firefighter II has more years of experience.","c":"Firefighter I cannot train to other fire service specialties until he or she is a Firefighter II.","d":"Firefighter II has hazardous materials training."},"answer":"A"},{"num":401,"text":"Block creel construction is the only construction method suitable for","options":{"a":"webbing.","b":"life safety rope.","c":"synthetic fiber rope.","d":"utility rope."},"answer":"B"},{"num":402,"text":"Firefighters usually perform air monitoring to determine","options":{"a":"how long they can be in the atmosphere before they need SCBA.","b":"how many responders can enter the atmosphere at one time.","c":"whether an atmosphere at an incident is safe.","d":"if a safe haven will require evacuation."},"answer":"C"},{"num":403,"text":"What is the first step of the PASS application method?","options":{"a":"Point the nozzle at the base of the fire.","b":"Pull the handles together to release a short burst to test the extinguisher.","c":"Pick up the extinguisher by its handles and carry it to the point of application.","d":"Pull and twist the pin to break the thin wire or plastic seal."},"answer":"D"},{"num":404,"text":"Fixed-temperature heat detectors activate when:","options":{"a":"combustion gases are present","b":"temperature rises rapidly","c":"rated temperature is reached","d":"flames are detected"},"answer":"C"},{"num":405,"text":"In order to have both hands free while standing on a ground ladder, firefighters can use either a ladder belt or _____ to safely secure themselves to the ladder","options":{"a":"halyard cable","b":"leg lock","c":"utility rope","d":"Webbing"},"answer":"B"},{"num":406,"text":"Which hydrant connection tool is primarily used to remove discharge caps from fire hydrant outlets and open fire hydrant valves","options":{"a":"Spanner wrench","b":"Hydrant valve","c":"Gate valve","d":"Hydrant wrench"},"answer":"D"},{"num":407,"text":"In order to maintain control of a door during forcible entry","options":{"a":"do not drag a hoseline through the door opening.","b":"open the door fully.","c":"break window or door glass instead of forcing the door.","d":"station a firefighter at the door."},"answer":"D"},{"num":408,"text":"Most emergency incident operations will be managed with a(an) _____ along with a tactical worksheet.","options":{"a":"written incident action plan (IAP)","b":"verbal incident action plan (IAP)","c":"incident briefing","d":"staff-level briefing"},"answer":"B"},{"num":409,"text":"Why should personnel search behind doors and on the floor below windows","options":{"a":"Occupants are most likely to shelter in these places.","b":"Visibility and air quality are best in these places.","c":"Smoke may overcome occupants while they are trying to escape.","d":"These areas are not searched during primary searches."},"answer":"C"},{"num":410,"text":"When using rope or webbing to stabilize an object, responders should ensure","options":{"a":"attachment points at both ends will easily pull free, if necessary.","b":"personnel are stationed in the stabilizing area in case the rope or webbing snaps.","c":"rope or webbing and anchor point are strong enough to hold the weight of the object.","d":"only life safety rope is tied to the stationary object so it does not snap."},"answer":"C"},{"num":411,"text":"Firefighters that experience atypical stressful events (ASE)","options":{"a":"may experience a posttraumatic stress injury.","b":"are usually able to cope with ASE since it is not long term.","c":"are better at building resilience.","d":"should use the Critical Incident Stress Management (CISM) method."},"answer":"A"},{"num":412,"text":"One way to locate an exit when escaping","options":{"a":"crawl along wall to door.","b":"stand and reach up.","c":"crawl along wall to window.","d":"follow smoke."},"answer":"C"},{"num":413,"text":"In which situation would the IC likely communicate the need for a transition from a defensive strategy to an offensive strategy?","options":{"a":"Conditions deteriorate rapidly.","b":"There are not enough personnel on scene when starting out.","c":"An emergency evacuation is necessary.","d":"Fire streams cannot be used."},"answer":"B"},{"num":414,"text":"A tag line used for hoisting operations","options":{"a":"is meant to be the load-bearing part of the rope.","b":"must be a separate line that is tied to the equipment.","c":"must be the same line as the hoisting line.","d":"can prevent tools from spinning or snagging."},"answer":"D"},{"num":415,"text":"How does Type II construction compare to Type I construction","options":{"a":"Type II construction consists of mostly combustible materials, while Type I construction consists of noncombustible materials.","b":"Type II construction has a lower fire-resistance rating than Type I construction.","c":"Type II construction materials will add to the fuel load, unlike Type I construction materials.","d":"Type II construction does not fail as quickly as Type I construction."},"answer":"B"},{"num":416,"text":"Personnel at the first aid provider level should be trained to perform:","options":{"a":"basic life support to ill or injured patients","b":"advanced skills, such as intubation","c":"CPR, CCR, and AED operations","d":"patient transport to the hospital"},"answer":"C"},{"num":417,"text":"Which NFPA standard establishes incident code reporting?","options":{"a":"NFPA 901","b":"NFPA 1010","c":"NFPA 1072","d":"NFPA 101"},"answer":"A"},{"num":418,"text":"Firefighters should have a knowledge of building construction and occupancy types when fighting structural fires in order to","options":{"a":"distinguish between low-value and high-value properties","b":"prioritize resources to use at an incident","c":"determine approximate costs of an incident","d":"determine the fuel load of a structure"},"answer":"D"},{"num":419,"text":"Responders using air monitoring devices must","options":{"a":"be hazmat certified.","b":"operate under hazmat tech.","c":"use one device only.","d":"use multiple sampling methods."},"answer":"D"},{"num":420,"text":"While HVAC systems can be used as smoke evacuation systems, they can also","options":{"a":"cause a structure fire to enter flashover","b":"affect tactical ventilation operations during a structural fire","c":"cause complete failure of a structure if the floors are weakened","d":"contribute to the fuel load of a structural fire"},"answer":"B"},{"num":421,"text":"Which is a characteristic of braid-on-braid rope","options":{"a":"It has a braided core that runs the length of the rope.","b":"It has a sheath.","c":"It is not jacketed.","d":"It resists abrasion much better than other types of rope."},"answer":"A"},{"num":422,"text":"What situation may require the use of a reverse hose lay","options":{"a":"A hydrant connection cannot be made for fireground operations","b":"A pump operator must leave the pumper to perform other fireground activities","c":"A pumper arrives at a fire and must work alone for an extended period of time","d":"A pumper must go to the water source before laying a supply line"},"answer":"C"},{"num":423,"text":"Which method of controlling external bleeding includes twisting or winding a rod until bleeding stops?","options":{"a":"Direct pressure","b":"Applying a tourniquet","c":"Dressing a wound","d":"Indirect pressure"},"answer":"B"},{"num":424,"text":"If a patient is responsive, the assessment involves an evaluation of the patient’s:","options":{"a":"airway, breathing, and circulation","b":"breathing, circulation, then airway","c":"breathing, airway, and circulation","d":"circulation, airway, then breathing"},"answer":"A"},{"num":425,"text":"The key-in-knob lock is a type of _____ lock that has a keyway on the outside of the doorknob and a keyway or button on the inside of the knob","options":{"a":"cylindrical","b":"rim","c":"high-security","d":"mortise"},"answer":"A"},{"num":426,"text":"If attempting fire control from a structure’s exterior, which type of fire stream would work best?","options":{"a":"Wide fog pattern from a fog nozzle","b":"Broken stream from a fog nozzle","c":"Solid stream from a smooth bore nozzle","d":"Piercing stream from a smooth bore nozzle"},"answer":"C"},{"num":427,"text":"Which type of cutting tool may be used to remove rings from swollen fingers?","options":{"a":"Whizzer saw","b":"Air chisel","c":"Circular saw","d":"Rotary saw"},"answer":"A"},{"num":428,"text":"Which (NIMS-ICS) organizational level has responsibility for a specified functional assignment without regard for a geographical area","options":{"a":"Branch","b":"Division","c":"Unit","d":"Group"},"answer":"D"},{"num":429,"text":"What is a benefit of controlled breathing methods during nonemergency exits","options":{"a":"Eliminates the need for SCBA air cylinders","b":"Extends the life of the breathing air cylinder","c":"Allows personnel to share SCBA breathing systems","d":"Increases air consumption during the time required to exit"},"answer":"B"},{"num":430,"text":"The fire service mission is to save lives and","options":{"a":"extinguish fires by any means possible or methods available.","b":"establish and transfer Incident Command at emergency incidents.","c":"aid other organizations in responding to emergency incidents.","d":"protect property and the environment from fires and other hazardous situations."},"answer":"D"},{"num":431,"text":"Insurance investigators typically:","options":{"a":"begin after extinguishment","b":"cannot be on scene alone","c":"cannot interview firefighters","d":"never work independently"},"answer":"A"},{"num":432,"text":"Which statement is true of post indicator valves (PIVs)?","options":{"a":"Open when tang is in line","b":"No markings","c":"Closed when tang is in line","d":"Use signs or markings to indicate valve position"},"answer":"D"},{"num":433,"text":"A disadvantage of fog nozzles for foam application is that they:","options":{"a":"do not allow adjustable gallonage","b":"have less reach","c":"may create the appearance of better flow than actually produced","d":"are less versatile"},"answer":"C"},{"num":434,"text":"Why do structure fires tend to have a lot of smoke","options":{"a":"All of the fuel burns out, leaving smoke behind","b":"Combustion is incomplete in a structure fire","c":"The high amount of air supply in the structure produces smoke","d":"The lack of carbon in the environment creates smoke"},"answer":"B"},{"num":435,"text":"When small burning objects are uncovered during overhaul, it is often more effective to","options":{"a":"submerge them in water.","b":"take them outside the structure to extinguish them.","c":"drench them with hose streams.","d":"allow the fire to burn itself out."},"answer":"A"},{"num":436,"text":"One limitation of mechanical ventilation is that it:","options":{"a":"can only be used for horizontal ventilation operations.","b":"requires more resources and personnel than natural ventilation.","c":"requires the spray stream from a fog nozzle in order to be effective.","d":"slows down the introduction of air to the fire."},"answer":"B"},{"num":437,"text":"Air-purifying respirators (APRs) and powered-air purifying respirators (PAPRs)","options":{"a":"are designed for atmospheres with increased oxygen levels.","b":"protect against toxic gases and heated atmospheres.","c":"filter larger particulates, but not smaller particulates.","d":"are generally sufficient to protect the wearer from particulate contaminants."},"answer":"D"},{"num":438,"text":"Firefighters should review the manufacturers' operation and maintenance guides","options":{"a":"annually.","b":"regularly.","c":"before and after each use.","d":"when they have downtime."},"answer":"B"},{"num":439,"text":"A double-hung window is commonly used in residential occupancies because","options":{"a":"it permits circulation through the top and bottom of the window opening.","b":"the push bar used to operate the window is notched to hold the window in place.","c":"the amount of opening can be varied for ventilation without admitting rain.","d":"it has only one operable sash that moves horizontally in the window frame."},"answer":"A"},{"num":440,"text":"Which type of ladder is commonly used to access attics or crawl spaces","options":{"a":"Folding ladder","b":"Extension ladder","c":"Single ladder","d":"Roof ladder"},"answer":"A"},{"num":441,"text":"Right of entry at a fire scene means firefighters have the right to:","options":{"a":"deny entry to owners","b":"re-enter at any time if evidence is found","c":"remove any property relevant to the investigation","d":"re-enter until control of the scene is relinquished"},"answer":"D"},{"num":442,"text":"General considerations for forcible entry include","options":{"a":"the number of personnel on scene.","b":"contacting the owner of the structure before forcing entry.","c":"knowledge, selection, and use of the correct tools.","d":"the approximate cost of forcible entry operations."},"answer":"C"},{"num":443,"text":"The first action upon arrival at a vehicle incident is to:","options":{"a":"assess victims and begin extrication","b":"decide if traffic must be diverted and request assistance","c":"attack visible fire","d":"isolate ignition sources"},"answer":"B"},{"num":444,"text":"Because revolving doors can prevent the movement of hose or equipment into a building and a crowd of people fleeing an emergency cannot move through a revolving door quickly, they","options":{"a":"are rarely installed in structures today.","b":"should only be used as vertical fire doors during fire conditions.","c":"are designed to collapse under pressure and provide an unobstructed opening.","d":"cannot be used during fire operations."},"answer":"C"},{"num":445,"text":"Firefighters should wear personal protective equipment (PPE)","options":{"a":"after entering a fire or emergency environment.","b":"that provides greater protection than is needed.","c":"appropriate for the type of incident and activity being performed.","d":"only if requested to do so by supervisors or other firefighters."},"answer":"C"},{"num":446,"text":"The main structural member of a ladder that supports the rungs or rung blocks is the","options":{"a":"fly.","b":"pawl.","c":"butt.","d":"Beam."},"answer":"D"},{"num":447,"text":"Which figure-eight knot is used for securing objects","options":{"a":"Figure-eight round turn","b":"Figure-eight on a bight","c":"Figure-eight follow-through","d":"Figure-eight bend"},"answer":"C"},{"num":448,"text":"Flammability ratings for materials used to cover floors are indicated","options":{"a":"in occupancy classifications.","b":"in hours.","c":"by load-bearing.","d":"by stability."},"answer":"B"},{"num":449,"text":"A common cause of poor foam production is:","options":{"a":"excessive nozzle pressure","b":"viscous concentrate mixing","c":"mismatched eductor and nozzle flow ratings","d":"nozzle height below eductor"},"answer":"C"},{"num":450,"text":"When should power tools be inspected?","options":{"a":"Once a month","b":"Once a week","c":"At the beginning of each work shift","d":"After each use"},"answer":"C"},{"num":451,"text":"Carbon monoxide is released when an organic material burns in an atmosphere with a _____ and exposure can result in hypoxia or death","options":{"a":"high-carbon concentration","b":"high-oxygen concentration","c":"low-oxygen concentration","d":"low-carbon concentration"},"answer":"C"},{"num":452,"text":"How can firefighters use doors to their advantage during interior operations","options":{"a":"By wetting them down with extinguishing agents","b":"By closing them to control available oxygen sources","c":"By removing them from their hinges to create a permanent flow path","d":"By opening them to slow the effect of fire in one room"},"answer":"B"},{"num":453,"text":"Which sprinkler system has no water in the piping before activation and open sprinklers?","options":{"a":"Dry-pipe","b":"Preaction","c":"Wet-pipe","d":"Deluge"},"answer":"D"},{"num":454,"text":"Radio systems in the fire service can be classified according to","options":{"a":"location and size.","b":"secure and unsecure.","c":"plain text and 10-code.","d":"emergency and nonemergency."},"answer":"A"},{"num":455,"text":"Why are fires involving solar panels particularly hazardous?","options":{"a":"They ignite spontaneously","b":"Power inside the structure cannot be shut off","c":"Water releases harmful gases","d":"The solar panel array cannot be turned off"},"answer":"D"},{"num":456,"text":"In order to form a loop in a rope","options":{"a":"cross the side of a bight over the standing part.","b":"create a tight bend in the running end.","c":"simply bend the rope back on itself while keeping the sides parallel.","d":"further bend one side of a round turn."},"answer":"A"},{"num":457,"text":"What personal protective equipment (PPE) should be worn by personnel in the warm zone","options":{"a":"PPE appropriate for decontamination","b":"Whatever PPE is available to the personnel","c":"PPE is not necessary for the warm zone","d":"Full PPE that can be worn in the hot zone"},"answer":"D"},{"num":458,"text":"How do heavy-duty padlocks differ from standard padlocks","options":{"a":"The shackles on heavy-duty padlocks are made of case-hardened steel while the shackles on standard padlocks are not.","b":"Heavy-duty padlocks are combination-operated while standard padlocks are key-operated.","c":"Only one side of the heavy-duty padlock can be released, while either side of a standard padlock can be released.","d":"Heavy-duty padlocks are key-operated while standard padlocks are"},"answer":"A"},{"num":459,"text":"When the public contacts the fire station directly regarding an emergency, the dispatcher should","options":{"a":"let the caller talk directly to the firefighters or other appropriate personnel.","b":"transfer the caller to the Public Information Officer (PIO), who will contact the appropriate personnel.","c":"follow established procedures for relaying the information from the caller to firefighters.","d":"wait to relay any information to the firefighters until the call is determined to be legitimate."},"answer":"C"},{"num":460,"text":"Rapid fire development usually occurs during the ____ stage","options":{"a":"fully-developed","b":"incipient","c":"growth","d":"decay"},"answer":"C"},{"num":461,"text":"A security gate is best accessed by","options":{"a":"cutting through the gate.","b":"climbing over the gate.","c":"using through-the-lock techniques.","d":"prying open the gate."},"answer":"C"},{"num":462,"text":"How might fire conditions affect masonry components","options":{"a":"Mortar between bricks, blocks, and stone will ignite quickly, causing structural collapse","b":"Concrete blocks may crack and lose their strength, causing structural collapse","c":"Stones and concrete stand up well to fire and intense heat, but may crack or shatter when cooled with water","d":"Stones and concrete may lose small portions of their surface when heated"},"answer":"D"},{"num":463,"text":"Which EMS level provides the highest level of patient care?","options":{"a":"Advanced EMT","b":"Medical first responder","c":"First aid provider","d":"Paramedic"},"answer":"D"},{"num":464,"text":"The modified cross-body is the same as the cross-body method except that the victim","options":{"a":"faces the firefighter.","b":"is conscious.","c":"faces the ladder.","d":"is rested on the firefighter's knee."},"answer":"C"},{"num":465,"text":"To help prevent chemical damage to fire hose,","options":{"a":"lay fire hose directly against curbs or in gutters.","b":"scrub hose suspected of contacting an acid with plain water.","c":"avoid exposing fire hose to hazardous materials spills.","d":"place hose in vehicle travel lanes instead or on curbs or in gutters."},"answer":"C"},{"num":466,"text":"When using any forcible entry tool, always","options":{"a":"have a prying tool ready to use as a striking tool in case the tool in use is not sufficient","b":"wear appropriate PPE, especially hand, eye, and ear protection","c":"station a firefighter with a charged hoseline nearby","d":"have multiple firefighters operating the tool to prevent injury"},"answer":"B"},{"num":467,"text":"The rate of heat transfer depends on the _____ differences between the objects and the thermal conductivity of their materials","options":{"a":"pressure","b":"oxidation","c":"temperature","d":"physical"},"answer":"C"},{"num":468,"text":"Because of conditions in an IDLH atmosphere, firefighters should wear SCBA until they have returned to the","options":{"a":"fire station.","b":"warm zone.","c":"cold zone.","d":"fire apparatus."},"answer":"C"},{"num":469,"text":"To be physically and mentally prepared for survival during search and rescue operations, you should","options":{"a":"practice basic skills and train for the hazards you will encounter.","b":"allow the Incident Commander to ensure your safety.","c":"work in smaller teams.","d":"push yourself past your limits during training."},"answer":"A"},{"num":470,"text":"Which type of lighting is mounted on a vehicle and wired directly to the vehicle-mounted generator or apparatus’ electrical system","options":{"a":"Fixed","b":"Portable","c":"Solar","d":"Hydraulic"},"answer":"A"},{"num":471,"text":"Which window component protects a window opening in the same manner as a fire door or wall","options":{"a":"Triple-glazed glass","b":"Security bar or grille","c":"Horizontal slide","d":"Rolling steel shutter"},"answer":"D"},{"num":472,"text":"When communicating with radios, fire department personnel should","options":{"a":"avoid using emergency-specific words and phrases.","b":"use clear text (plain English).","c":"ensure communications cannot be understood by others listening in.","d":"use agency-specific codes (10-codes)."},"answer":"B"},{"num":473,"text":"Firefighter responsibilities during a fire investigation include:","options":{"a":"determining liability","b":"updating the media","c":"appointing investigators","d":"recognizing and collecting important information"},"answer":"D"},{"num":474,"text":"When ventilating a rain roof, it is important to remember that","options":{"a":"the original roof cannot be punctured when ventilating the rain roof.","b":"it will not remove smoke from the structure until the original roof is penetrated.","c":"firefighters will need to enter the void area to penetrate the original roof as well.","d":"the original roof must be penetrated before the rain roof."},"answer":"B"},{"num":475,"text":"A Firefighter II at a confined space rescue may:","options":{"a":"serve on backup team","b":"ventilate space","c":"prepare SCBA","d":"operate SAR systems"},"answer":"D"},{"num":476,"text":"The combination of tools known as “irons” consists of a","options":{"a":"flat-head axe and Halligan tool.","b":"pick-head axe and Halligan tool.","c":"hammer and pike pole.","d":"hammer and prybar."},"answer":"A"},{"num":477,"text":"An indicator that a door is outward-swinging is that the hinges of the door are","options":{"a":"on the left side of the door.","b":"not visible.","c":"on the right side of the door.","d":"visible."},"answer":"B"},{"num":478,"text":"Pieces of glass, fragments of bottles or containers, and metal parts may indicate","options":{"a":"the presence of an incendiary device.","b":"abnormally high heat intensity.","c":"trailers.","d":"the fire was accidental."},"answer":"A"},{"num":479,"text":"Which communications center equipment allows the public to text 9-1-1 and send videos to communications centers","options":{"a":"Wired telegraph circuit boxes","b":"Direct line telephones","c":"Next Generation 9-1-1","d":"Teletype (TTY)"},"answer":"C"},{"num":480,"text":"What is a limitation of using a foam nozzle eductor?","options":{"a":"Only apparatus-mounted use","b":"Must connect directly to the hose lay","c":"Only compatible with Class A foam","d":"Foam concentrate must be moved when the nozzle is moved"},"answer":"D"},{"num":481,"text":"When washing synthetic fiber ropes,","options":{"a":"use warm water and a mild detergent.","b":"dry the rope immediately after with a heated dryer.","c":"do not use water, as it will damage rope.","d":"use bleach and warm water."},"answer":"A"},{"num":482,"text":"Life safety rope uses _____ construction while all other types of rope construction are used for utility ropes","options":{"a":"braided","b":"kernmantle","c":"figure-eight","d":"laid"},"answer":"B"},{"num":483,"text":"In a wide-area search method, markers indicate","options":{"a":"occupants discovered.","b":"number of searchers.","c":"distance from fire.","d":"distance from entrance."},"answer":"D"},{"num":484,"text":"Type III construction requires exterior walls and structural members be constructed of","options":{"a":"highly combustible materials.","b":"large-dimensioned lumber or laminated wood.","c":"prefabricated or glue-laminated wood.","d":"noncombustible or limited combustible materials."},"answer":"D"},{"num":485,"text":"Which part of a ground cover fire is the area in which fire has consumed fuels and can be a relatively safe area during a fire?","options":{"a":"Green","b":"Black","c":"Green zone","d":"Island"},"answer":"B"},{"num":486,"text":"To provide the level of protection intended by NFPA standards, PPE components","options":{"a":"must be compatible with each other.","b":"must protect you from all hazard types.","c":"may be altered to match the emergency situation.","d":"should not be combined with other types of PPE."},"answer":"A"},{"num":487,"text":"Where are lockboxes typically found","options":{"a":"At a secure location away from the structure","b":"Below a window sill","c":"Attached to the door","d":"Near the main entrance"},"answer":"D"},{"num":488,"text":"When pressurized gas vessels are exposed to flame impingement, apply:","options":{"a":"fog streams from maximum reach","b":"rain-down foam","c":"solid streams from handlines","d":"solid streams from unstaffed master streams at max reach"},"answer":"D"},{"num":489,"text":"When declaring a MAYDAY, the firefighter should first","options":{"a":"attempt escape.","b":"activate PASS.","c":"deactivate PASS.","d":"describe the problem and location."},"answer":"D"},{"num":490,"text":"Guides that set boundaries and establish standards of conduct that an organization expects from its members are","options":{"a":"mandates.","b":"policies.","c":"procedures.","d":"Guidelines."},"answer":"C"},{"num":491,"text":"The sequence of events that allows an ignition source to ignite a fuel package is known as the:","options":{"a":"fire origin","b":"ignition sequence","c":"fire cause","d":"stages of fire development"},"answer":"B"},{"num":492,"text":"An oxygen-deficient IDLH atmosphere occurs below","options":{"a":"15.1 percent","b":"19.5 percent.","c":"23.5 percent","d":"20.9 percent"},"answer":"B"},{"num":493,"text":"When might a pushing or pulling tool be used in forcible entry","options":{"a":"As a lever to create a mechanical advantage","b":"When prying a door or window","c":"In combination with another tool when using striking methods","d":"When opening walls or ceilings"},"answer":"D"},{"num":494,"text":"Even though it poses far less risk because of the short amount of time it can survive outside the body, personnel should still practice proper BSI procedures when exposed to:","options":{"a":"human immunodeficiency virus (HIV)","b":"tuberculosis (TB)","c":"hepatitis B","d":"hepatitis A"},"answer":"A"},{"num":495,"text":"When should Incident Command be transferred at a scene","options":{"a":"If a higher-ranking or more extensively trained responder arrives","b":"After the scene is secured","c":"When law enforcement authorities arrive on scene","d":"Once fire department activities are complete"},"answer":"A"},{"num":496,"text":"When aiming the nozzle of an extinguisher at a fire, the nozzle should be aimed:","options":{"a":"at the top of the fire.","b":"at the base of the fire.","c":"away from the fire.","d":"downwind of the fire."},"answer":"B"},{"num":497,"text":"What is one factor that can limit the reach of a hose stream","options":{"a":"The absorption of heat from a fog stream converts water into steam or vapor, making it less effective.","b":"A wall or ceiling breaking up a solid stream, providing less surface area to absorb heat.","c":"Air friction affects the outer surfaces of a compact solid stream, causing it to have a shorter reach than fog nozzles.","d":"Gravity can cause solid streams to separate and lose their compact shapes."},"answer":"D"},{"num":498,"text":"Which type of shock occurs when the heart is unable to pump enough blood to the tissue?","options":{"a":"Neurogenic","b":"Hypovolemic","c":"Cardiogenic","d":"Septic"},"answer":"C"},{"num":499,"text":"One disadvantage of a flat load is that","options":{"a":"the hose folds contain sharp bends at both ends of the bed.","b":"the load can only be performed on a single hose bed.","c":"it is more likely to be damaged from apparatus vibration.","d":"it only works for loading large diameter hose."},"answer":"A"},{"num":500,"text":"At a fire scene under investigation, firefighters should NOT:","options":{"a":"provide opinions to the media","b":"conduct overhaul operations","c":"enter until investigators arrive","d":"attempt to preserve evidence"},"answer":"A"},{"num":501,"text":"When working on a roof or upper stories,","options":{"a":"at least two separate means of egress are required.","b":"the ground ladder will need to be shifted to another location.","c":"the hooks of the roof ladder should engage on the roof's edge.","d":"firefighters must climb down the ground ladder at the same location they climbed up it."},"answer":"A"},{"num":502,"text":"The most important variable when choosing an appropriate hoseline is:","options":{"a":"nozzle type.","b":"extinguishing agent.","c":"stream reach.","d":"flow rate."},"answer":"D"},{"num":503,"text":"When might hoselines and nozzles be used in ventilation operations?","options":{"a":"During hydraulic ventilation operations","b":"To begin natural ventilation","c":"When airflow needs to be generated out doors and windows","d":"To prevent wind from adversely affecting ventilation operations"},"answer":"A"},{"num":504,"text":"How does a wet-barrel hydrant differ from a dry-barrel hydrant","options":{"a":"A wet-barrel hydrant is designed for climates with freezing temperatures, while a dry-barrel hydrant is designed for warmer climates.","b":"A wet-barrel hydrant is pressurized, while a dry-barrel hydrant is nonpressurized.","c":"A wet-barrel hydrant is designed for warmer climates, while a dry-barrel hydrant is designed for use in climates with freezing temperatures.","d":"A wet-barrel hydrant is nonpressurized, while a dry-barrel hydrant is pressurized."},"answer":"C"},{"num":505,"text":"Which situation might result in an undetermined fire cause classification?","options":{"a":"A natural disaster causes a fire, but the origin cannot be determined","b":"A fire is set under suspicious circumstances but cannot be proven","c":"Arson is suspected, but there are no criminal suspects","d":"The structure and contents are destroyed and the ignition sequence cannot be identified"},"answer":"D"},{"num":506,"text":"When presenting to children, firefighters should:","options":{"a":"use fire service terminology","b":"use the same messaging as with adults","c":"don PPE while the children watch","d":"tell stories and show examples of home fires"},"answer":"C"},{"num":507,"text":"What would likely cause rope to be removed from service and destroyed","options":{"a":"Metal shavings or wood splinters in the rope","b":"Rope that has gotten wet","c":"Impact load on a rope","d":"Mildew or mold on the rope"},"answer":"A"},{"num":508,"text":"A direct attack on a ground cover fire is:","options":{"a":"used against fires too large for indirect attack","b":"action taken directly against the flames at its edge or closely parallel to it","c":"used at varying distances","d":"action taken at the fire’s origin"},"answer":"B"},{"num":509,"text":"What is an example of an unsafe behavior in a home safety survey?","options":{"a":"Unsecured swimming pool access","b":"Hoarding conditions","c":"Overloaded attic","d":"Cleaners left in the open"},"answer":"B"},{"num":510,"text":"When underground pipes are damaged, concerns include evacuation and:","options":{"a":"extinguishing burning gas","b":"locating a safe haven","c":"rescue and recovery operations","d":"elimination of ignition sources"},"answer":"D"},{"num":511,"text":"Controlling available flow paths includes:","options":{"a":"closing any doors as much as the hoselines in use will allow.","b":"opening doors completely to fully ventilate the fire area.","c":"breaking windows to entrain smoke and fire gases away from the entry point.","d":"completely closing exterior doors and using windows to advance hoselines."},"answer":"A"},{"num":512,"text":"When attempting wind assisted ventilation:","options":{"a":"the exhaust point should be located on the roof so that smoke is directed away from window and door openings.","b":"firefighters should use water streams to help direct the smoke towards the exhaust point.","c":"windows and doors on the upwind side of the structure should be opened first.","d":"windows and doors on the downwind side of the structure should be opened first."},"answer":"D"},{"num":513,"text":"How do fog nozzles and foam nozzles differ?","options":{"a":"Foam nozzles are non-aspirated; fog nozzles aspirate air","b":"Fog nozzles are only compatible with Class A foam","c":"Foam nozzles are only compatible with Class A foam","d":"Fog nozzles apply non-aspirated foam; foam nozzles aspirate air"},"answer":"D"},{"num":514,"text":"Aqueous film forming foam (AFFF) extinguishers are most effective on:","options":{"a":"combustible metals and alloys.","b":"energized electrical equipment.","c":"static pools of flammable liquids.","d":"fuel that is flowing down from an elevated point."},"answer":"C"},{"num":515,"text":"Ground ladders should be service tested","options":{"a":"after each use.","b":"weekly.","c":"annually while in service.","d":"Monthly."},"answer":"C"},{"num":516,"text":"When climbing a ladder, firefighters should","options":{"a":"climb using their arm muscles.","b":"keep their knees slightly bent.","c":"keep their arms slightly bent.","d":"focus their eyes on the tip of the ladder."},"answer":"B"},{"num":517,"text":"A-tools would typically be used to force entry on","options":{"a":"locks with collars or protective cone-shaped covers.","b":"doors equipped with panic hardware.","c":"electronic or keyless locks.","d":"heavy-duty padlocks."},"answer":"A"},{"num":518,"text":"Multi drug-resistant organisms (MDROs):","options":{"a":"may be easily contained","b":"do not typically respond to conventional antibiotic treatment","c":"cannot survive outside the body","d":"pose far less risk to responders than other communicable diseases"},"answer":"B"},{"num":519,"text":"Which construction type is characterized by the use of large-dimensioned lumber or laminated wood","options":{"a":"Type IV","b":"Type III","c":"Type II","d":"Type I"},"answer":"A"},{"num":520,"text":"If you handle, move, or gather evidence, you","options":{"a":"must be the only one that handles the evidence from that point on.","b":"are subject to investigation.","c":"have disturbed the evidence and it is no longer viable.","d":"become part of the chain of custody for the evidence."},"answer":"D"},{"num":521,"text":"Which characteristic of Type IV buildings can affect fire behavior during a structural fire","options":{"a":"Because of the sheer mass of the structural members, structures can collapse easily.","b":"Truss systems can create large, open voids between the floors of structures, allowing rapid fire spread.","c":"High wood concentration can contribute to the intensity of the fire.","d":"Lack of voids or concealed spaces can allow unseen fire travel."},"answer":"C"},{"num":522,"text":"What is an indicator of rollover","options":{"a":"Flames spread through the hot gas layer","b":"A mid-level neutral plane","c":"Little or no visible flame in the compartment","d":"An increase of ventilation in the compartment"},"answer":"A"},{"num":523,"text":"The first priority at a vehicle incident involving a downed high-voltage power line is to secure the scene by","options":{"a":"beginning vehicle extrication operations.","b":"contacting law enforcement to barricade the area.","c":"contacting the electric company to shut off power.","d":"removing any victims from the area."},"answer":"C"},{"num":524,"text":"What is one indicator that a fire is approaching flashover","options":{"a":"Pulsing smoke movement around small openings in the building","b":"Large volumes of darkening smoke","c":"High heat, crackling, or breaking sounds","d":"Little or no visible flame"},"answer":"B"},{"num":525,"text":"Removing the doors and roof from a unibody construction vehicle:","options":{"a":"involves cutting into the seat belt pretensioners and side air bags","b":"is the most efficient way to reach a trapped victim","c":"should only be done as a last resort","d":"can seriously compromise its structural integrity"},"answer":"D"},{"num":526,"text":"Different staffing classifications are based on","options":{"a":"how many functions a company can serve and the number of companies in a battalion.","b":"whether firefighters have completed Firefighter I or Firefighter II training.","c":"whether or not firefighters are paid and how often they work.","d":"the number of firefighters in the company and their experience."},"answer":"C"},{"num":527,"text":"Operations, Planning, and Logistics are all functional areas of the ____ organizational level in the NIMS- ICS","options":{"a":"Section","b":"Command","c":"Branch","d":"Division"},"answer":"A"},{"num":528,"text":"What is one of the indicators of backdraft","options":{"a":"Pulsing smoke movement around small openings in the building","b":"Rapidly increasing volume of darkening smoke","c":"Pyrolysis of contents or fuel packages located some distance from the fire","d":"Isolated flames or rollover in the hot gas layers or near the ceiling"},"answer":"A"},{"num":529,"text":"How does balloon frame construction differ from platform frame construction","options":{"a":"Balloon frame buildings are more prone to shrinkage than platform frame buildings.","b":"Balloon frame construction is used in most modern buildings; platform frame construction is found in most older buildings.","c":"A fire in a balloon frame building can be controlled easier than a fire in a platform frame building.","d":"In balloon framing, exterior wall studs are continuous from the foundation to the roof; in platform framing, they are not."},"answer":"D"},{"num":530,"text":"A fire scene perimeter should:","options":{"a":"be treated as a crime scene until arson is ruled out","b":"only be recognizable to responders","c":"start small and expand","d":"be visible and recognizable to everyone"},"answer":"D"},{"num":531,"text":"To prevent premature extinguishment at pressurized liquid fuel fires:","options":{"a":"apply water low on tank","b":"direct water at leaks","c":"continue cooling after fire is out","d":"apply water close to tank"},"answer":"C"},{"num":532,"text":"In which search method does the leader remain at a fixed point","options":{"a":"Wide-area search","b":"Secondary search","c":"VEIS","d":"Oriented-search method."},"answer":"D"},{"num":533,"text":"According to NFPA 1550, the minimum PPE for firefighters to participate in ground cover fire fighting includes","options":{"a":"respiratory protection.","b":"chain saw protection.","c":"load-bearing equipment.","d":"a fire shelter."},"answer":"D"},{"num":534,"text":"Canvas salvage cover care and maintenance includes","options":{"a":"always scrubbing salvage covers with a detergent solution before rinsing them.","b":"folding salvage covers when they are still wet, and then setting them outside to dry.","c":"completely drying the salvage covers before folding and storing them.","d":"letting salvage covers dry outdoors when it is windy."},"answer":"C"},{"num":535,"text":"Which type of hose stream pattern has a smaller surface area and absorbs heat less efficiently than other hose stream patterns","options":{"a":"Solid stream","b":"Straight stream","c":"Fog stream","d":"Broken stream"},"answer":"A"},{"num":536,"text":"When firefighters apply water to the hot gas layer in a compartment, it will:","options":{"a":"produce large amounts of steam to help extinguish the fire","b":"reduce the radiant heat flux from the upper layer","c":"increase flaming combustion in the upper layer","d":"increase the potential for flashover"},"answer":"B"},{"num":537,"text":"What would be an appropriate use for dynamic kernmantle rope","options":{"a":"Hoisting equipment with a high-impact load","b":"Hoisting victims","c":"A rappelling line for responders","d":"A belay line for hoisting applications"},"answer":"D"},{"num":538,"text":"In order to transition from a ladder carry to a raise, firefighters should first","op
