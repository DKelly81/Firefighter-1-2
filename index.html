<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f7fafc;color:#2d3748}
header{position:sticky;top:0;z-index:10;background:#1a365d;color:#fff;padding:14px max(14px,env(safe-area-inset-left)) 12px;box-shadow:0 2px 8px #0003}
h1{font-size:20px;margin:0 0 4px}
.sub{font-size:13px;opacity:.9}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button,select{font:inherit;border-radius:8px;padding:9px 12px;border:1px solid #cbd5e0;background:#fff;color:#1a365d;font-weight:600}
button.primary{background:#c53030;color:#fff;border-color:#c53030}
.progress{height:6px;background:#ffffff33;border-radius:4px;margin-top:10px;overflow:hidden}
.fill{height:100%;width:0;background:#48bb78;transition:width .2s}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:7px}
main{max-width:820px;margin:auto;padding:18px 12px 100px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px;box-shadow:0 1px 4px #0001}
.num{font-size:12px;font-weight:700;color:#1a365d;text-transform:uppercase;margin-bottom:7px}
.question{font-size:18px;font-weight:600;line-height:1.45;margin-bottom:16px}
.option{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;padding:13px;border:2px solid #e2e8f0;background:#fff;color:#2d3748;font-weight:400}
.option.selected{border-color:#1a365d;background:#ebf8ff}
.option.correct{border-color:#276749;background:#f0fff4}
.option.wrong{border-color:#c53030;background:#fff5f5}
.letter{font-weight:800;min-width:20px}
.feedback{margin-top:12px;padding:10px;border-radius:8px;display:none;font-size:14px}
.feedback.show{display:block}
.feedback.good{background:#c6f6d5;color:#22543d}
.feedback.bad{background:#fed7d7;color:#742a2a}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.nav button{flex:1;background:#1a365d;color:#fff;border-color:#1a365d}
.nav .secondary{background:#fff;color:#1a365d}
.panel{display:none;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:22px;text-align:center}
.score{font-size:48px;font-weight:800;color:#1a365d}
.jump{margin-top:14px;display:none;grid-template-columns:repeat(8,1fr);gap:5px;max-height:280px;overflow:auto;padding:8px;background:#edf2f7;border-radius:8px}
.jump.show{display:grid}
.jump button{padding:8px 2px;font-size:12px}
.jump button.answered{background:#bee3f8}
.jump button.correct{background:#c6f6d5}
.jump button.wrong{background:#fed7d7}
@media(max-width:600px){main{padding:12px 10px 90px}.question{font-size:17px}header{padding-top:12px}}
</style>

<script>
const QUESTIONS = [{"num":1,"text":"A half-hitch is a knot that is","options":{"a":"used for life safety applications.","b":"always combined with another knot or hitch.","c":"forming a bight.","d":"used to tie ropes of equal diameters together."},"answer":"B"},{"num":2,"text":"NFPA 1960 requires that the designated ladder length be marked on","options":{"a":"each rail.","b":"the second rung from the butt.","c":"each beam.","d":"the butt plate."},"answer":"C"},{"num":3,"text":"What is one method for extinguishing undercarriage fires?","options":{"a":"Use a straight stream while advancing","b":"Protect exposures and let it burn out","c":"Apply Class A foam directly","d":"Direct the stream downward and allow water to deflect toward the underside of the vehicle"},"answer":"D"},{"num":4,"text":"Which officer position monitors operational safety at emergency incidents","options":{"a":"Assistant/Deputy Chief","b":"District/Battalion Chief","c":"Fire Department Incident Safety Officer","d":"Fire Department Health and Safety Officer"},"answer":"C"},{"num":5,"text":"During a fire, heat transfer methods tend to","options":{"a":"occur individually","b":"involve conduction","c":"occur together","d":"involve radiation"},"answer":"C"},{"num":6,"text":"After performing scene size-up, the first-arriving firefighter must:","options":{"a":"transfer command.","b":"communicate the IAP to all on-scene and responding personnel.","c":"transmit an arrival report.","d":"conduct a risk-benefit analysis."},"answer":"C"},{"num":7,"text":"Which type of fire door is found in old industrial or storage buildings, is usually held open by a fusible link, and slides into position along a track","options":{"a":"Swinging","b":"Horizontal sliding","c":"Overhead rolling steel","d":"Vertical sliding"},"answer":"B"},{"num":8,"text":"The level of stress firefighters deal with on a regular basis is","options":{"a":"mostly atypical and rarely occupational.","b":"greater than that of most of the civilian population.","c":"common enough that it becomes manageable.","d":"less of a concern than physical health risks or injuries."},"answer":"B"},{"num":9,"text":"What is one body substance isolation (BSI) procedure?","options":{"a":"Treating shock","b":"Hand washing","c":"Getting immunized","d":"Applying a tourniquet"},"answer":"B"},{"num":10,"text":"A vehicle's structural integrity after a collision is determined by the:","options":{"a":"type of collision","b":"position of vehicle","c":"strength of the chassis","d":"type of vehicles"},"answer":"C"},{"num":11,"text":"Which is an important indicator of structural collapse","options":{"a":"Duration of the fire","b":"Time of day","c":"Value of the structure","d":"Construction methods used"},"answer":"A"},{"num":12,"text":"In building construction, Type I construction","options":{"a":"is considered the least collapse resistant.","b":"provides the highest level of protection from fire spread and structural collapse.","c":"is characterized by the use of large-dimensioned lumber or laminated wood.","d":"tends to fail sooner than the other construction types."},"answer":"B"},{"num":13,"text":"A halyard is used to","options":{"a":"secure the top end of the ladder to the highest point on a roof or building.","b":"prevent the fly section from being extended too far.","c":"hoist and lower the fly sections of an extension ladder.","d":"stabilize the bed section so that it stays in contact with the ground or supporting surface."},"answer":"C"},{"num":14,"text":"Because seat belt pretensioners present a significant ignition hazard, firefighters should:","options":{"a":"keep a hose stream directed at the pretensioner","b":"NOT attempt to disable the seat belt","c":"NOT cut into the seat belt pretensioner","d":"avoid cutting the seat belt webbing"},"answer":"C"},{"num":15,"text":"Vehicle components made with _____ can cause high-heat fires.","options":{"a":"aluminum","b":"steel","c":"magnesium","d":"rubber"},"answer":"C"},{"num":16,"text":"The figure-eight bend is used primarily","options":{"a":"for joining two pieces of webbing or the ends of the same piece of webbing when a loop is needed.","b":"to stabilize long objects that are being hoisted.","c":"for securing objects.","d":"on life safety rope to tie ropes of equal diameters together."},"answer":"D"},{"num":17,"text":"Conduction occurs when a material is heated as a result of","options":{"a":"the transmission of energy as electromagnetic waves","b":"direct contact with a heat source","c":"the circulation or movement of a fluid","d":"turbulence and the velocity of moving gases"},"answer":"B"},{"num":18,"text":"The primary consideration for how easily a solid fuel ignites is its","options":{"a":"surface-to-mass ratio","b":"heat release rate","c":"flash point","d":"vapor density"},"answer":"A"},{"num":19,"text":"Which radio channel is assigned for fireground operations","options":{"a":"Tactical","b":"Firefighter","c":"Command","d":"Logistics"},"answer":"A"},{"num":20,"text":"At a possible BLEVE incident, firefighters should:","options":{"a":"apply water at the leak","b":"use foam instead of water","c":"apply water from maximum distance","d":"open pressure relief valves"},"answer":"C"},{"num":21,"text":"What is an unsafe condition that should be noted in a preincident survey?","options":{"a":"Absence of smoke detectors in kitchens","b":"Nonworking smoke or carbon monoxide detectors","c":"Bedroom doors that are closed","d":"Open or unlocked windows"},"answer":"B"},{"num":22,"text":"Which foam is effective on hydrocarbons and polar solvents?","options":{"a":"Class A","b":"Class C","c":"Class D","d":"Class B"},"answer":"D"},{"num":23,"text":"Which type of resource uses a set number of resources of the same kind and type that have an established minimum number of personnel?","options":{"a":"Strike team","b":"Crew","c":"Task force","d":"Mutual aid"},"answer":"A"},{"num":24,"text":"The group of personnel that delivers emergency services to the public is known as _____ personnel while the group that provides administrative and logistical support to those personnel is known as staff personnel","options":{"a":"line","b":"volunteer","c":"on-call","d":"Career"},"answer":"A"},{"num":25,"text":"With premix foam proportioning, the solution:","options":{"a":"must be stored days","b":"is lower quality","c":"is limited to one-time use","d":"only works in in-line eductors"},"answer":"C"},{"num":26,"text":"How do Class C extinguishing agents differ from other types of extinguishing agents?","options":{"a":"They are water-based.","b":"They do not conduct electricity.","c":"They use foam application methods.","d":"They can be used on other classes of fire."},"answer":"B"},{"num":27,"text":"Creating negative pressure for horizontal mechanical ventilation means:","options":{"a":"using normal air currents to raise the pressure inside the structure.","b":"artificially raising the pressure inside the structure.","c":"artificially lowering the pressure inside the structure.","d":"using normal air currents to lower the pressure inside the structure."},"answer":"C"},{"num":28,"text":"If the intensity of a fire increases when water is applied to it, then","options":{"a":"the fire involves ordinary combustibles.","b":"foam extinguishing agents must be used.","c":"the fire scene should be evacuated and reassessed.","d":"an accelerant may have been used."},"answer":"D"},{"num":29,"text":"What is an example of physical evidence?","options":{"a":"Eyewitness testimony","b":"A person seeing someone ignite gasoline","c":"Tire imprint","d":"A person seen running from a building"},"answer":"C"},{"num":30,"text":"Which part of a ground cover usually burns downhill or against the wind, causing it to burn slowly and be easier to control?","options":{"a":"Spot fire","b":"Head","c":"Heel","d":"Island"},"answer":"C"},{"num":31,"text":"What must be done when shutting down a dry-barrel hydrant","options":{"a":"One discharge should be left open to ensure there is no vacuum coming from the discharge","b":"At least 10 percent of the water must be left in the hydrant","c":"All of the water must be drained out","d":"A hydrant technician must verify the hydrant is shut down"},"answer":"C"},{"num":32,"text":"Which type of fog nozzle discharges at a constant rate throughout the range of patterns from a straight stream to a wide fog at a designated nozzle pressure","options":{"a":"Basic fog nozzle","b":"Constant gallonage fog nozzle","c":"Constant pressure (automatic) fog nozzle","d":"Constant/select gallonage fog nozzle"},"answer":"B"},{"num":33,"text":"All alarm-signaling devices operate simultaneously in a _____ system.","options":{"a":"annunciated","b":"zoned","c":"noncoded","d":"addressable"},"answer":"C"},{"num":34,"text":"Which statement is true of preincident surveys?","options":{"a":"They should be combined with code inspections","b":"They should be surprise visits","c":"Multiple buildings should be surveyed together","d":"Notes and photographs of hazards should be taken"},"answer":"D"},{"num":35,"text":"The discharge pattern of sprinkler water is created by:","options":{"a":"control valves","b":"deflectors","c":"cross mains","d":"fusible links"},"answer":"B"},{"num":36,"text":"In an outside stem and yoke (OS&Y) valve, the valve is open when the stem is:","options":{"a":"not visible","b":"in line with the yoke","c":"visible beyond the yoke","d":"perpendicular to the yoke"},"answer":"C"},{"num":37,"text":"The longer the handle of a manual prying tool, the","options":{"a":"lesser the force produced at the working end.","b":"greater the force produced at the working end.","c":"more useful it is as a striking tool.","d":"less effective the tool is for prying."},"answer":"B"},{"num":38,"text":"Why can gaseous fuels be the most dangerous fuel type","options":{"a":"They have a specific gravity of 1","b":"They have a vapor density of 1","c":"They are already in the physical state required for ignition","d":"They have a low surface-to-mass ratio"},"answer":"C"},{"num":39,"text":"The cause of most fire deaths is due to lack of oxygen and/or","options":{"a":"the heat from a fire","b":"internal and external burns from the flames","c":"exposure to toxic gases found in smoke","d":"nonflaming combustion"},"answer":"C"},{"num":40,"text":"During salvage and overhaul operations, firefighters should","options":{"a":"avoid cutting through load-bearing components in a wall","b":"establish a collapse zone before beginning operations","c":"ensure the structure has completely collapsed before beginning operations","d":"avoid using lumber to reinforce or anchor damaged structural components"},"answer":"A"},{"num":41,"text":"Which hose valve appliance combines multiple lines into one","options":{"a":"Siamese","b":"Wye","c":"Large-diameter","d":"Water thief"},"answer":"A"},{"num":42,"text":"A trench cut is usually ordered when:","options":{"a":"the structural integrity of the building is in question.","b":"the IC has determined that the main body of the fire is too large to extinguish.","c":"vertical or horizontal ventilation is not possible.","d":"there are not enough firefighters available to perform vertical ventilation operations."},"answer":"B"},{"num":43,"text":"Which type of nozzles are useful for performing hydraulic ventilation?","options":{"a":"Piercing nozzles","b":"Smooth bore nozzles","c":"Fog nozzles","d":"Broken stream nozzles"},"answer":"C"},{"num":44,"text":"What is one proper ladder lifting and lowering technique","options":{"a":"Lift and lower the butt end of the ladder first.","b":"When lowering, keep your feet perpendicular to the ladder so it rests lightly on your toes.","c":"Lift with your legs, but lower with your back and arms.","d":"Lift on the command of a firefighter who sees all members of the team."},"answer":"D"},{"num":45,"text":"The process of establishing the cause of a fire incident through careful investigation and analysis of available evidence is known as","options":{"a":"salvage.","b":"overhaul.","c":"fire cause determination.","d":"fire investigation."},"answer":"C"},{"num":46,"text":"General maintenance and care of nozzles by firefighters includes","options":{"a":"performing technical maintenance of the nozzles, if needed.","b":"lightly brushing the nozzles with a soft bristle brush instead of using water.","c":"storing nozzles with the control valve bales in the open position.","d":"thoroughly cleaning nozzles after each use with soap and water and a soft bristle brush."},"answer":"D"},{"num":47,"text":"How do low- and medium-pressure bags differ from high-pressure bags?","options":{"a":"Lose stability as they inflate","b":"Are considerably smaller","c":"Inflate to a greater height","d":"Are more stable when inflated"},"answer":"C"},{"num":48,"text":"On a preincident survey floor plan, common symbols are used to show:","options":{"a":"paths of travel","b":"number of appliances","c":"smoke alarm locations","d":"type of construction"},"answer":"D"},{"num":49,"text":"What is one of the advantages of using natural fiber rope","options":{"a":"It can be used for both life safety applications and utility purposes.","b":"It chars rather than melts when exposed to heat.","c":"It has excellent resistance to water, mildew, mold, rotting, and shrinkage.","d":"It can withstand a larger impact load than synthetic rope."},"answer":"B"},{"num":50,"text":"When should a collapse zone be established at a fire incident","options":{"a":"Any time interior operations are taking place","b":"Any time a structure is involved","c":"When an offensive strategy has been adopted","d":"When a defensive strategy has been adopted"},"answer":"D"},{"num":51,"text":"When conducting residential fire and life safety surveys, firefighters should:","options":{"a":"share results with code enforcement","b":"give written warnings for violations","c":"refer occupants to appropriate professionals for repairs","d":"NOT survey rooms with closed doors"},"answer":"C"},{"num":52,"text":"When might firefighters choose an offensive strategy?","options":{"a":"Structural members are burning and part of the fuel load feeding the fire","b":"The fire will be attacked while facing the wind","c":"Lack of appropriate apparatus or equipment to implement required tactics","d":"Benefits of fire attack outweigh the risks to firefighters"},"answer":"D"},{"num":53,"text":"If a basement has ground-level windows or even below-ground-level windows in wells:","options":{"a":"vertical ventilation can be employed effectively.","b":"ventilation should NOT be attempted.","c":"horizontal ventilation can be employed effectively.","d":"fires in the basement are likely to be fuel-limited."},"answer":"C"},{"num":54,"text":"Heat from a fire can cause aluminum to","options":{"a":"elongate","b":"spall","c":"melt","d":"crack"},"answer":"C"},{"num":55,"text":"The perimeter for explosions should be established at _____ times the distance from the farthest piece of debris found.","options":{"a":"2.5","b":"5","c":"3","d":"1.5"},"answer":"D"},{"num":56,"text":"Before entering an IDLH environment, you must","options":{"a":"be aware of alternate egress routes.","b":"don the highest PPE available.","c":"know occupant count.","d":"activate PASS."},"answer":"A"},{"num":57,"text":"Early security measures for securing a fire scene include","options":{"a":"determining the area of origin.","b":"restricting access to the scene.","c":"establishing chain of custody procedures.","d":"determining possible evidence."},"answer":"B"},{"num":58,"text":"Roof penetrations and openings","options":{"a":"may be the means of egress for occupants.","b":"should not provide an exit point for any kind of ventilation.","c":"can indicate the location of some types of rooms.","d":"should not be used to gain access to attics and cocklofts."},"answer":"C"},{"num":59,"text":"In which situation would the IC likely communicate the need for a transition from an offensive strategy to a defensive strategy?","options":{"a":"There are not enough personnel on the scene when starting out.","b":"Conditions in a structure deteriorate rapidly and unexpectedly.","c":"The amount of fire has been reduced or extinguished to safe levels.","d":"Adequate water flow is not available."},"answer":"B"},{"num":60,"text":"Which type of knot should be used to hoist a ladder","options":{"a":"Figure-eight follow-through","b":"Clove hitch","c":"Figure-eight on a bight","d":"Half-hitch with an overhand safety knot"},"answer":"C"},{"num":61,"text":"What might be a responsibility of a Firefighter II at cave, mine, and tunnel rescue operations?","options":{"a":"Determining whether the incident is rescue or recovery","b":"Assisting victims that have been removed from the hot zone","c":"Standing by with a charged hoseline","d":"Rescuing victims trapped deep within rubble"},"answer":"B"},{"num":62,"text":"When operating a manually adjustable fog nozzle, the","options":{"a":"rate of water flow and pattern changes should be done as quickly as possible.","b":"operator must make flow rate adjustments while the water is flowing.","c":"rate of water flow and pattern changes should be in small increments.","d":"operator must make flow rate adjustments before before opening the nozzle."},"answer":"C"},{"num":63,"text":"When using pneumatic lifting bags, operators should:","options":{"a":"place on solid surface","b":"inflate quickly","c":"never stack","d":"inflate unloaded"},"answer":"A"},{"num":64,"text":"A rapid transition from the growth stage to the fully developed stage is known as","options":{"a":"pyrolysis","b":"smoke explosion","c":"thermal layering","d":"flashover"},"answer":"D"},{"num":65,"text":"What is the first action to take if structural collapse is likely","options":{"a":"Conduct a roll call to ensure all personnel are safe","b":"Establish scene safety zones","c":"Place apparatus and personnel in the collapse zone","d":"Inform command of the situation as crews exit the structure"},"answer":"D"},{"num":66,"text":"The most common types of ventilation openings made in a flat roof are:","options":{"a":"kerf cuts.","b":"square or rectangular openings.","c":"circular openings.","d":"triangular cuts."},"answer":"B"},{"num":67,"text":"Poor housekeeping or improper disposal of cigarette butts are examples of:","options":{"a":"natural fires","b":"undetermined fires","c":"accidental fires","d":"incendiary fires"},"answer":"C"},{"num":68,"text":"Buildings under construction, renovation, or demolition","options":{"a":"have decreased fire risk","b":"are less susceptible to structural collapse under fire conditions","c":"have increased fire risk","d":"are easier to control and extinguish under fire conditions"},"answer":"C"},{"num":69,"text":"When different departments or agencies share the same dispatch frequency on their pagers, they should","options":{"a":"make sure pagers are off unless they are absolutely needed.","b":"set pagers to the alert setting.","c":"switch each of their pagers to a different frequency.","d":"keep the volume low to limit unwanted radio traffic."},"answer":"B"},{"num":70,"text":"Which part of a ground cover fire runs parallel to the main direction of fire spread and separates the head from the heel?","options":{"a":"Black","b":"Finger","c":"Flank","d":"Perimeter"},"answer":"C"},{"num":71,"text":"Forcing double swinging doors typically involves","options":{"a":"cutting a hole in one of the doors.","b":"removing the hinges on one of the doors.","c":"prying or cutting in the space between where the two doors meet.","d":"removing the hinges on both of the doors."},"answer":"C"},{"num":72,"text":"Buildings with windows that cannot be opened or without windows altogether","options":{"a":"are no longer permitted by modern building codes because they are considered unsafe.","b":"increase the difficulty for tactical ventilation and fire suppression team access.","c":"make it easier for fire personnel to force entry and begin ventilation procedures.","d":"are safer during fire and emergency situations."},"answer":"B"},{"num":73,"text":"What is one guideline for forcing a door to begin interior fire suppression?","options":{"a":"The suppression crew should stand in the doorway while the door is forced open.","b":"The door should be kept closed until the hoseline is charged and crew is ready to enter.","c":"The door should be kept open for several seconds to allow extra airflow before entering.","d":"The door should be opened as wide as possible for maximum stream reach."},"answer":"B"},{"num":74,"text":"When the readings at the low end of the remote pressure gauge do NOT match the reading on the regulator gauge","options":{"a":"reset the regulator gauge.","b":"average the two numbers together.","c":"assume that the lowest reading is correct.","d":"assume that the highest reading is correct."},"answer":"C"},{"num":75,"text":"The main two types of lighting used at emergency scenes are portable and","options":{"a":"telescoping.","b":"fixed.","c":"nonportable.","d":"Immobile."},"answer":"B"},{"num":76,"text":"Combination spreader/cutter tools:","options":{"a":"lack versatility","b":"are last resort tools","c":"cannot cut as forcefully","d":"are used by large departments"},"answer":"C"},{"num":77,"text":"High-efficiency particulate air (HEPA) filters are","options":{"a":"used as protection against airborne pathogens.","b":"commonly found in surgical masks.","c":"designed to provide fresh air in oxygen-deficient atmospheres.","d":"designed for reuse at contaminated incidents."},"answer":"A"},{"num":78,"text":"The use of a lesson plan ensures that:","options":{"a":"different presenters cover all important topics","b":"the audience will be fully educated","c":"presenters cannot improvise","d":"any firefighter can teach regardless of experience"},"answer":"A"},{"num":79,"text":"What is an example of a nonemergency exit indicator","options":{"a":"SCBA failure","b":"Indications of new hazards","c":"Changes in environmental conditions","d":"An air cylinder needs replaced"},"answer":"D"},{"num":80,"text":"Which of the following is an example of direct fire control?","options":{"a":"Cooling gases then closing the door","b":"Producing steam","c":"Directing water onto the ceiling","d":"Applying water directly to the seat of the fire until it is extinguished"},"answer":"D"},{"num":81,"text":"During initial assessment of an extrication scene, responders must:","options":{"a":"determine time","b":"determine fault","c":"assess vehicle position","d":"contact law enforcement"},"answer":"C"},{"num":82,"text":"Which statement about local protocol for radio communications is accurate","options":{"a":"Basic communication rules differ among jurisdictions and local protocols take precedence.","b":"Local protocol may require transmissions be recorded and become part of the official record on the incident.","c":"There should be multiple radio channels established by local SOPs specific to the emergency and agencies responding.","d":"Local protocol establishes the agency specific codes that should be used."},"answer":"B"},{"num":83,"text":"When any evacuation signal is given","options":{"a":"crews wait for occupants.","b":"crews declare MAYDAY.","c":"all units give a PAR.","d":"crews activate PASS."},"answer":"C"},{"num":84,"text":"The first step of the VEIS method is","options":{"a":"vent a window and assess survivability.","b":"vent while entering.","c":"roof ventilation.","d":"use air ducts."},"answer":"A"},{"num":85,"text":"When performing vertical ventilation, personnel:","options":{"a":"should remain at ground level.","b":"must NOT penetrate the ceiling.","c":"may be working above the fire.","d":"must be able to stand on the roof."},"answer":"C"},{"num":86,"text":"When treating patients with tuberculosis, responders should wear:","options":{"a":"N-95 respirators","b":"surgical-style masks","c":"non-latex gloves","d":"helmet shields"},"answer":"A"},{"num":87,"text":"The first task during size-up of water and ice rescue operations is to determine whether:","options":{"a":"victims can help with their own rescue or need full assistance","b":"an incident requires rescue or recovery","c":"victims require immediate care or transport back to a medical facility","d":"personal flotation devices (PFDs) or structural PPE is needed"},"answer":"B"},{"num":88,"text":"Oxygen concentrations above the upper explosive limit (UEL) are said to be too _____ to burn","options":{"a":"rich","b":"lean","c":"heavy","d":"dense"},"answer":"A"},{"num":89,"text":"When performing a positive-pressure attack (PPA), the fan must create:","options":{"a":"enough pressure to force smoke and heat to the desired exhaust openings.","b":"multiple paths for the smoke and heat to travel.","c":"an exhaust-to-intake ratio of 1 to 1.","d":"enough pressure to push fresh air to the desired intake area."},"answer":"A"},{"num":90,"text":"Smothering extinguishing agents will NOT work on materials that:","options":{"a":"have undergone saponification.","b":"are combustible.","c":"contain their own oxidizing agent.","d":"do not conduct electricity."},"answer":"C"},{"num":91,"text":"PASS device. Sheltering in place may be required when","options":{"a":"collapse is imminent.","b":"contamination is likely.","c":"victims are incapacitated and cannot be moved.","d":"fire growth is imminent."},"answer":"C"},{"num":92,"text":"What is the purpose of the National Fallen Firefighter Foundation's (NFFF) 16 Firefighter Life Safety Initiatives","options":{"a":"To honor firefighters who have died in the line of duty","b":"To specify minimum requirements for a fire department safety and health program","c":"To provide the fire service with a blueprint for making changes","d":"To educate the public on fire and life safety"},"answer":"C"},{"num":93,"text":"The failure of windows, doors, and structural members as a result of heat/fire exposure is known as ____ ventilation.","options":{"a":"vertical","b":"mechanical","c":"unplanned","d":"tactical"},"answer":"C"},{"num":94,"text":"The numerical rating for Class B portable fire extinguishers is based on:","options":{"a":"the amount of heat from a fire that an extinguisher can absorb before malfunctioning.","b":"the amount of water and the duration and range of the discharge.","c":"the approximate square-foot area that a nonexpert operator can extinguish using one full extinguisher.","d":"electrical conductivity of the extinguishing agent."},"answer":"C"},{"num":95,"text":"What is the difference between an awning and hopper window","options":{"a":"An awning is hinged at the top; a hopper is hinged at the bottom.","b":"An awning has one sash; a hopper has two sashes.","c":"An awning opens vertically; a hopper opens horizontally.","d":"An awning has an inward-swinging sash; a hopper has an outward-swinging sash."},"answer":"A"},{"num":96,"text":"Dressing a knot means to","options":{"a":"tighten it slightly, while still leaving some slack.","b":"temporarily tie a knot that can be undone by simply pulling on it.","c":"connect it to a stationary object or webbing.","d":"tighten it until snug and remove all slack."},"answer":"D"},{"num":97,"text":"Where should you stand when opening a ceiling","options":{"a":"Directly under the area to be opened","b":"In the exit doorway","c":"In an adjacent room or area","d":"Between the area being pulled and the exit doorway"},"answer":"D"},{"num":98,"text":"When rot is discovered on a natural fiber laid rope, the rotten rope and any surrounding ropes must be","options":{"a":"downgraded to utility rope.","b":"washed with water and a light detergent.","c":"removed from service and destroyed.","d":"removed from service and cleaned and reinspected."},"answer":"D"},{"num":99,"text":"Mitigating electrical hazards for ladder operations includes","options":{"a":"contacting the utility company to disable power lines in the path of the ladder.","b":"using insulated protection plates on the ladder where it will come in contact with power lines.","c":"using wooden ladders with no metal components that will conduct electricity.","d":"keeping a distance of at least 10 feet (3 m) from all electrical lines."},"answer":"D"},{"num":100,"text":"Firefighters not on extrication teams may assist by:","options":{"a":"setting SAR systems","b":"establishing command","c":"standing by with hoseline","d":"serving as backup team"},"answer":"C"},{"num":101,"text":"The most obvious sign of fire cause is:","options":{"a":"unburned debris","b":"amount of damage","c":"smoke color and shape","d":"a competent ignition source"},"answer":"D"},{"num":102,"text":"Maintenance of power rescue tools includes:","options":{"a":"replacing saw blades after each use","b":"keeping battery packs fully charged","c":"changing fluids after each use","d":"draining pneumatic air cylinders"},"answer":"B"},{"num":103,"text":"Portable fire extinguishers are classified according to the:","options":{"a":"extinguishers' ability to absorb heat.","b":"type of fire that each is designed to extinguish.","c":"type of contents inside the extinguisher.","d":"extinguishers' capacity."},"answer":"B"},{"num":104,"text":"Assisting a conscious victim down a ladder involves","options":{"a":"placing the ladder alongside the window to the upwind side.","b":"using two firefighters to lower the victim down the ladder.","c":"using the on-the-knee and cross-body methods to carry the victim down a ladder.","d":"lowering the victim feet first onto a ladder."},"answer":"D"},{"num":105,"text":"When dealing with public complaints or inquiries, firefighters should:","options":{"a":"not attempt resolution","b":"know the range of services available","c":"be assertive if misguided","d":"always refer to the PIO"},"answer":"B"},{"num":106,"text":"The use of tether lines allows","options":{"a":"movement away from the search line.","b":"replacement of main line.","c":"last-resort use only.","d":"parallel searching."},"answer":"A"},{"num":107,"text":"If battery cables must be removed, how should they be disconnected?","options":{"a":"Positive first","b":"Negative first","c":"Only negative","d":"Only positive"},"answer":"B"},{"num":108,"text":"The use of a cutting torch in or near an explosive environment","options":{"a":"is not permitted.","b":"requires an operator with specialized training.","c":"requires a charged hoseline to be in place.","d":"is only allowed if using plasma cutters."},"answer":"A"},{"num":109,"text":"Life safety rope at a rescue incident should be used for","options":{"a":"designating control zones.","b":"stabilizing objects.","c":"hoisting and lowering tools and equipment.","d":"lifting victims and rescuers."},"answer":"D"},{"num":110,"text":"Firefighters reduce foam environmental hazards by:","options":{"a":"using alternatives near water","b":"reporting foam usage","c":"diluting runoff","d":"preventing foam from entering water"},"answer":"D"},{"num":111,"text":"If a standpipe connection is in a protected stairway, hoselines:","options":{"a":"should be connected on the floor above the fire floor","b":"should be connected on the floor below the fire floor","c":"must be connected at ground level","d":"may be connected on the fire floor"},"answer":"D"},{"num":112,"text":"How does cardiocerebral resuscitation (CCR) differ from cardiopulmonary resuscitation (CPR)?","options":{"a":"For CCR, a rescuer does not provide rescue breaths; for CPR a rescuer does provide rescue breaths","b":"For CCR, a rescuer does not provide chest compressions; for CPR a rescuer does provide chest compressions","c":"CCR is performed by a layperson; CPR is performed by advanced-level EMS","d":"A patient assessment is not performed for CCR; a patient assessment must be performed before CPR"},"answer":"A"},{"num":113,"text":"A color change on a heat sensor label indicates the","options":{"a":"ladder has experienced heat exposure.","b":"ladder should be replaced.","c":"label has expired.","d":"ladder is safe to use."},"answer":"A"},{"num":114,"text":"Because postincident reports are public legal documents,","options":{"a":"there may be legal consequences if they are incomplete or incorrect.","b":"there must be a legal representative present when they are written.","c":"they should use codes and language specific to the fire service.","d":"they must be completed by a fire officer or fire inspector."},"answer":"A"},{"num":115,"text":"Gloves that have been used to handle a patient should be disposed of by:","options":{"a":"rinsing off the gloves in warm water before pulling them off","b":"pulling on the finger of each glove until it is loose, then quickly yanking it off","c":"other personnel wearing gloves that have not been contaminated","d":"placing two clean fingers on the inside of the glove and peeling it off"},"answer":"D"},{"num":116,"text":"During a fire station tour:","options":{"a":"children should never handle PPE","b":"station mascots should be used","c":"keep all groups together","d":"children should never be allowed to climb on apparatus"},"answer":"C"},{"num":117,"text":"What is the purpose of a Memorandum of Understanding (MOU)","options":{"a":"To discover which departments need additional training and equipment","b":"To ensure all agencies in a jurisdiction use the same SOP practices","c":"To define roles and responsibilities within a Unified Command structure","d":"To ensure that agencies do not impede each other when responding to an incident"},"answer":"C"},{"num":118,"text":"What structure is known as a “drowning machine”?","options":{"a":"Reservoir","b":"Buttress dam","c":"Low-head dam","d":"Levee"},"answer":"C"},{"num":119,"text":"If lost or trapped, air management","options":{"a":"decreases survival time.","b":"increases adrenaline.","c":"increases survival time.","d":"makes little difference."},"answer":"C"},{"num":120,"text":"If there are discrepancies between the image shown on the thermal imager and signs of fire in a concealed space","options":{"a":"the space should be flooded with water and extinguishing agents.","b":"firefighters should assume the space contains non-heat conductive materials.","c":"firefighters should assume there is a hidden fire.","d":"the space should be opened and visually inspected."},"answer":"D"},{"num":121,"text":"The primary use of mobile breathing air fill systems is refilling","options":{"a":"air cylinders at a station.","b":"air cylinders at emergency incidents.","c":"unshielded cylinders.","d":"using an auto-cascade system."},"answer":"B"},{"num":122,"text":"Tactical ventilation should be coordinated with an emphasis on:","options":{"a":"evacuation and sheltering-in-place.","b":"overhaul and property conservation.","c":"decontamination.","d":"controlling oxygen availability."},"answer":"D"},{"num":123,"text":"To help prevent mechanical damage whenever fire hose is used,","options":{"a":"open and close nozzles, valves, and hydrants quickly to limit excessive stress and prevent water hammer.","b":"use the same position for the folds when reloading the hose on apparatus.","c":"deploy hoselines over debris during overhaul operations.","d":"avoid laying or pulling hose over rough, sharp edges or objects."},"answer":"D"},{"num":124,"text":"When making a determination to breach concrete walls, firefighters should remember that","options":{"a":"a firefighter must be standing by with a charged hoseline when breaching.","b":"a jackhammer is the fastest and most efficient tool for breaching concrete walls.","c":"they should only be breached if there is no other alternative.","d":"hand tools are recommended for breaching concrete walls."},"answer":"C"},{"num":125,"text":"When does a fire leave the growth stage","options":{"a":"When a flame's radiated heat begins to transfer more heat than convection","b":"When air begins to entrain onto the fuel package and fire","c":"When it begins to reach rapid fire development","d":"When it cannot grow without the introduction of a new fuel or oxygen source"},"answer":"D"},{"num":126,"text":"Under NIMS-ICS, which section is considered optional or for specific needs","options":{"a":"Command","b":"Planning","c":"Operations","d":"Finance/Administration"},"answer":"D"},{"num":127,"text":"Which hose roll starts at the male coupling end and is rolled toward the female coupling end","options":{"a":"Donut roll","b":"Twin donut roll","c":"Straight roll","d":"Flat roll"},"answer":"C"},{"num":128,"text":"During flaming combustion, what is \"pumped in\" and mixed with fuel gases","options":{"a":"Fresh oxygen","b":"Carbon dioxide","c":"Combustion products","d":"Thermal energy"},"answer":"A"},{"num":129,"text":"Because they are relatively small and offer restricted access, it may be faster and more efficient to cut through the wall around an entire ____ window assembly to remove it","options":{"a":"jalousie","b":"casement","c":"pivoting","d":"projecting"},"answer":"A"},{"num":130,"text":"Which sprinkler system component is a section of vertical piping to which the sprinkler valve and other components are attached?","options":{"a":"Feed main","b":"Riser","c":"Fusible link","d":"Cross main"},"answer":"B"},{"num":131,"text":"Which type of forcible entry tool would be used in cutting operations for a high-security lock","options":{"a":"Hockey puck lock breaker","b":"Hammerhead pick","c":"Duck-billed lock breaker","d":"Locking pliers and chain"},"answer":"D"},{"num":132,"text":"What is one purpose of a postincident report?","options":{"a":"Assess fines and fees to property owners","b":"Determining trends in types of responses","c":"Assess jurisdictional boundaries","d":"Providing eyewitness accounts for criminal proceedings"},"answer":"B"},{"num":133,"text":"The keyway on a single tubular deadbolt lock is located on","options":{"a":"both the inside and outside of the doorknob","b":"both the inside and outside of the door above the knob","c":"the outside of the doorknob","d":"the outside of the door above the doorknob"},"answer":"D"},{"num":134,"text":"Improperly proportioned foam:","options":{"a":"corrodes equipment","b":"produces poor-quality foam","c":"increases environmental hazards","d":"endangers operators"},"answer":"B"},{"num":135,"text":"When stabilizing electric and hybrid electric vehicles, responders should:","options":{"a":"place the transmission in neutral before turning off the ignition","b":"avoid cutting the battery cables that connect to the high-voltage system","c":"always assume vehicles are powered up despite a lack of engine noise","d":"cut the brightly colored cables to cut the power to the vehicle"},"answer":"C"},{"num":136,"text":"In NIMS-ICS, communications between Command Staff and supporting agencies is the responsibility of the ____ Officer","options":{"a":"Public Information","b":"Incident Safety","c":"Incident Command","d":"Liaison"},"answer":"D"},{"num":137,"text":"One advantage of using mechanical ventilation to clear contaminated atmospheres is that it:","options":{"a":"promotes good public relations.","b":"is safer than other methods of ventilation.","c":"replaces natural ventilation.","d":"requires less equipment and personnel."},"answer":"A"},{"num":138,"text":"What is one way you might improve radio reception in a dead zone","options":{"a":"Extend the distance between the radios.","b":"Move inside of a structure.","c":"Use your body to create a physical barrier.","d":"Move to an outside wall of a structure."},"answer":"D"},{"num":139,"text":"In which type of aid agreement is payment made by one organization to another?","options":{"a":"Automatic aid","b":"Mutual aid","c":"Outside aid","d":"Reciprocal aid"},"answer":"C"},{"num":140,"text":"Which type of window can provide the full area of the window opening for ventilation","options":{"a":"Horizontal sliding","b":"Double-hung","c":"Pivoting","d":"Single-hung"},"answer":"C"},{"num":141,"text":"When suppressing incipient fires with an extinguisher, remember that:","options":{"a":"operating an extinguisher close to a fire can scatter lightweight solid fuels.","b":"the agent should be applied from a point where it can disturb the fuel's surface.","c":"only one portable extinguisher should be used on a fire.","d":"larger extinguishers require a closer approach to a fire than smaller units."},"answer":"A"},{"num":142,"text":"What is the difference between hydrocarbons and polar solvents?","options":{"a":"Hydrocarbons are flammable; polar solvents are not","b":"Hydrocarbons float on water; polar solvents mix with water","c":"Polar solvents float on water","d":"Hydrocarbons are nonflammable"},"answer":"B"},{"num":143,"text":"Air chisels cut ____ and remove rivets and bolts.","options":{"a":"wood","b":"heavy metals","c":"exotic metals","d":"medium- to heavy-gauge sheet metal"},"answer":"D"},{"num":144,"text":"Effective structural searches require knowing the","options":{"a":"water supply.","b":"floor plan.","c":"building age.","d":"apparatus ETA."},"answer":"B"},{"num":145,"text":"To assist structural rescue teams, firefighters must be able to:","options":{"a":"provide first aid","b":"rescue deep victims","c":"recognize collapse patterns","d":"create safety zones"},"answer":"C"},{"num":146,"text":"Collapse potential increases in the _____ stage of fire as heat increases in the upper levels and flame spreads to combustible structural members","options":{"a":"growth","b":"incipient","c":"decay","d":"ignition"},"answer":"A"},{"num":147,"text":"What is a chafing block designed to do","options":{"a":"Provide a protective surface over hose when vehicles must drive over it","b":"Protect uncharged hose as it is being pulled over sharp corners of windowsills and roof edges","c":"Carry, pull, and handle charged hoselines or secure charged hoselines to other objects","d":"Protect fire hose from abrasions caused when charged hoselines rub against other surfaces"},"answer":"D"},{"num":148,"text":"Overhaul operations may include","options":{"a":"searching for and extinguishing hidden fires.","b":"conducting fire suppression before salvage operations.","c":"performing field reduction of contaminants.","d":"determining fire cause and origin."},"answer":"A"},{"num":149,"text":"Observations that should be communicated for ground ladder operations include","options":{"a":"nearby traffic patterns.","b":"presence of media personnel or bystanders.","c":"barometric pressure.","d":"wind direction and speed."},"answer":"D"},{"num":150,"text":"Which type of ground cover fire control involves creating a control line quickly using bulldozers or other heavy equipment?","options":{"a":"Parallel attack","b":"Direct attack","c":"Anchor attack","d":"Flank attack"},"answer":"A"},{"num":151,"text":"Open-circuit SCBA uses compressed air, while closed-circuit SCBA uses","options":{"a":"nitrogen.","b":"noncompressed air.","c":"carbon dioxide.","d":"compressed oxygen."},"answer":"D"},{"num":152,"text":"What is one advantage of using a flat-head axe over a pick-head axe during forcible entry operations","options":{"a":"The blade of the axe can penetrate materials easier than the pick-head axe.","b":"The blade of the axe can be used to break window glass.","c":"A flat-head axe can be used to strike another tool.","d":"A flat-head axe is lighter weight and can be swung harder."},"answer":"C"},{"num":153,"text":"At roadway incidents involving bulk transport fires, firefighters should:","options":{"a":"direct runoff into storm drains","b":"use road flares to alert traffic","c":"avoid hose streams until law enforcement clears the scene","d":"determine the exact nature of cargos as soon as possible"},"answer":"D"},{"num":154,"text":"The two primary types of dangerous building conditions are those that contribute to the spread and intensity of the fire and those that","options":{"a":"carry smoke and fire gas away from the building","b":"make the building susceptible to collapse","c":"reduce the amount of oxygen flowing into the building","d":"reduce the fuel load in the building"},"answer":"B"},{"num":155,"text":"If leaving a hazard zone due to an air emergency","options":{"a":"team members leave together.","b":"swap members.","c":"lowest air leaves first.","d":"leave separately."},"answer":"A"},{"num":156,"text":"The span of control organizational principle states that the optimum number of subordinates or functions that a supervisor can control is","options":{"a":"seven.","b":"ten.","c":"three.","d":"five."},"answer":"D"},{"num":157,"text":"Which situation requires a MAYDAY","options":{"a":"injured occupant.","b":"rapid fire development.","c":"hazmat presence.","d":"criminal incident."},"answer":"B"},{"num":158,"text":"When doffing SCBA","options":{"a":"remove the backpack assembly while remaining on air.","b":"remove pants and boots first.","c":"begin in the contaminated area while remaining on air.","d":"leave the regulator connected to the facepiece."},"answer":"A"},{"num":159,"text":"The neutral plane can be found at openings where","options":{"a":"hot gases exit and cooler air enters the compartment","b":"cool air exits and hotter gases enter the compartment","c":"hot air exits and cooler gases enter the compartment","d":"cool gases exit and hotter air enters the compartment"},"answer":"A"},{"num":160,"text":"Unless the situation is urgent, Firefighter IIs can assist at an elevator rescue by:","options":{"a":"ensuring power has not been disconnected","b":"attempting to open hoistway doors","c":"establishing contact with trapped occupants","d":"aligning hoistway and elevator doors"},"answer":"C"},{"num":161,"text":"The size of an extension ladder is indicated by the","options":{"a":"length of the ladder when it is NOT extended.","b":"length of its fly section(s).","c":"full length it can be extended.","d":"length of its bed section."},"answer":"C"},{"num":162,"text":"Which smoke detector detects particles too small to be seen by the naked eye?","options":{"a":"Ionization smoke detectors","b":"Fixed-temperature","c":"Photoelectric","d":"Rate-of-rise"},"answer":"A"},{"num":163,"text":"What should be marked on a preincident survey sketch or map?","options":{"a":"Fire lanes","b":"Traffic areas","c":"Fire hydrant locations","d":"Construction types"},"answer":"C"},{"num":164,"text":"Incidences of tuberculosis (TB) are more prevalent in:","options":{"a":"urban areas","b":"high-density living areas","c":"rural areas","d":"assembly areas"},"answer":"B"},{"num":165,"text":"A primary search is intended to","options":{"a":"be slow and thorough.","b":"rapidly determine victim location.","c":"identify hazmat.","d":"determine tenability."},"answer":"B"},{"num":166,"text":"Glass doors made of tempered glass are designed to","options":{"a":"withstand heat.","b":"break easily.","c":"resist breakage.","d":"be used as a means of egress."},"answer":"C"},{"num":167,"text":"If a metal wall must be breached to allow water to be applied to a fire on the other side of the wall, a","options":{"a":"firefighter should stand by with a Class C rated fire extinguisher","b":"hole should be made just big enough for a charged hoseline to fit through","c":"large circular hole should be made to create a flow path","d":"penetrating nozzle can be driven through the metal siding"},"answer":"D"},{"num":168,"text":"Because forcible entry introduces a new supply of oxygen to the fire in the structure, firefighters should","options":{"a":"enter the structure from another location where they are not directly in the flow path","b":"wait for smoke from the new flow path to clear before beginning operations","c":"keep the door all the way open to allow oxygen to flow out of the structure, if possible","d":"have an interior crew ready to enter the structure before forcing entry"},"answer":"D"},{"num":169,"text":"When two lines are advanced from the same standpipe connection","options":{"a":"deploy both hoselines either down the lower set of stairs or up the stairway.","b":"one hoseline should be charged while the other is uncharged.","c":"2 1/2-inch (65 mm) hoseline must be used.","d":"deploy one down the lower set of stairs and the other up the stairway."},"answer":"D"},{"num":170,"text":"Floors at ground level may consist of a concrete slab or a floor assembly made up of ____ and decking over a crawl space or basement","options":{"a":"balloon framing","b":"platform framing","c":"trusses","d":"Joists"},"answer":"D"},{"num":171,"text":"The presence of roof-mounted equipment on a roof:","options":{"a":"increases collapse hazards.","b":"protects the roof from a spreading fire.","c":"means the roof can most likely withstand the weight of a firefighter.","d":"indicates no ventilation can be performed on the roof."},"answer":"A"},{"num":172,"text":"Part-time paid and paid-on-call are both examples of _____ staffing classifications","options":{"a":"career","b":"officer","c":"combination","d":"Volunteer"},"answer":"D"},{"num":173,"text":"To protect combustible roofs on structures adjacent to a fire building or wildland fire","options":{"a":"perform exposure protection tactics on those structures' roofs","b":"avoid creating a flow path that goes in the direction of the neighboring structures","c":"perform exposure protection tactics on the burning structure","d":"use wind conditions to help blow smoke and hot gases back into the burning structure, if possible"},"answer":"A"},{"num":174,"text":"To prevent water hammer,","options":{"a":"quickly close nozzles, hydrants, control valves, and hose clamps.","b":"use low flow rates in the hose and nozzle.","c":"slowly close nozzles, hydrants, control valves, and hose clamps.","d":"increase the size of the hose and nozzle that is being used."},"answer":"C"},{"num":175,"text":"A preconnected hose load for an attack line","options":{"a":"must only be used if other attack lines are not available.","b":"is placed in the main hose bed.","c":"is placed in an area other than the main hose bed.","d":"must be charged before being deployed from the hose bed."},"answer":"C"},{"num":176,"text":"Which telecommunications system for receiving emergency calls is operated by the fire department, emergency medical service, or law enforcement agency","options":{"a":"Enhanced 9-1-1 (E-9-1-1)","b":"Public Safety Answering Point (PSAP)","c":"Mobile Data Terminal (MDT)","d":"Emergency Services Specific Telecommunications Center"},"answer":"D"},{"num":177,"text":"Personnel can use a thermal imager to:","options":{"a":"analyze smoke movement and air flow in a compartment.","b":"identify the possible location of fire, victims, or liquid levels within containers or a structure.","c":"ensure SCBA is on, full, and operating properly.","d":"determine the best entry point based on wind direction."},"answer":"B"},{"num":178,"text":"Which type of ventilation uses atmospheric conditions to remove smoke and heat through doors or windows, and may require no additional personnel or equipment to set up and maintain?","options":{"a":"Mechanical vertical ventilation","b":"Natural vertical ventilation","c":"Natural horizontal ventilation","d":"Mechanical horizontal ventilation"},"answer":"C"},{"num":179,"text":"Once a vehicle fire has been controlled, firefighters should:","options":{"a":"determine cause","b":"conduct overhaul for extension and hidden fires","c":"deploy airbags","d":"assist victims"},"answer":"B"},{"num":180,"text":"Once MAYDAY is broadcast","options":{"a":"only MAYDAY traffic is allowed.","b":"nearest personnel rescue.","c":"teams remain in place.","d":"all focus on rescue."},"answer":"A"},{"num":181,"text":"Heat transfer rate is best measured by","options":{"a":"pressure differences","b":"oxygen concentrations","c":"heat flux","d":"temperature"},"answer":"C"},{"num":182,"text":"When working with extension ladders:","options":{"a":"use at least three firefighters to perform ladder operations.","b":"grasp extension ladder beams when extending or retracting.","c":"ensure the hooks of the pawls are not seated over the rungs.","d":"do not place more than one person on a ladder section."},"answer":"B"},{"num":183,"text":"When forcing entry through a tempered glass door, remember that","options":{"a":"one of the top corners should be struck first to break the glass","b":"tempered glass will break very easily","c":"the glass does not resist heat","d":"the glass should be broken as a last resort"},"answer":"D"},{"num":184,"text":"Information on the type of security used and the location of lockboxes at a structure can be found","options":{"a":"at a secure location near the structure.","b":"in department SOPs and SOGs.","c":"in preincident surveys.","d":"with the building tenant."},"answer":"C"},{"num":185,"text":"A fire extinguisher laid on its side at an incident signals that the extinguisher is:","options":{"a":"ready for disposal.","b":"ready for use.","c":"inappropriate for the class of fire.","d":"empty."},"answer":"D"},{"num":186,"text":"Which task may be included in the daily inspection of power tool batteries","options":{"a":"Rotating spare batteries into tools being used","b":"Verifying serial numbers","c":"Conducting a deep discharge and recharge","d":"Conducting a voltage check"},"answer":"A"},{"num":187,"text":"One advantage of using a donut roll over a straight roll is that:","options":{"a":"it can easily be identified as out-of-service.","b":"the male coupling is protected in the roll's center.","c":"it makes hose loading and unloading easier.","d":"it rolls out easier with fewer twists and kinks."},"answer":"D"},{"num":188,"text":"Synthetic fiber ropes","options":{"a":"are only permitted for life safety ropes.","b":"have a longer life span than natural fiber ropes.","c":"lose their strength when they get wet.","d":"are prone to mildew and mold."},"answer":"B"},{"num":189,"text":"Which type of extinguisher uses saponification to extinguish Class K fires?","options":{"a":"Aqueous film forming foam (AFFF) extinguisher","b":"Pump-type water extinguisher","c":"Stored-pressure water-mist extinguisher","d":"Stored-pressure wet chemical extinguisher"},"answer":"D"},{"num":190,"text":"One disadvantage of a swinging fire door is it","options":{"a":"must be closed manually during a fire.","b":"cannot be closed during a fire.","c":"must have a clear space around the door to ensure closure.","d":"cannot remain open during normal day-to-day operations."},"answer":"C"},{"num":191,"text":"One issue that a member assistance program can provide assistance for is","options":{"a":"job-related legal issues.","b":"substance use, abuse, and dependence.","c":"exposure to chemicals/carcinogens and infection.","d":"physical fitness and obesity."},"answer":"B"},{"num":192,"text":"When donning a protective hood, firefighters should","options":{"a":"avoid sealing the hood to the SCBA facepiece.","b":"pull the hood on before the protective coat.","c":"secure the facepiece after pulling up the hood.","d":"pull the hood on after the protective coat."},"answer":"B"},{"num":193,"text":"For rope to be reused in life safety situations, it must","options":{"a":"be able to withstand a certain amount of heat and flame.","b":"NOT be stored in rope bags.","c":"have no exposure to chemicals or materials that can deteriorate it.","d":"have its impact load tested."},"answer":"C"},{"num":194,"text":"Which type of power saw is equipped with a variety of changeable blades for cutting wood, masonry, and metal","options":{"a":"Hand saw","b":"Chain saw","c":"Rotary saw","d":"Circular saw"},"answer":"C"},{"num":195,"text":"Why is a party wall considered load-bearing","options":{"a":"It can provide separation to meet the requirements of a specified fire-resistance rating.","b":"It supports the weight of structural components above it.","c":"It supports its own weight only.","d":"It can support a fire load under fire conditions."},"answer":"B"},{"num":196,"text":"A collapse zone must be established","options":{"a":"at the corner of a building involved in an incident","b":"at any structural fire incident","c":"no less than 45 feet (15 m) from the base of the structure","d":"adjacent to any exposed exterior walls of a structure"},"answer":"D"},{"num":197,"text":"Which type of jack is the least stable?","options":{"a":"Hydraulic","b":"Trench screw","c":"Bar screw","d":"Ratchet-lever"},"answer":"D"},{"num":198,"text":"In which control zone do trained personnel mitigate the problem at the scene","options":{"a":"Cold","b":"Medium","c":"Hot","d":"Warm"},"answer":"C"},{"num":199,"text":"Which fire cause may result from lightning or earthquakes?","options":{"a":"Accidental","b":"Undetermined","c":"Incendiary","d":"Natural"},"answer":"D"},{"num":200,"text":"To overcome psychological effects of obscured vision","options":{"a":"control breathing.","b":"use thermal imagers.","c":"receive vocal guidance.","d":"declare MAYDAY."},"answer":"A"},{"num":201,"text":"What do fire departments use to track personnel during training, planned events, and at emergency scenes","options":{"a":"Buddy system","b":"Radios","c":"Personnel accountability systems","d":"Intermittent security briefs"},"answer":"C"},{"num":202,"text":"When attacking trash container fires, one challenge is that:","options":{"a":"toxic products of combustion will be present","b":"overhaul cannot be performed","c":"no effective extinguishing agent exists","d":"hose streams cannot be applied"},"answer":"A"},{"num":203,"text":"To hoist a rotary or chain saw, tie a _____ through the closed handle, and attach the tag line through the handle","options":{"a":"figure-eight bend","b":"figure-eight follow-through","c":"figure-eight follow-through","d":"figure-eight on a bight"},"answer":"B"},{"num":204,"text":"When dismounting apparatus, you should","options":{"a":"exit the apparatus face first.","b":"back out of the cab using the handholds and steps.","c":"dismount on the side exposed to traffic.","d":"jump out of the apparatus onto the ground."},"answer":"B"},{"num":205,"text":"Forcible entry through awning windows requires that you either break the glass or","options":{"a":"force the window lock.","b":"cut the window out from the frame.","c":"pry the window up from the frame.","d":"cut through the glass and window screen with a rotary saw."},"answer":"C"},{"num":206,"text":"Which safety precaution should firefighters follow when refilling an SCBA cylinder","options":{"a":"Fill the cylinder slowly to prevent overheating","b":"Wear structural fire fighting protective clothing","c":"Ensure the cylinder is overfilled so that air can bleed out before use","d":"Perform refilling procedures while wearing the SCBA unit"},"answer":"A"},{"num":207,"text":"Before entering a fire area, the firefighter assigned to the nozzle should:","options":{"a":"have the nozzle fully opened and flowing.","b":"keep the nozzle closed.","c":"bleed the air from the hoseline.","d":"fully open the bale to check pattern."},"answer":"C"},{"num":208,"text":"In solids, off-gassing is a chemical change known as pyrolysis; in liquids, it is a physical change called","options":{"a":"convection","b":"vaporization","c":"oxidation","d":"hydrolization"},"answer":"B"},{"num":209,"text":"Escaping in dense smoke may require a","options":{"a":"crouched walk.","b":"low-profile maneuver.","c":"fast walk.","d":"high-profile maneuver."},"answer":"B"},{"num":210,"text":"Usually, the key to controlling a ground cover fire is to control the:","options":{"a":"head","b":"perimeter","c":"green","d":"heel"},"answer":"A"},{"num":211,"text":"Both the duck-billed lock breaker and hammerhead pick are designed to be inserted into a padlock shackle and","options":{"a":"pried upon until the shackle breaks.","b":"struck with a maul or flat-head axe until the shackles break.","c":"stabilized with locking pliers.","d":"twisted until the interior mechanism of the lock breaks."},"answer":"B"},{"num":212,"text":"What atmospheric hazard may be present in confined spaces?","options":{"a":"Claustrophobia","b":"Lack of lighting","c":"Slippery surfaces","d":"Oxygen deficiency"},"answer":"D"},{"num":213,"text":"When storing hose that has been washed and dried,","options":{"a":"store hose where it is exposed to direct sunlight.","b":"roll the hose with the male end inside the roll.","c":"keep hose unrolled and loose to avoid kinks and prevent damage.","d":"roll the hose with the female end inside the roll."},"answer":"B"},{"num":214,"text":"Which foam proportioning system can attach to the pump panel or hose lay?","options":{"a":"Apparatus-mounted proportioners","b":"In-line foam eductor","c":"Foam nozzle eductor","d":"CAFS"},"answer":"B"},{"num":215,"text":"During combustion, the potential chemical energy of a fuel converts into","options":{"a":"mechanical energy","b":"oxygen","c":"carbon and hydrogen","d":"heat and light"},"answer":"D"},{"num":216,"text":"One way to avoid hazards while riding in fire apparatus is to","options":{"a":"avoid wearing a seat belt if responding to an emergency.","b":"don all PPE that will be needed at the emergency scene before entering the apparatus.","c":"wear fire fighting helmets inside the fire apparatus cab.","d":"secure all loose tools and equipment."},"answer":"D"},{"num":217,"text":"How should the backup firefighter be positioned when using the two-firefighter method to operate a hoseline?","options":{"a":"The backup firefighter should be about 3 feet (1 m) behind, and on the opposite side of the hose, as the nozzle operator.","b":"The backup firefighter should be standing parallel to the nozzle operator on the opposite side of the nozzle.","c":"The backup firefighter should be about 3 feet (1 m) behind, and on the same side of the hose, as the nozzle operator.","d":"The backup firefighter should stand directly behind the nozzle operator so they can support the nozzle operator, not the hose."},"answer":"A"},{"num":218,"text":"When cleaning a ladder","options":{"a":"use steel wool to remove tar, oil, or greasy residues from the ladder.","b":"do not use water to avoid damaging the ladder.","c":"do not use soap or other solvents for cleaning.","d":"use a soft bristle brush and running water."},"answer":"D"},{"num":219,"text":"Which hose roll can easily be transported and carried for special applications such as high-rise or standpipe operations","options":{"a":"Straight roll","b":"Twin donut roll","c":"Horseshoe roll","d":"Donut roll"},"answer":"B"},{"num":220,"text":"When might a large diameter hose (LDH) manifold be used","options":{"a":"When LDH is unavailable to overcome friction loss in exceptionally long hose lays","b":"When a large volume of water is needed near the end of the main supply line","c":"When performing reverse hose lay operations","d":"When supplying ladder pipes unequipped with a permanent waterway"},"answer":"B"},{"num":221,"text":"An indirect attack on a ground cover fire is generally used:","options":{"a":"directly against the flames","b":"at the seat of the fire","c":"against fires too hot, fast, or large for direct attack","d":"for moderate fires"},"answer":"C"},{"num":222,"text":"One advantage of an overhead rolling fire door is it","options":{"a":"can remain open during a fire.","b":"can be used on openings that are a part of the means of egress.","c":"does NOT use wall space next to the door opening.","d":"is NOT designed to be opened under normal conditions."},"answer":"C"},{"num":223,"text":"What information should be kept in fire hose records?","options":{"a":"Date and results of periodic testing","b":"Who last inspected and repaired the hose","c":"Dates the hose was used","d":"Cost of repairs or replacement hose"},"answer":"A"},{"num":224,"text":"A dark, oily toxic smoke during a Type V construction fire is likely an indication that","options":{"a":"glue-laminated beams are burning.","b":"a veneer of stucco or brick is melting.","c":"vinyl siding is melting.","d":"combustible materials are burning."},"answer":"C"},{"num":225,"text":"What is a fire's area of origin","options":{"a":"Area with the most fire damage","b":"Exact physical location where the fire began","c":"General location where the fire began","d":"Area with the least fire damage"},"answer":"C"},{"num":226,"text":"Which type of extinguisher is acceptable for Class D fires?","options":{"a":"Wet chemical","b":"Dry powder","c":"Deionized water","d":"Dry chemical"},"answer":"B"},{"num":227,"text":"For layperson CPR, a higher priority is placed on:","options":{"a":"patient assessment","b":"chest compressions","c":"rescue breathing","d":"clearing airways"},"answer":"B"},{"num":228,"text":"Which type of sprinkler system uses a deluge-type valve, but has closed sprinklers?","options":{"a":"Wet-pipe","b":"Preaction","c":"Dry-pipe","d":"Special extinguishing"},"answer":"B"},{"num":229,"text":"One way to reduce the amount of damage that will result from forcible entry is to","options":{"a":"force door locks before attempting to break door glass.","b":"consider removing doors or windows as one piece before attempting to cut through or break them.","c":"attempt to remove hinges before trying any other methods of forcible entry.","d":"determine the severity of the emergency and the speed with which entry must be"},"answer":"D"},{"num":230,"text":"Striking tools that are used for forcible entry","options":{"a":"have limited use in most forcible entry operations.","b":"are typically prying tools that double as striking tools.","c":"require you to wear proper eye protection.","d":"must be used in combination with another tool."},"answer":"C"},{"num":231,"text":"Which types of ground cover fires are generally limited to forests and are very difficult to extinguish?","options":{"a":"Wildland fires","b":"Crawling fires","c":"Surface fires","d":"Ground fires"},"answer":"D"},{"num":232,"text":"A two-way coupling has","options":{"a":"identical couplings on each end.","b":"nonthreaded male and female couplings.","c":"a Higbee cut to prevent cross threading.","d":"threaded male and female couplings."},"answer":"A"},{"num":233,"text":"When responding to an incident involving underground gas pipes, responders should:","options":{"a":"approach from and stage on the downwind side","b":"contact the utility company immediately","c":"extinguish any gas that has ignited","d":"attempt to shut off the utilities"},"answer":"B"},{"num":234,"text":"A responsibility of the roof ventilation team leader includes:","options":{"a":"coordinating the team's efforts with those of firefighters inside the building.","b":"ensuring the roof team stays until the whole operation is completed.","c":"ensuring there is only one egress point from the roof.","d":"applying a fog stream into the vertical ventilation opening."},"answer":"A"},{"num":235,"text":"The running part of a rope is the end used for","options":{"a":"a tag line.","b":"hoisting or pulling.","c":"tying the knot.","d":"impact loading."},"answer":"B"},{"num":236,"text":"When operating dry-barrel hydrants in areas where subfreezing weather is common, the hydrant should","options":{"a":"be pumped until it is empty to prevent water from freezing in the barrel.","b":"NOT be opened or closed fully.","c":"be opened and closed quickly.","d":"be either completely opened or completely closed."},"answer":"D"},{"num":237,"text":"To help overcome weight and mobility factors created by SCBA units, firefighters should","options":{"a":"avoid donning the air cylinder until it is necessary.","b":"train with the SCBA units.","c":"loosen the harness straps on the SCBA units.","d":"keep the air cylinder pressure low."},"answer":"B"},{"num":238,"text":"Who is responsible for turning utilities back on after a structure fire?","options":{"a":"Incident Safety Officer (ISO)","b":"Fire department","c":"Building owner or manager","d":"Utility provider"},"answer":"D"},{"num":239,"text":"What is the main difference between a fuel-limited fire and a ventilation-limited fire","options":{"a":"A fuel-limited fire has sufficient oxygen for combustion; a ventilation-limited fire does not have enough oxygen to continue to burn or spread","b":"A ventilation-limited fire has sufficient oxygen for combustion; a fuel-limited fire does not have enough oxygen to continue to burn or spread","c":"A ventilation-limited fire begins at the beginning of the incipient stage; a fuel-limited fire may begin during the growth stage","d":"A fuel-limited fire will enter an early stage of decay in the growth stage; a ventilation-limited fire will usually progress through the stages of fire development in order"},"answer":"A"},{"num":240,"text":"In order to remain safe during vertical ventilation, personnel should:","options":{"a":"avoid walking along load-bearing walls before and after ventilating.","b":"NOT secure roof ladders to the roof in case of roof failure or collapse.","c":"start power tools on the ground and hoist them to the roof so as not to start them on the roof.","d":"make sure the angle of the cut is away from the body when using a power saw."},"answer":"D"},{"num":241,"text":"What programs have the intention of limiting exposures, documenting exposures, and providing access to correct treatment options if exposure occurs","options":{"a":"Member assistance programs","b":"Behavioral Health Assistance Programs","c":"Infection and exposure control programs","d":"Firefighter Cancer Support Networks"},"answer":"C"},{"num":242,"text":"The AHJ should establish action levels while performing","options":{"a":"ventilation.","b":"air monitoring.","c":"MAYDAY operations.","d":"rehabilitation."},"answer":"B"},{"num":243,"text":"The goal of positive-pressure ventilation (PPV) is to increase the pressure:","options":{"a":"inside the structure to a level higher than the pressure produced by the fire.","b":"outside the structure to a level that is higher than the pressure inside the structure.","c":"outside the structure to a level higher than the pressure produced by the fire.","d":"inside the structure to a level that is higher than the pressure of the exterior of the structure."},"answer":"D"},{"num":244,"text":"Which NIMS-ICS response section manages all incident tactical activities and tactical priorities","options":{"a":"Planning","b":"Logistics","c":"Operations","d":"Command"},"answer":"C"},{"num":245,"text":"NFPA 1970 requires that structural fire fighting protective coats and trousers have","options":{"a":"retroreflective trim.","b":"a drag rescue device.","c":"wristlets/anklets.","d":"a personal alert safety system (PASS)."},"answer":"A"},{"num":246,"text":"What organizational principle is administered through policies that define acceptable performance and expected outcomes?","options":{"a":"Division of labor","b":"Discipline","c":"Unity of command","d":"Span of control"},"answer":"B"},{"num":247,"text":"Carbon dioxide extinguishers discharge CO₂ gas that:","options":{"a":"cools the fuels below their ignition temperatures.","b":"prevents reignition of the fuels.","c":"suppresses the surface vapors of fuel.","d":"displaces oxygen and smothers the fire."},"answer":"D"},{"num":248,"text":"Hose size is described in terms of","options":{"a":"charged and uncharged lines.","b":"nozzle diameter and length.","c":"attack and supply lines.","d":"hose diameter and length."},"answer":"D"},{"num":249,"text":"When using hand tools to force entry through wood frame walls, it is safest to strike and make cuts","options":{"a":"at one corner of the wall first.","b":"toward the center of the opening you want to make first.","c":"in the middle of the wall first.","d":"at each of the corners first and then work towards the center."},"answer":"B"},{"num":250,"text":"The first and most commonly used method to control external bleeding is:","options":{"a":"direct pressure","b":"indirect pressure","c":"application of a tourniquet","d":"stitches"},"answer":"A"},{"num":251,"text":"Pressurized vessels that contain flammable liquids or gases should be:","options":{"a":"color coded","b":"stenciled with pressure ratings","c":"shut off immediately if leaking","d":"marked with placards or stickers indicating flammable or combustible contents"},"answer":"D"},{"num":252,"text":"Where can the heat sensor label be found on a ladder","options":{"a":"On the lowest rung","b":"On the butt spurs","c":"The inside of each beam","d":"At the tip of the ladder"},"answer":"C"},{"num":253,"text":"To ensure the safety of firefighters and victims at motor vehicle fires and collisions, you must","options":{"a":"work within a protected area.","b":"face vehicle lights towards approaching traffic to slow them down.","c":"only use vehicle lighting at night.","d":"walk in the same direction as oncoming traffic."},"answer":"A"},{"num":254,"text":"In a chain of command, the _____ is at the top and the firefighters at the bottom","options":{"a":"battalion chief","b":"captain","c":"fire marshal","d":"fire chief"},"answer":"D"},{"num":255,"text":"In order to reduce the amount of contamination that is transported back to the station, firefighters should","options":{"a":"add a decon corridor at the scene.","b":"perform field reduction of contaminants once outside the station.","c":"dispose of contaminated PPE.","d":"transport contaminated clothing in the passenger compartment."},"answer":"A"},{"num":256,"text":"Which type of evidence is formed from inferences based on direct evidence?","options":{"a":"Indirect","b":"Trace","c":"Circumstantial","d":"Physical"},"answer":"C"},{"num":257,"text":"What type of emergency incident might require the use of closed-circuit SCBA","options":{"a":"Vehicle and roadway incidents","b":"Wildland fires","c":"Extended hazardous materials incidents","d":"Structural fires"},"answer":"C"},{"num":258,"text":"Which portable fire extinguisher mechanism has compressed air or inert gas within the container that forces the agent out a nozzle when the operator presses the handle?","options":{"a":"Automatic pump","b":"Pressure cartridge","c":"Stored pressure","d":"Manual pump"},"answer":"C"},{"num":259,"text":"When one firefighter is raising an extension ladder from the low-shoulder carry,","options":{"a":"one firefighter cannot raise the extension ladder.","b":"the ladder is raised parallel to the structure rather than perpendicular.","c":"the fly should be fully extended.","d":"a building is used to heel the extension ladder."},"answer":"D"},{"num":260,"text":"Liquids that are less dense than water are","options":{"a":"easily extinguished with water","b":"completely soluble","c":"more difficult to extinguish with water","d":"miscible"},"answer":"C"},{"num":261,"text":"How can Type III construction characteristics influence fire behavior in structure fires","options":{"a":"Plywood I-beams can fail and burn much more rapidly under fire conditions.","b":"High wood concentration can contribute to the intensity of a fire that has started.","c":"Fire can spread in void spaces if there are no fire stops.","d":"Vinyl siding can add another petroleum-based fuel to the structural fire load."},"answer":"C"},{"num":262,"text":"If normal entry is NOT possible in a passenger compartment fire:","options":{"a":"use a prying tool to create an opening","b":"break a window and attack the fire with a medium fog pattern","c":"drive a piercing nozzle through the window or doorframe","d":"direct a stream downward and allow deflection"},"answer":"B"},{"num":263,"text":"When opening the roof of a ventilation-limited structure fire, firefighters should simultaneously:","options":{"a":"create another vertical ventilation exhaust point.","b":"direct water on the fire.","c":"perform horizontal ventilation.","d":"create a trench cut ahead of the fire."},"answer":"B"},{"num":264,"text":"Electric vehicle systems can carry up to _____ volts DC.","options":{"a":"800","b":"350","c":"450","d":"650"},"answer":"D"},{"num":265,"text":"How do emergency responders typically secure an incident scene","options":{"a":"By establishing Incident Command","b":"By establishing control zones","c":"By identifying and removing evidence from the scene","d":"By cordoning off the area by tying ropes or ta
